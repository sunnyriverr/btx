name: Wallet label combined qualification
on:
  push:
    branches: [codex/ci-wallet-label-import-combined]
permissions:
  contents: read
  actions: read
jobs:
  qualify:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: btxchain/btx
          ref: dac9aee53520bd49ed320ec7a49b9072fc7d88d9
          path: accepted-source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Retained build profile prerequisites
        timeout-minutes: 8
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list
          sudo apt-get -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::Retries=1 update
          sudo apt-get -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::Retries=1 install -y --no-install-recommends build-essential cmake ninja-build pkg-config python3 perl libboost-dev libevent-dev libsqlite3-dev libzmq3-dev libqrencode-dev qt6-base-dev qt6-base-dev-tools qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev librsvg2-bin libxdo-dev patchelf
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 13714209829
          run-id: 42708038748
          github-token: ${{ github.token }}
          merge-multiple: true
          path: saved-checkpoint
      # Import the stock daemon separately from the Qt build checkpoint.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: qt-pending-rpc-control-binaries
          run-id: 42918244124
          github-token: ${{ github.token }}
          path: saved-daemon
      - name: Verify cached build and compile only admitted daemon targets
        timeout-minutes: 35
        run: python3 -u build_combined.py
      - name: Verify both previously matched fixtures on the combined daemon
        timeout-minutes: 7
        run: |
          cc -Wall -Wextra -Werror -shared -fPIC read_fault.c -o read_fault.so -ldl
          python3 - <<'PYRUN'
          import json, subprocess, sys
          from pathlib import Path
          result=json.loads(Path('build-records/build-result.json').read_text())
          assert result['passed']
          for case in ('save','read'):
              records = Path('native-records') / case
              cmd = [sys.executable,case+'_fixture.py','--binary','daemon-binaries/candidate',
                     '--expected-sha256',result['binaries']['candidate'],'--records',str(records)]
              if case=='read':
                  cmd += ['--shim','read_fault.so']
              subprocess.run(cmd,check=True,timeout=185)
              assert json.loads((records/'result.json').read_text())['status']=='observation_complete'
          PYRUN
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: wallet-label-combined-build-records
          path: build-records
          retention-days: 14
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: wallet-label-combined-native-records
          path: native-records
          retention-days: 14
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: wallet-label-combined-daemon-binaries
          path: daemon-binaries
          retention-days: 14
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: wallet-label-combined-compiled-checkpoint
          path: compiled-checkpoint
          retention-days: 14
          compression-level: 0
