name: Session1 Atlas market native configure admission
on:
  push:
    branches: [codex/ci-atlas-market-native-admission]
permissions:
  contents: read
  actions: read
concurrency:
  group: session1-atlas-market-native-admission
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'sunnyriverr/btx'
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_UPGRADE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: contrib/devtools/session1-atlas-market-native-admission
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: btxchain/btx
          ref: 23ee567ea8a2d9cad8ca3264f8793e8371b3eb93
          path: product
          persist-credentials: false
      - name: Select pinned isolated Python 3.12
        id: python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          architecture: arm64
          check-latest: false
      - name: Verify checkpoint, configure and expose true build plan
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_APPROVED: 'false'
          BTX_BUILD_PYTHON: ${{ steps.python.outputs.python-path }}
        run: python3 contrib/devtools/session1-atlas-market-native-admission/preflight.py
      - name: Preserve source/build checkpoint without running BTX
        if: always()
        timeout-minutes: 5
        run: python3 contrib/devtools/session1-atlas-market-native-admission/preserve.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: atlas-market-native-admission-records
          path: records
          retention-days: 14
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: atlas-market-native-admission-checkpoint
          path: retained
          compression-level: 0
          retention-days: 14
