name: ModelNet recovery integration preflight
on:
  push:
    branches: [codex/ci-modelnet-recovery-integration]
permissions:
  contents: read
  actions: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: btxchain/btx
          ref: f40eb37a6fb8b665340fe92a2f248ff3f23ec7f6
          path: accepted-source
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 14114517868
          run-id: 43595218373
          github-token: ${{ github.token }}
          path: saved-checkpoint
          merge-multiple: true
      - name: Restore configure and inspect only
        timeout-minutes: 20
        run: |
          set -euo pipefail
          mkdir -p records
          image=ubuntu@sha256:076e7bf82319619f28dd0aa9c02ab34b055ad37100395b4f49a2ffba04fb5e11
          docker pull "$image"
          docker run --rm --init --platform linux/amd64 -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" -e GITHUB_WORKSPACE "$image" bash -e -c 'bash setup.sh && /opt/hostedtoolcache/Python/3.12.16/x64/bin/python3 retain.py' 2>&1 | tee records/preparation.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: modelnet-integrated-configured-checkpoint
          path: configured-checkpoint/
          retention-days: 14
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: modelnet-integrated-preflight-records
          path: |
            pilot-records/
            records/
          retention-days: 14
          if-no-files-found: error
