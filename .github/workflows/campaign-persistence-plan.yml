name: Campaign persistence checkpoint feasibility
on:
  push:
    branches: [codex/ci-campaign-persistence-plan]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 13714209829
          run-id: 42708038748
          github-token: ${{ github.token }}
          merge-multiple: true
          path: saved-checkpoint
      - name: Inspect immutable manifest and build graph without compilation
        timeout-minutes: 3
        run: python3 contrib/devtools/campaign-persistence/inspect_checkpoint.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: campaign-persistence-plan-records
          path: campaign-plan-records
          retention-days: 14
