{
  "name": "Bounded native POSIX governor permit qualification",
  "on": {
    "push": {
      "branches": [
        "codex/ci-governor-posix"
      ]
    }
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "concurrency": {
    "group": "governor-posix",
    "cancel-in-progress": false
  },
  "jobs": {
    "native": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 55,
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "path": "controls",
            "persist-credentials": false,
            "sparse-checkout": "contrib/devtools/windows-main-preflight/governor-repair"
          }
        },
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "repository": "btxchain/btx",
            "ref": "1e2f8b5f12295002334d3390c12cac0bb4ae2aff",
            "path": "accepted-source",
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093",
          "with": {
            "artifact-ids": "14192913058",
            "run-id": "43791539061",
            "github-token": "${{ github.token }}",
            "path": "saved-checkpoint",
            "merge-multiple": true
          }
        },
        {
          "name": "Native environment, retained build, matched service workflow",
          "timeout-minutes": 45,
          "run": "set -euo pipefail\nmkdir -p records\ntest \"$(df -PB1 . | awk 'NR==2 {print $4}')\" -gt 14000000000\nimage=ubuntu@sha256:076e7bf82319619f28dd0aa9c02ab34b055ad37100395b4f49a2ffba04fb5e11\ndocker pull \"$image\"\ndocker run --name governor-posix-build --init \\\n  -v \"$GITHUB_WORKSPACE:$GITHUB_WORKSPACE\" -w \"$GITHUB_WORKSPACE\" \\\n  -e GITHUB_WORKSPACE \"$image\" bash -e -c \\\n  'timeout --kill-after=20s 10m bash controls/contrib/devtools/windows-main-preflight/governor-repair/posix/setup.sh && /opt/hostedtoolcache/Python/3.12.16/x64/bin/python3 controls/contrib/devtools/windows-main-preflight/governor-repair/posix/build.py' \\\n  2>&1 | tee records/console.log\n"
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "if": "always()",
          "with": {
            "name": "governor-posix-records",
            "path": "records/",
            "retention-days": 14,
            "if-no-files-found": "error"
          }
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "if": "always()",
          "with": {
            "name": "governor-posix-binaries",
            "path": "binaries/",
            "retention-days": 14,
            "if-no-files-found": "warn"
          }
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "if": "always()",
          "with": {
            "name": "governor-posix-checkpoint",
            "path": "resume-checkpoint/",
            "retention-days": 14,
            "if-no-files-found": "warn"
          }
        }
      ]
    }
  }
}
