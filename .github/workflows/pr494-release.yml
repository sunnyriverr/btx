name: Release model export preservation
on:
  push:
    branches: [codex/ci-pr494-release]
permissions:
  contents: read
  actions: read
jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: btxchain/btx
          ref: c6f9678dd225572528d06c456c16eb4c78bc637c
          path: accepted-source
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 13714209829
          run-id: 42708038748
          github-token: ${{ github.token }}
          path: saved-checkpoint
          merge-multiple: true
      - name: Build the release helper and test only the two export faults
        timeout-minutes: 59
        run: |
          docker pull ubuntu:22.04
          docker image inspect --format '{{index .RepoDigests 0}}' ubuntu:22.04
          docker run --rm --init --platform linux/amd64 \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" \
            -e GITHUB_WORKSPACE -e RUNNER_TEMP="$GITHUB_WORKSPACE" ubuntu:22.04 bash build.sh
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: export-records
          path: |
            export-records/
            pilot-records/result.json
          retention-days: 14
