name: Windows saved SwapNet runtime probe
on:
  push:
    branches: [codex/ci-windows-swapnet-runtime]
permissions:
  contents: read
  actions: read
concurrency:
  group: windows-swapnet-runtime
  cancel-in-progress: false
jobs:
  probe:
    if: github.repository == 'sunnyriverr/btx'
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: contrib/devtools/windows-swapnet-runtime
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.10'
      - name: Saved binary dependency controls and healthy restart
        env:
          GH_TOKEN: ${{ github.token }}
        run: python contrib/devtools/windows-swapnet-runtime/probe.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: windows-swapnet-runtime-records
          path: records
          retention-days: 14
