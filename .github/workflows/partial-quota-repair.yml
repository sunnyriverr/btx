name: Matching prerequisite baseline quota observation
on:
  push:
    branches: [codex/ci-partial-quota-repair]
permissions:
  contents: read
  actions: read
jobs:
  baseline:
    runs-on: ubuntu-22.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Offline result gates
        run: python3 -B test_results.py
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 13750111820
          run-id: 42787985840
          github-token: ${{ github.token }}
          merge-multiple: true
          path: stock
      - name: Exact same final test against matching prerequisite baseline
        timeout-minutes: 7
        run: |
          echo '46cad5ba2317b73b9cd9008292fbc22a7b3a249f21628e131a1fe705a61294b3  stock/candidate' | sha256sum -c -
          chmod +x stock/candidate
          python3 -u native_fixture.py --binary stock/candidate --expected-sha256 46cad5ba2317b73b9cd9008292fbc22a7b3a249f21628e131a1fe705a61294b3 --output common-baseline-records
          python3 - <<'PYRUN'
          import json
          assert json.load(open('common-baseline-records/observations.json'))['result']=='CONFIRMED'
          PYRUN
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: partial-quota-common-baseline-records
          path: common-baseline-records
          retention-days: 14
