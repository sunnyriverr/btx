name: Wallet setlabel recovery qualification
on:
  push:
    branches: [codex/ci-wallet-setlabel-recovery]
permissions:
  contents: read
  actions: read
jobs:
  qualify:
    runs-on: ubuntu-22.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: sunnyriverr/btx
          ref: c49b5f650fc77766a6d0415fde5998e8e8c9014a
          path: accepted-source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Retained build profile prerequisites
        timeout-minutes: 8
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list
          sudo apt-get -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::Retries=1 update
          sudo apt-get -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::Retries=1 install -y --no-install-recommends build-essential cmake ninja-build pkg-config python3 perl libboost-dev libevent-dev libsqlite3-dev libzmq3-dev libqrencode-dev qt6-base-dev qt6-base-dev-tools qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev librsvg2-bin libxdo-dev patchelf
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 13831693402
          run-id: 42967279511
          github-token: ${{ github.token }}
          merge-multiple: true
          path: saved-checkpoint
      - name: Restore #521 and rebuild the single changed RPC translation unit
        timeout-minutes: 13
        run: PYTHONPATH=. python3 -u setlabel-review/build-setlabel.py
      - name: Run the same SQLite fault and recovery fixture on both daemons
        timeout-minutes: 7
        run: |
          python3 - <<'PYRUN'
          import json, subprocess, sys
          from pathlib import Path
          result=json.loads(Path('build-records/build-result.json').read_text())
          assert result['passed']
          for variant, expected in (('before',1),('after',0)):
              records = Path('native-records') / variant
              run = subprocess.run([sys.executable,'setlabel-review/setlabel_fixture.py','--binary','daemon-binaries/'+variant,
                  '--expected-sha256',result['binaries'][variant],'--records',str(records)],timeout=185)
              assert run.returncode == expected, (variant,run.returncode)
              obs=json.loads((records/'result.json').read_text())
              assert obs['status']=='observation_complete' and obs['fault_hits']=={'ABORT':1,'ROLLBACK':1}
              key='false_success' if variant=='before' else 'oracle_pass'
              assert set(obs['save_probes'])=={'ABORT','ROLLBACK'} and all(p[key] for p in obs['save_probes'].values())
          PYRUN
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: wallet-setlabel-build-records
          path: build-records
          retention-days: 14
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: wallet-setlabel-native-records
          path: native-records
          retention-days: 14
