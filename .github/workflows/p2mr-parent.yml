name: P2MR external parent acceptance
on:
  push:
    branches: [codex/ci-p2mr-external-parent]
permissions:
  contents: read
jobs:
  qualify:
    if: github.repository == 'sunnyriverr/btx'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Checkout owned acceptance scripts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /contrib/devtools/p2mr-parent/
      - name: Checkout exact accepted product
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: btxchain/btx
          ref: 666673a3153225ba264c7870e0e82e354df86765
          path: p2mr-parent-product
          persist-credentials: false
      - name: Verify exact source and capacity
        run: python3 contrib/devtools/p2mr-parent/run.py preflight
      - name: Install Linux prerequisites
        run: python3 contrib/devtools/p2mr-parent/run.py dependencies
      - name: Restore only this task's native build
        id: native-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: p2mr-parent-native
          key: btx-p2mr-external-parent-v1-666673a3-ubuntu24-gcc13-O1-walletON-modelnetON-ssl359
      - name: Build pinned OpenSSL
        run: python3 contrib/devtools/p2mr-parent/run.py openssl
      - name: Configure wallet-enabled node
        run: python3 contrib/devtools/p2mr-parent/run.py configure
      - name: Build maintained node and CLI targets
        run: python3 contrib/devtools/p2mr-parent/run.py build
      - name: Preserve compiled inputs before observing behavior
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: p2mr-parent-native
          key: btx-p2mr-external-parent-v1-666673a3-ubuntu24-gcc13-O1-walletON-modelnetON-ssl359
      - name: Verify supplied-parent wallet workflow
        run: python3 contrib/devtools/p2mr-parent/run.py test
      - name: Preserve evidence and clean owned runtime
        if: always()
        run: python3 contrib/devtools/p2mr-parent/run.py finalize
      - name: Retain qualification records
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: p2mr-parent-acceptance-records
          path: p2mr-parent-results/
          if-no-files-found: error
          retention-days: 7
