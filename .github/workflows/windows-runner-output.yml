name: Windows functional runner redirected output check
on:
  push:
    branches: [codex/ci-windows-functional-failure-output]
permissions:
  contents: read
concurrency:
  group: windows-functional-failure-output
  cancel-in-progress: false
jobs:
  runner-output:
    if: github.repository == 'sunnyriverr/btx'
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: btxchain/btx
          ref: c2e71aafc48a41593277e335c8bc370e45599f01
          path: source
          sparse-checkout: |
            test/functional/test_runner.py
            test/functional/combine_logs.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
      - name: Verify matched failure and passing controls
        run: python control/check_runner.py --source source --records records --patch control/candidate.patch
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-functional-runner-output-receipt
          path: records/
          if-no-files-found: error
          retention-days: 14
