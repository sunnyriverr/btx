name: Transfer exact Mac acceptance archive
'on':
  push:
    branches:
    - codex/ci-mac-current-runtime-transfer
permissions:
  contents: read
  actions: read
jobs:
  transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      timeout-minutes: 5
      with:
        artifact-ids: 13887802085
        run-id: 43085244850
        github-token: ${{ github.token }}
        path: candidate
        merge-multiple: true
    - name: Verify and split exact admitted archive
      run: 'set -euo pipefail

        mapfile -t files < <(find candidate -name ''*.tar.gz'' -type f)

        test "${#files[@]}" -eq 1

        printf ''%s  %s\n'' c26cb175275bb963d7b47e210142a8cfe339346689e1dde4b1ef5f649ede213b
        "${files[0]}" | sha256sum -c -

        mkdir parts

        split -b 12M -d "${files[0]}" parts/package-

        test "$(find parts -type f | wc -l)" -le 8

        sha256sum parts/package-* > parts/manifest.sha256

        '
    - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: mac-current-archive-part-00
        path: parts/package-00
        if-no-files-found: ignore
        compression-level: 0
        retention-days: 3
    - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: mac-current-archive-part-01
        path: parts/package-01
        if-no-files-found: ignore
        compression-level: 0
        retention-days: 3
    - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: mac-current-archive-part-02
        path: parts/package-02
        if-no-files-found: ignore
        compression-level: 0
        retention-days: 3
    - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: mac-current-archive-part-03
        path: parts/package-03
        if-no-files-found: ignore
        compression-level: 0
        retention-days: 3
    - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: mac-current-archive-part-04
        path: parts/package-04
        if-no-files-found: ignore
        compression-level: 0
        retention-days: 3
    - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: mac-current-archive-part-05
        path: parts/package-05
        if-no-files-found: ignore
        compression-level: 0
        retention-days: 3
    - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: mac-current-archive-part-06
        path: parts/package-06
        if-no-files-found: ignore
        compression-level: 0
        retention-days: 3
    - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: mac-current-archive-part-07
        path: parts/package-07
