name: Linux release candidate verification
on:
  push:
    branches: [codex/ci-linux-release-candidate]
permissions:
  contents: read
  actions: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: btxchain/btx
          ref: c6f9678dd225572528d06c456c16eb4c78bc637c
          path: accepted-source
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 13714209829
          run-id: 42708038748
          github-token: ${{ github.token }}
          path: saved-checkpoint
          merge-multiple: true
      - name: Install acceptance prerequisites
        timeout-minutes: 12
        run: |
          . /etc/os-release
          test "$VERSION_ID" = 24.04
          getconf GNU_LIBC_VERSION
          if ! timeout 8s getent ahostsv4 archive.ubuntu.com; then
            # The build container resolved this signed archive during earlier runs.
            docker pull ubuntu:22.04
            mirror_ip=$(docker run --rm ubuntu:22.04 getent ahostsv4 archive.ubuntu.com | awk 'NR==1 {print $1}')
            [[ "$mirror_ip" =~ ^[0-9]+(\.[0-9]+){3}$ ]]
            printf '%s archive.ubuntu.com\n' "$mirror_ip" | sudo tee -a /etc/hosts
          fi
          getent ahostsv4 archive.ubuntu.com
          sources="$RUNNER_TEMP/btx-runtime.sources"
          printf '%s\n' 'Types: deb' 'URIs: http://archive.ubuntu.com/ubuntu/' 'Suites: noble noble-updates noble-security' 'Components: main universe' 'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg' > "$sources"
          apt_opts=(-o "Dir::Etc::sourcelist=$sources" -o Dir::Etc::sourceparts=- -o Acquire::Retries=1 -o Acquire::http::Timeout=15)
          sudo apt-get "${apt_opts[@]}" -o APT::Update::Error-Mode=any update
          sudo apt-get "${apt_opts[@]}" install -y --no-install-recommends libwebkit2gtk-4.1-0 libgtk-3-0t64 libevent-dev libsqlite3-0 libzmq5 libgomp1 libopengl0 libxkbcommon-x11-0 libayatana-appindicator3-1 xdg-desktop-portal xdg-desktop-portal-gtk zenity xvfb xauth dbus-x11 openbox scrot wmctrl xdotool python3-pyatspi at-spi2-core python3-venv
          cp accepted-source/scripts/release/verify_release_btxd.py .
          python3 -m venv engine
          engine/bin/pip install --disable-pip-version-check --retries 1 --index-url https://download.pytorch.org/whl/cpu torch==2.7.1
          engine/bin/pip install --disable-pip-version-check --retries 1 transformers==4.53.3 safetensors==0.5.3
          engine/bin/python -c 'import torch, transformers, safetensors; print(torch.__version__, transformers.__version__)' 
      - name: Restore checkpoint, build and verify archive
        timeout-minutes: 113
        run: |
          docker pull ubuntu:22.04
          image=$(docker image inspect --format '{{index .RepoDigests 0}}' ubuntu:22.04)
          echo "Builder image: $image"
          docker run --rm --init --platform linux/amd64 \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" \
            -e GITHUB_WORKSPACE "$image" bash build.sh
      - name: Observe Qt and native Atlas connection
        id: desktop
        continue-on-error: true
        timeout-minutes: 6
        env:
          BTX_RUN_ATLAS_WINDOW: explicit-native-authorisation
        run: |
          export XDG_CURRENT_DESKTOP=Openbox XDG_SESSION_TYPE=x11
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/atlas-desktop-runtime"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/atlas-desktop-config"
          mkdir -p "$XDG_RUNTIME_DIR" "$XDG_CONFIG_HOME/xdg-desktop-portal"
          chmod 700 "$XDG_RUNTIME_DIR"
          printf '[preferred]\ndefault=gtk\n' > "$XDG_CONFIG_HOME/xdg-desktop-portal/portals.conf"
          timeout --signal=TERM --kill-after=10s 300s dbus-run-session -- xvfb-run -a -s '-screen 0 1440x1000x24 -nolisten tcp' sh -ec 'dbus-update-activation-environment DISPLAY XAUTHORITY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE XDG_RUNTIME_DIR XDG_CONFIG_HOME; timeout 20s gdbus call --session --dest org.freedesktop.portal.Desktop --object-path /org/freedesktop/portal/desktop --method org.freedesktop.DBus.Properties.Get org.freedesktop.portal.FileChooser version > "$GITHUB_WORKSPACE/portal-preflight.log"; openbox > /tmp/atlas-openbox.log 2>&1 & exec /usr/bin/python3 run.py'
      - name: Verify packaged node and guard across restart
        id: lifecycle
        continue-on-error: true
        timeout-minutes: 5
        run: python3 lifecycle.py
      - name: Verify model discovery, interrupted download and offline inference
        id: model
        continue-on-error: true
        timeout-minutes: 10
        run: bash model.sh
      - name: Check complete acceptance and archive identity
        if: always()
        env:
          DESKTOP: ${{ steps.desktop.outcome }}
          LIFECYCLE: ${{ steps.lifecycle.outcome }}
          MODEL: ${{ steps.model.outcome }}
        run: |
          echo "Desktop: $DESKTOP, lifecycle: $LIFECYCLE, model: $MODEL"
          test "$DESKTOP/$LIFECYCLE/$MODEL" = success/success/success
          digest=$(jq -er .candidate_archive_sha256 candidate-input/provenance.json)
          echo "$digest  candidate-input/btx-linux-gui-candidate.tar.gz" | sha256sum --check
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: linux-candidate-test-records
          path: |
            candidate-input/provenance.json
            candidate-input/staging-runpaths.txt
            pilot-records/result.json
            pilot-records/configure.log
            pilot-records/dry-plan.log
            portal-preflight.log
            atlas-window-results/
            lifecycle-records/
            model-results/
          retention-days: 7
