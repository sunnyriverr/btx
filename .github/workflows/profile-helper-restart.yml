{
  "name": "Session2 profile helper restart qualification",
  "on": {
    "push": {
      "branches": [
        "codex/ci-profile-helper-restart"
      ]
    }
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "concurrency": {
    "group": "session2-profile-helper-restart",
    "cancel-in-progress": false
  },
  "jobs": {
    "qualify": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 65,
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "repository": "btxchain/btx",
            "ref": "371013d61dc124a363521df5b94e97f64d2464f2",
            "path": "current-reference",
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093",
          "with": {
            "artifact-ids": 14229026757,
            "run-id": 43872117053,
            "github-token": "${{ github.token }}",
            "path": "saved-checkpoint",
            "merge-multiple": true
          }
        },
        {
          "name": "Restore coherent ModelNet build and qualify restart before/after",
          "timeout-minutes": 60,
          "run": "set -euo pipefail\nmkdir -p records\nimage=ubuntu@sha256:076e7bf82319619f28dd0aa9c02ab34b055ad37100395b4f49a2ffba04fb5e11\ndocker pull \"$image\"\ndocker run --name profile-restart --init -v \"$GITHUB_WORKSPACE:$GITHUB_WORKSPACE\" -w \"$GITHUB_WORKSPACE\" -e GITHUB_WORKSPACE \"$image\" bash -e -c 'timeout --kill-after=20s 10m bash proposal/setup.sh && /opt/hostedtoolcache/Python/3.12.16/x64/bin/python3 proposal/build.py' 2>&1 | tee records/console.log"
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "if": "always()",
          "with": {
            "name": "profile-restart-qualification",
            "path": "records/",
            "retention-days": 14,
            "if-no-files-found": "error"
          }
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "if": "always()",
          "with": {
            "name": "profile-restart-checkpoint",
            "path": "retained-checkpoint/",
            "retention-days": 14,
            "if-no-files-found": "warn"
          }
        }
      ]
    }
  }
}
