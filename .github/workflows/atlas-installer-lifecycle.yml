name: Actual Atlas NSIS lifecycle
on:
  push:
    branches: [codex/ci-atlas-installer-lifecycle]
permissions:
  contents: read
  actions: read
jobs:
  qualify:
    if: github.repository == 'sunnyriverr/btx'
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - name: Preserve source bytes
        shell: pwsh
        run: git config --global core.autocrlf false
      - name: Checkout own qualification fixture
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /contrib/devtools/atlas-installer-lifecycle/
      - name: Reuse exact retained installer without rebuilding
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: atlas-installer-package
          run-id: 41983707124
          github-token: ${{ github.token }}
          path: atlas-package-output
      - name: Verify package identity and documented CRLF-only difference
        shell: pwsh
        run: python contrib/devtools/atlas-installer-lifecycle/resume.py
      - name: Observe actual reinstall and uninstall workflows
        shell: pwsh
        run: python contrib/devtools/atlas-installer-lifecycle/run.py
      - name: Retain small evidence even on failure
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: atlas-installer-observations
          path: atlas-installer-results/
          if-no-files-found: error
          retention-days: 14
