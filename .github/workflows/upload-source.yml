{
  "name": "Session2 bounded cloud source identity",
  "on": {
    "push": {
      "branches": [
        "codex/ci-modelnet-upload-source"
      ]
    }
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "concurrency": {
    "group": "session2-upload-source",
    "cancel-in-progress": false
  },
  "jobs": {
    "observe": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 20,
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Verify archive and retained binary without rebuilding",
          "timeout-minutes": 8,
          "run": "python3 -B probe/stage.py",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          }
        },
        {
          "name": "Run bounded two-case helper observation",
          "timeout-minutes": 10,
          "run": "set -euo pipefail\ndocker run --name s2-upload-source --init -v \"$GITHUB_WORKSPACE:$GITHUB_WORKSPACE\" -w \"$GITHUB_WORKSPACE\" -e GITHUB_WORKSPACE ubuntu@sha256:076e7bf82319619f28dd0aa9c02ab34b055ad37100395b4f49a2ffba04fb5e11 bash probe/runtime.sh 2>&1 | tee records/console.log"
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "if": "always()",
          "with": {
            "name": "upload-source-observation",
            "path": "records/",
            "retention-days": 14,
            "if-no-files-found": "error"
          }
        }
      ]
    }
  }
}
