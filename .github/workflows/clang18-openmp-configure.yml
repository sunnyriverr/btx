name: Clang 18 OpenMP three-object verification
on:
  push:
    branches: [codex/ci-clang18-openmp-configure-a97]
permissions:
  contents: read
concurrency:
  group: clang18-openmp-configure-a97
  cancel-in-progress: false
jobs:
  plan:
    if: github.repository == 'sunnyriverr/btx'
    runs-on: ubuntu-22.04
    timeout-minutes: 24
    defaults:
      run:
        shell: bash
    env:
      BTX_SOURCE: a97af7b3f379e33e3ec65db948468d875ade2841
      LLVM_DEB_VERSION: "1:18.1.8~++20240731024944+3b5b5c1ec4a3-1~exp1~20240731145000.144"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: a97af7b3f379e33e3ec65db948468d875ade2841
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Verify runner and reuse installed dependencies
        timeout-minutes: 7
        run: |
          set -euo pipefail
          mkdir -p plan-records
          exec > >(tee plan-records/setup.log) 2>&1
          test "$(git rev-parse HEAD)" = "$BTX_SOURCE"
          test "$(uname -m)" = x86_64
          . /etc/os-release
          test "$VERSION_ID" = 22.04
          printf 'source=%s\n' "$(git rev-parse HEAD)"
          df -h .
          gcc -dumpfullversion
          cmake --version
          ninja --version
          command -v python
          printf 'runner_tool_cache=%s\n' "${RUNNER_TOOL_CACHE:-unset}"
          deps=(libboost-dev libevent-dev libsqlite3-dev libssl-dev libzmq3-dev pkg-config ninja-build)
          missing=()
          for name in "${deps[@]}"; do
            if ! dpkg-query -W -f='${Status} ${Version}\n' "$name" 2>/dev/null | grep '^install ok installed '; then
              missing+=("$name")
            else
              printf 'reused-installed=%s\n' "$name"
            fi
          done
          curl --fail --silent --show-error --location --max-time 30 https://apt.llvm.org/llvm-snapshot.gpg.key -o "$RUNNER_TEMP/llvm-key.asc"
          expected=6084F3CF814B57C1CF12EFD515CF4D18AF4F7421
          actual=$(gpg --batch --show-keys --with-colons "$RUNNER_TEMP/llvm-key.asc" | awk -F: '$1 == "fpr" && !seen++ {print $10}')
          test "$actual" = "$expected"
          gpg --batch --dearmor -o "$RUNNER_TEMP/llvm-key.gpg" "$RUNNER_TEMP/llvm-key.asc"
          sudo install -m 644 "$RUNNER_TEMP/llvm-key.gpg" /usr/share/keyrings/btx-llvm-ci.gpg
          echo 'deb [arch=amd64 signed-by=/usr/share/keyrings/btx-llvm-ci.gpg] https://apt.llvm.org/jammy/ llvm-toolchain-jammy-18 main' | sudo tee /etc/apt/sources.list.d/btx-llvm-ci.list
          sudo apt-get update -o Acquire::Retries=2
          sudo apt-get install -y --no-install-recommends "${missing[@]}" \
            "clang-18=$LLVM_DEB_VERSION" "libomp-18-dev=$LLVM_DEB_VERSION" "libomp5-18=$LLVM_DEB_VERSION"
          for name in clang-18 libomp-18-dev libomp5-18; do
            test "$(dpkg-query -W -f='${Version}' "$name")" = "$LLVM_DEB_VERSION"
          done
          clang++-18 --version
          clang++-18 -dumpmachine
          if ! python -c 'import cryptography; print(cryptography.__version__)'; then
            python -m pip install --only-binary=:all: cryptography==46.0.4
          fi
          dpkg-query -W -f='${Package}\t${Version}\t${Architecture}\n' > plan-records/dpkg.tsv
      - name: Configure with compiler probes and inspect only the three object rules
        timeout-minutes: 8
        run: |
          set -euo pipefail
          cmake -S . -B build-plan -G Ninja \
            -DCMAKE_C_COMPILER=/usr/bin/clang-18 -DCMAKE_CXX_COMPILER=/usr/bin/clang++-18 \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DPython3_EXECUTABLE="$(command -v python)" \
            -DENABLE_WALLET=ON -DBUILD_TESTS=ON -DBUILD_GUI=OFF -DBUILD_BENCH=OFF \
            -DWITH_SQLITE=ON -DWITH_BDB=OFF -DWITH_MODELNET=OFF \
            2>&1 | tee plan-records/configure.log
          cp build-plan/CMakeCache.txt plan-records/
          python - <<'PY'
          import json
          from pathlib import Path
          import shlex
          import re
          import subprocess

          targets = {
              "src/wallet/shielded_wallet.cpp":
                  "src/wallet/CMakeFiles/bitcoin_wallet.dir/shielded_wallet.cpp.o",
              "src/matmul/matmul_v4_rc_stage3_v13_terminal_fold_parent.cpp":
                  "src/CMakeFiles/bitcoin_common.dir/matmul/matmul_v4_rc_stage3_v13_terminal_fold_parent.cpp.o",
              "src/test/matmul_v4_rc_stage3_multirow_v11_unified_verifier_air_tests.cpp":
                  "src/test/CMakeFiles/test_btx.dir/matmul_v4_rc_stage3_multirow_v11_unified_verifier_air_tests.cpp.o",
          }
          root = Path.cwd()
          build = root / "build-plan"
          records = root / "plan-records"
          db = json.loads((build / "compile_commands.json").read_text())
          cache = (build / "CMakeCache.txt").read_text()
          omp_flags = shlex.split(next(line.split("=", 1)[1] for line in cache.splitlines()
                                       if line.startswith("OpenMP_CXX_FLAGS:STRING=")))
          assert any(flag in {"-fopenmp", "-fopenmp=libomp"} for flag in omp_flags), omp_flags
          assert "OpenMP_CXX_LIB_NAMES:STRING=omp" in cache or "OpenMP_CXX_LIB_NAMES:STRING=omp;" in cache
          omp_path = next(line.split("=", 1)[1] for line in cache.splitlines()
                          if line.startswith("OpenMP_omp_LIBRARY:FILEPATH="))
          assert Path(omp_path).is_file()
          report = []
          for source, obj in targets.items():
              matches = [row for row in db if Path(row["file"]).resolve() == root / source]
              assert len(matches) == 1, (source, len(matches))
              entry = matches[0]
              args = shlex.split(entry["command"])
              (records / (Path(source).stem + ".command.json")).write_text(json.dumps(entry, indent=2) + "\n")
              assert args[0] == "/usr/bin/clang++-18" and all(flag in args for flag in omp_flags), (source, args)
              assert args[args.index("-o") + 1] == obj and "-c" in args, source
              assert not (build / obj).exists(), obj
              plan = subprocess.check_output(["ninja", "-C", str(build), "-t", "query", obj], text=True)
              order_keys = [line.strip()[3:] for line in plan.splitlines() if line.strip().startswith("|| ")]
              graph = plan + "".join("\n" + subprocess.check_output(
                  ["ninja", "-C", str(build), "-t", "query", key], text=True) for key in order_keys)
              name = Path(source).stem
              (records / (name + ".query.txt")).write_text(graph)
              dry = subprocess.check_output(["ninja", "-C", str(build), "-n", "-v", obj], text=True)
              (records / (name + ".dry-run.txt")).write_text(dry)
              # Query the graph directly. Ninja dry runs can stop at regeneration.
              graph_args = ["ninja", "-C", str(build), "-t"]
              dot = subprocess.check_output(graph_args + ["graph", obj], text=True)
              (records / (name + ".graph.dot")).write_text(dot)
              commands = subprocess.check_output(graph_args + ["commands", obj], text=True).splitlines()
              single = subprocess.check_output(graph_args + ["commands", "-s", obj], text=True).splitlines()
              assert len(single) == 1 and single[0] in commands and obj in single[0], obj
              assert "clang++-18" in single[0] and all(flag in shlex.split(single[0]) for flag in omp_flags)
              assert re.search(r"\s-c\s", single[0]), obj
              (records / (name + ".ninja-command.txt")).write_text(single[0] + "\n")
              (records / (name + ".closure.txt")).write_text("\n".join(commands) + "\n")
              compiled = sum(bool(re.search(r"\s-c\s", item) and re.search(r"\s-o\s", item))
                             for item in commands)
              summary = {"commands_including_target": len(commands),
                         "compile_like_commands_including_target": compiled,
                         "other_commands": len(commands)-compiled,
                         "target_command_only": single[0]}
              assert compiled >= 1 and not (build / obj).exists(), obj
              report.append({"source": source, "object": obj, "command": entry["command"],
                             "working_directory": entry["directory"], "order_only_edges": order_keys,
                             "dry_run_steps": sum(line.startswith("[") for line in dry.splitlines()),
                             "cold_graph": summary})
          (records / "result.json").write_text(json.dumps(
              {"status": "PASS", "source": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
               "libomp": omp_path, "objects_built": False, "modelnet": False, "rules": report},
              indent=2) + "\n")
          PY
      - name: Verify generated headers and run exactly three retained compile commands
        timeout-minutes: 12
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import shlex
          import subprocess

          source = Path.cwd()
          build = source / "build-plan"
          records = source / "plan-records"
          plan = json.loads((records / "result.json").read_text())
          expected = {"matmul_v4_rc_stage3_multirow_v11_unified_verifier_air_tests": "202ed361af963f0ba4491c5cbe22fc1ea691119c1db624dd20c9faa9c749b01f", "matmul_v4_rc_stage3_v13_terminal_fold_parent": "2da941b3e24f7b09205c9bf0f466d573f37622a6f2042b1153c327c5da03fbd7", "shielded_wallet": "bdcf472c7e1d1bea7043302a7ae934e80c7f9a402f30168f9d72e433f073adcd"}
          assert plan["source"] == subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert plan["status"] == "PASS" and len(plan["rules"]) == 3 and not plan["objects_built"]
          jobs = []
          generators = {}
          script_root = source / "cmake/script"
          cmake_scripts = {script_root / name for name in (
              "GenerateBuildInfo.cmake", "GenerateHeaderFromRaw.cmake", "GenerateHeaderFromJson.cmake")}
          for row in plan["rules"]:
              name = Path(row["source"]).stem
              command = (records / (name + ".ninja-command.txt")).read_bytes()
              assert hashlib.sha256(command).hexdigest() == expected.pop(name)
              args = shlex.split(command.decode())
              obj = build / row["object"]
              assert args[0] == "/usr/bin/clang++-18" and "-fopenmp=libomp" in args
              assert args[-2:] == ["-c", str(source / row["source"])]
              assert args[args.index("-o") + 1] == row["object"]
              assert not obj.exists()
              jobs.append((name, args, obj))
              for line in (records / (name + ".closure.txt")).read_text().splitlines():
                  cmd = shlex.split(line)
                  if len(cmd) < 5 or cmd[0] != "cd" or cmd[2] != "&&":
                      continue
                  cwd, argv = Path(cmd[1]), cmd[3:]
                  out = None
                  if Path(argv[0]).name == "cmake" and "-P" in argv and Path(argv[argv.index("-P")+1]) in cmake_scripts:
                      out = next(Path(x.split("=", 1)[1]) for x in argv
                                 if x.startswith(("-DHEADER_PATH=", "-DBUILD_INFO_HEADER_PATH=")))
                  elif Path(argv[0]).name == "python" and argv[1] == str(source / "contrib/swapnet/generate_embedded.py"):
                      out = Path(argv[-1])
                  if out is not None:
                      assert cwd.is_relative_to(build) and out.is_relative_to(build) and out.suffix == ".h"
                      assert out not in generators or generators[out] == (cwd, argv)
                      generators[out] = (cwd, argv)
          assert not expected and len(jobs) == 3
          config = build / "src/bitcoin-build-config.h"
          assert config.is_file() and config.stat().st_size > 0
          generated = {str(config.relative_to(build)): hashlib.sha256(config.read_bytes()).hexdigest()}
          with (records / "header-generation.log").open("wb") as log:
              for out, (cwd, argv) in generators.items():
                  assert argv[0] != "/usr/bin/clang++-18"
                  subprocess.run(argv, cwd=cwd, stdout=log, stderr=subprocess.STDOUT, check=True, timeout=30)
                  assert out.is_file() and out.stat().st_size > 0
                  generated[str(out.relative_to(build))] = hashlib.sha256(out.read_bytes()).hexdigest()
          (records / "generated-inputs.json").write_text(json.dumps(generated, indent=2) + "\n")

          results = []
          for name, args, obj in jobs:
              obj.parent.mkdir(parents=True, exist_ok=True)
              assert not obj.exists()
              with (records / (name + ".compile.log")).open("wb") as log:
                  try:
                      proc = subprocess.run(args, cwd=build, stdout=log, stderr=subprocess.STDOUT, timeout=180)
                      code = proc.returncode
                  except subprocess.TimeoutExpired:
                      code = 124
              result = {"source": args[-1], "object": str(obj.relative_to(build)), "exit": code}
              if code == 0:
                  assert obj.is_file() and obj.stat().st_size > 0
                  desc = subprocess.check_output(["file", "-b", str(obj)], text=True).strip()
                  assert "ELF 64-bit" in desc and "relocatable" in desc and "x86-64" in desc
                  depfile = Path(str(obj) + ".d")
                  assert depfile.is_file()
                  deps = depfile.read_text().replace(chr(92) + chr(10), " ")
                  included = [name for name in generated if str(build / name) in deps or name in deps.split()]
                  result.update(sha256=hashlib.sha256(obj.read_bytes()).hexdigest(), format=desc,
                                generated_inputs_in_depfile=included, depfile_sha256=hashlib.sha256(depfile.read_bytes()).hexdigest())
                  (records / (name + ".dependencies.d")).write_bytes(depfile.read_bytes())
              results.append(result)
              (records / "compile-result.json").write_text(json.dumps(
                  {"source": plan["source"], "status": "PASS" if len(results) == 3 and all(r["exit"] == 0 for r in results)
                   else "INCOMPLETE_OR_FAIL", "btX_compile_commands_run": len(results), "linked": False,
                   "commands": results}, indent=2) + "\n")
          assert len(results) == 3 and all(r["exit"] == 0 for r in results)
          PY
      - name: Retain configure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: a97-clang18-three-objects
          path: plan-records/
          if-no-files-found: error
          retention-days: 14
