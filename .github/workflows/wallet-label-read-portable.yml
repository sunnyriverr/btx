name: Wallet label read portability qualification
on:
  push:
    branches: [codex/ci-wallet-label-read-portable]
permissions:
  contents: read
  actions: read
jobs:
  qualify:
    runs-on: ubuntu-22.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: sunnyriverr/btx
          ref: 37deb8f0da4fc52401efa4c8d64eef17b7226d90
          path: accepted-source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Retained build profile prerequisites
        timeout-minutes: 8
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list
          sudo apt-get -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::Retries=1 update
          sudo apt-get -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::Retries=1 install -y --no-install-recommends build-essential cmake ninja-build pkg-config python3 perl libboost-dev libevent-dev libsqlite3-dev libzmq3-dev libqrencode-dev qt6-base-dev qt6-base-dev-tools qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev librsvg2-bin libxdo-dev patchelf
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 13832223525
          run-id: 42969038197
          github-token: ${{ github.token }}
          merge-multiple: true
          path: saved-checkpoint
      - name: Restore #522 and rebuild the single changed RPC translation unit
        timeout-minutes: 13
        run: PYTHONPATH=. python3 -u read-portable/build.py
      - name: Exercise both Linux readers with a mid-file error and healthy retry
        timeout-minutes: 7
        run: |
          cc -Wall -Wextra -Werror -shared -fPIC read_fault.c -o read-base.so -ldl
          cc -Wall -Wextra -Werror -shared -fPIC read-portable/read-stdio-fault.c -o read-stdio.so -ldl
          python3 - <<'PYRUN'
          import json, subprocess, sys
          from pathlib import Path
          result = json.loads(Path('build-records/build-result.json').read_text())
          assert result['passed']
          for variant, shim in (('before', 'read-base.so'), ('after', 'read-stdio.so')):
              records = Path('native-records') / variant
              subprocess.run([sys.executable, 'read_fixture.py', '--binary', 'daemon-binaries/' + variant,
                  '--expected-sha256', result['binaries'][variant], '--records', str(records), '--shim', shim],
                  timeout=185, check=True)
              observed = json.loads((records / 'result.json').read_text())
              assert observed['status'] == 'observation_complete'
              assert observed['fault_hits'] == {'read': 1} and observed['read_probe']['oracle_pass']
          PYRUN
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: wallet-read-portable-build-records
          path: build-records
          retention-days: 14
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: wallet-read-portable-native-records
          path: native-records
          retention-days: 14
