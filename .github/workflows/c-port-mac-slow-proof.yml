name: C-PORT macOS SMILE2 completion
on:
  push:
    branches: [codex/ci-cport-mac-slow-proof]
permissions:
  actions: read
  contents: read
jobs:
  proof:
    runs-on: macos-26
    timeout-minutes: 42
    env:
      OMP_NUM_THREADS: "2"
      OMP_WAIT_POLICY: PASSIVE
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          artifact-ids: 14014797933
          github-token: ${{ github.token }}
          run-id: 43376418783
          path: ${{ runner.temp }}/saved-producer
      - name: Verify ARM64 and the saved test binary
        id: saved
        shell: bash
        run: |
          test "$(uname -m)" = arm64
          sw_vers | tee /tmp/cport-smile2-platform.txt
          mkdir -p evidence
          cp /tmp/cport-smile2-platform.txt evidence/platform.txt
          tar -xf "$RUNNER_TEMP/saved-producer/macos-bin.tar" build/bin/test_btx
          shasum -a 256 build/bin/test_btx | tee evidence/test_btx.sha256
          grep -Eq '^2fc7ce626d664373ccb3fb46def59d57e1cfb645f6332b87d7e837d5f3931817 [ *]build/bin/test_btx$' evidence/test_btx.sha256
          brew install libevent zeromq libomp openssl@3
      - name: Run only the unfinished SMILE2 membership case
        timeout-minutes: 33
        shell: bash
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          case = "smile2_membership_tests/p3_g9_zero_knowledge"
          binary = "build/bin/test_btx"
          cmd = [binary, f"--run_test={case}", "--log_level=test_suite", "--color_output=no"]
          path = Path("evidence")
          with (path / "membership-final.log").open("wb") as log:
              result = subprocess.run(cmd, stdout=log, stderr=subprocess.STDOUT, timeout=1800)
          text = (path / "membership-final.log").read_text(errors="replace")
          (path / "membership-final.json").write_text(json.dumps({"case": case, "exit": result.returncode}) + "\n")
          assert result.returncode == 0
          assert 'Running 1 test case' in text
          assert text.count('Entering test case "p3_g9_zero_knowledge"') == 1
          assert text.count('Leaving test case "p3_g9_zero_knowledge"') == 1
          assert text.count("Leaving test case") == 1
          assert "No errors detected" in text
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: ${{ !cancelled() }}
        with:
          name: macos26-smile2-final-evidence
          path: evidence/
          if-no-files-found: error
