name: Session1 clean public-market node bounded build
on:
  push:
    branches: [codex/ci-public-market-clean-build]
permissions:
  contents: read
  actions: read
concurrency:
  group: session1-public-market-clean-build
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'sunnyriverr/btx'
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_UPGRADE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: contrib/devtools/session1-public-market-clean-build
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: btxchain/btx
          ref: a97af7b3f379e33e3ec65db948468d875ade2841
          path: product
          persist-credentials: false
      - name: Select pinned isolated Python 3.12
        id: python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          architecture: arm64
          check-latest: false
      - name: Restore verified checkpoint and build node/CLI with900-second compiler limit
        timeout-minutes: 23
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_APPROVED: 'true'
          BTX_BUILD_PYTHON: ${{ steps.python.outputs.python-path }}
        run: python3 contrib/devtools/session1-public-market-clean-build/build.py
      - name: Preserve source/build checkpoint without running BTX
        if: always()
        timeout-minutes: 5
        run: python3 contrib/devtools/session1-public-market-clean-build/preserve.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: public-market-clean-build-records
          path: records
          retention-days: 14
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: public-market-clean-build-checkpoint
          path: retained
          compression-level: 0
          retention-days: 14
