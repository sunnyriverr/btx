name: ModelNet HTTPS recovery runner preflight
on:
  push:
    branches: [codex/ci-modelnet-https-timeout-preflight]
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify archive loader and HTTPS MinIO
        run: bash runner.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: modelnet-https-preflight
          path: evidence/
          if-no-files-found: error
          retention-days: 7
