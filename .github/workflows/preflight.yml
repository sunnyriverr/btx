name: MSVC 19.44 daemon-only link for PR 959
on:
  push:
    branches: [codex/ci-msvc-c2e71aaf-configure]
permissions:
  contents: read
concurrency:
  group: btx-msvc-c2e71aaf-configure
  cancel-in-progress: false
jobs:
  configure:
    if: github.repository == 'sunnyriverr/btx'
    runs-on: windows-2022
    timeout-minutes: 82
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: sunnyriverr/btx
          ref: 1332e7a6545c19af3fa04da329fd55845aa1981b
          fetch-depth: 2
          path: source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
      - name: Restore exact static dependencies from this ref
        id: deps
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ runner.temp }}/btx-msvc1944-static-deps
          key: btx-msvc-c2e71aaf-static-14.44-sdk26100-v1
          fail-on-cache-miss: true
      - name: Gate on the 741-action plan and build only btxd
        env:
          BTX_CACHE_HIT: ${{ steps.deps.outputs.cache-hit }}
        run: python control/link-btxd.py
      - name: Inventory the stopped or linked checkpoint
        id: retain
        if: always()
        run: python control/retain-btxd.py
      - name: Save compiled state with its original Ninja graph
        if: always() && steps.retain.outputs.has_objects == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            build-plan
            source
          key: msvc-959-btxd-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Retain the evidence and exact linked executable if present
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: msvc-959-btxd-link-evidence
          path: plan-records/
          if-no-files-found: error
          retention-days: 14
