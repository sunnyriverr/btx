name: PR472 native Mac restricted observation regression
on:
  push:
    branches: [codex/ci-pr472-restricted-view]
permissions:
  contents: read
  actions: read
jobs:
  regression:
    runs-on: macos-15
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /contrib/devtools/mac-resume/
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: btxchain/btx
          ref: 36ab43008cac48aa5c8410e4b70d90a249196a33
          path: product
          persist-credentials: false
      - name: Recreate admitted build prerequisites
        timeout-minutes: 30
        run: python3 contrib/devtools/mac-resume/configure.py
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 13636115219
          run-id: 42524397683
          github-token: ${{ github.token }}
          path: restore-payload
          merge-multiple: true
      - name: Verify retained objects and configuration
        timeout-minutes: 10
        run: python3 contrib/devtools/mac-resume/resume.py
      - name: Current-base and candidate native regression
        timeout-minutes: 55
        run: python3 contrib/devtools/mac-resume/verify.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: pr472-native-records
          path: |
            mac-config-records
            restore-records
            pr472-records
          retention-days: 14
