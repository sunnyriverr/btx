{
  "name": "Session2 release-list hide observation",
  "on": {
    "push": {
      "branches": [
        "codex/ci-modelnet-visibility"
      ]
    }
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "concurrency": {
    "group": "session2-modelnet-visibility",
    "cancel-in-progress": false
  },
  "jobs": {
    "observe": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 30,
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Verify retained helper and source; no rebuild",
          "timeout-minutes": 10,
          "run": "python3 -B proposal/stage.py && python3 -B proposal/current_binary.py",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          }
        },
        {
          "name": "Observe release-list hiding and restart; no build",
          "timeout-minutes": 15,
          "run": "docker run --name s2-modelnet-visibility --init -v \"$GITHUB_WORKSPACE:$GITHUB_WORKSPACE\" -w \"$GITHUB_WORKSPACE\" -e GITHUB_WORKSPACE ubuntu@sha256:076e7bf82319619f28dd0aa9c02ab34b055ad37100395b4f49a2ffba04fb5e11 bash proposal/runtime.sh"
        },
        {
          "name": "Stop only owned test container",
          "if": "always()",
          "run": "docker rm -f s2-modelnet-visibility >/dev/null 2>&1; test -z \"$(docker ps -aq --filter name=^/s2-modelnet-visibility$)\""
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "if": "always()",
          "with": {
            "name": "modelnet-visibility-records",
            "path": "records/",
            "retention-days": 14,
            "if-no-files-found": "error"
          }
        }
      ]
    }
  }
}
