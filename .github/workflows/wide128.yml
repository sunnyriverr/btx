name: Native MSVC 19.44 portable arithmetic check
on:
  push:
    branches: [codex/ci-msvc-native-wide128]
permissions:
  contents: read
concurrency:
  group: msvc-native-wide128
  cancel-in-progress: false
jobs:
  arithmetic:
    if: github.repository == 'sunnyriverr/btx'
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: btxchain/btx
          ref: c2e71aafc48a41593277e335c8bc370e45599f01
          path: source
          sparse-checkout: |
            /src/compat/wide128.h
            /src/test/wide128_tests.cpp
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
      - name: Run only the pinned standalone fixtures
        run: python control/verify.py run
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: msvc-1944-wide128-runtime-evidence
          path: records/
          if-no-files-found: error
          retention-days: 14
