name: C-PORT native Windows default targets

on:
  workflow_dispatch:
  push:
    branches: ['ci-0.34.16/c-port-native']

concurrency:
  group: btx-c-port-native-default-targets-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  RELEASE_BRANCH: "release-0.34.16"
  UPSTREAM_URL: "https://github.com/btxchain/btx.git"
  OSSL_VER: "3.5.4"
  OSSL_SHA256: "967311f84955316969bdb1d8d4b983718ef42338639c621ec4c34fddef355e99"
  BOOST_PIN_VER: "1.81.0"
  BOOST_PIN_SHA256: "205666dea9f6a7cfed87c7a6dfbeb52a2c1b9de55712c9c1a87735d7181452b6"
  # ccache 4.14.2 (18 Oct 2026); sha256 = the GitHub release asset digest of ccache-4.14.2-windows-x86_64.zip.
  CCACHE_WIN_VER: "4.14.2"
  CCACHE_WIN_SHA256: "6993ce645e53192cec592ee23186200b574ac4c59097ecde8d9cfd681b47ae84"
  # The vcpkg commit of the native Windows runs reported on #356 (3 Nov 2026); vcpkg.json's builtin-baseline
  # (c82f7466, 2024.09.30) still decides the port versions.
  VCPKG_COMMIT: "afa249f12f52ed8a3b919f195495ba8b330288d1"
  WIN_NATIVE_TARGETS: "btxd btx-cli btx-tx btx-util btx-modeld"
  # The pin of ci/lint/04_install.sh; sha256 of shellcheck-v0.8.0.linux.x86_64.tar.xz, checked 12 Nov 2026.
  SHELLCHECK_VER: "v0.8.0"
  SHELLCHECK_SHA256: "ab6ee1b178f014d1b86d1e24da20d1139656c8b0ed34d2867fbb834dad02bf0a"
  TIDY_LLVM_V: "19"
  UNIT_EXCLUDE: "^matmul_v4_rc_stage3_"
  KNOWN: "contrib/ci-fork/known-failing.txt"
  CCACHE_MAXSIZE: "2500M"
  CCACHE_COMPRESS: "true"
  CCACHE_NOHASHDIR: "true"
  CCACHE_COMPILERCHECK: "content"
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_NO_ANALYTICS: "1"
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
  PYTHONUNBUFFERED: "1"
  LINUX_TEST_TARGETS: "test_btx btxd btx-cli btx-open btx-modeld btx-wallet btx-util btx-hcpd btx-tx btx-hosted"
  CORE_SUITES: "util_tests,crypto_tests,hash_tests,key_tests,base58_tests,bech32_tests,uint256_tests,arith_uint256_tests,serialize_tests,streams_tests,script_tests,transaction_tests,sighash_tests,coins_tests,mempool_tests,validation_tests,blockchain_tests,net_tests,addrman_tests,getarg_tests,fs_tests,sock_tests,pq_crypto_tests,wallet_tests,lightwatch_tests,lab_lifecycle_tests,nif_sandbox_tests,guard_permit_tests,native_discovery_tests,cap02_tests,hire01_tests,acc07_tests,fixture_cleanup_tests"
  GUARD_SUITES: "guard_permit_tests,native_discovery_tests,cap02_tests,hire01_tests,acc07_tests"

jobs:
  tools:
    name: tools
    # Every other job needs this one, so this guard keeps the whole workflow off upstream and off every
    # branch except ci-0.34.16 and ci-0.34.16/* (push or manual run).
    if: ${{ github.repository_owner != 'btxchain' && (github.ref_name == 'ci-0.34.16' || startsWith(github.ref_name, 'ci-0.34.16/')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Check the CI helpers (selftests, shellcheck) and hand btx_ci.py on
        run: |
          command -v shellcheck >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q shellcheck; }
          python3 -m py_compile contrib/ci-fork/*.py
          python3 contrib/ci-fork/btx_ci.py selftest --job tools
          python3 contrib/ci-fork/coverage_check.py --selftest
          shellcheck contrib/ci-fork/*.sh
          mkdir -p ci-tools
          cp contrib/ci-fork/btx_ci.py ci-tools/btx_ci.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ci-tools
          path: ci-tools/btx_ci.py
          retention-days: 7
          overwrite: true

  # ------------------------------------------------------------------ static checks
  win-native-default-targets:
    name: win-native-default-targets
    needs: tools
    if: ${{ !cancelled() && needs.tools.result == 'success' }}
    runs-on: windows-2025
    timeout-minutes: 355
    env:
      VCPKG_ROOT: 'D:\w\vcpkg'
      VCPKG_DISABLE_METRICS: "1"
      VCPKG_BINARY_SOURCES: 'clear;files,D:\w\vbc,read'
      CCACHE_DIR: 'D:\w\ccache'
      MSYS_NO_PATHCONV: "1"
    steps:
      - name: Start (and keep checkout bytes, no CRLF conversion)
        run: |
          {
            echo "JOB_T0=$(date +%s)"
            echo "LOGS=$RUNNER_TEMP/logs"
            echo "CIPY=$RUNNER_TEMP/ci-tools/btx_ci.py"
            echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/logs" /d/w/vbc /d/w/ccache
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ci-tools
          path: ${{ runner.temp }}/ci-tools
      - name: ccache (official ${{ env.CCACHE_WIN_VER }} release zip, sha256 pinned)
        run: |
          z="ccache-$CCACHE_WIN_VER-windows-x86_64"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$z.zip" "https://github.com/ccache/ccache/releases/download/v$CCACHE_WIN_VER/$z.zip"
          got=$(sha256sum -b < "$RUNNER_TEMP/$z.zip" | cut -d' ' -f1)
          if [ "$got" != "$CCACHE_WIN_SHA256" ]; then
            python "$CIPY" ann error "job=$GITHUB_JOB step=ccache sha256-mismatch got=$got"
            exit 1
          fi
          python -c "import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" "$RUNNER_TEMP/$z.zip" 'D:\w\ccache-bin'
          exe=$(find /d/w/ccache-bin -name ccache.exe | head -n 1)
          [ -n "$exe" ]
          cygpath -w "$(dirname "$exe")" >> "$GITHUB_PATH"
          echo "CCACHE_EXE=$(cygpath -m "$exe")" >> "$GITHUB_ENV"
      - name: Restore OpenSSL
        id: ossl-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: D:\w\ossl
          key: openssl-${{ env.OSSL_VER }}-win-vc-static-noasm-v1
      - name: Require the OpenSSL that win-native-build made
        run: |
          if [ ! -f /d/w/ossl/lib/libcrypto.lib ]; then
            python "$CIPY" ann error "job=$GITHUB_JOB step=openssl-win status=cache-missing (re-run win-native-build first)"
            exit 1
          fi
      - name: vcpkg tool at the pinned commit
        run: |
          if [ ! -d /d/w/vcpkg/.git ]; then git clone --no-checkout https://github.com/microsoft/vcpkg.git 'D:\w\vcpkg'; fi
          git -C 'D:\w\vcpkg' checkout --detach "$VCPKG_COMMIT"
          [ "$(git -C 'D:\w\vcpkg' rev-parse HEAD)" = "$VCPKG_COMMIT" ]
          python "$CIPY" msvc-run --job "$GITHUB_JOB" -- 'D:\w\vcpkg\bootstrap-vcpkg.bat' -disableMetrics
      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: D:\w\vbc
          key: vcpkg-bin-win-static-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-bin-win-static-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}-
            vcpkg-bin-win-static-
      - name: Restore ccache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: D:\w\ccache
          key: ccache-winnative-${{ github.run_id }}-${{ github.run_attempt }}-test
          restore-keys: |
            ccache-winnative-${{ github.run_id }}-
            ccache-winnative-
      - name: Configure (identical to win-native-build, so ccache hits)
        id: configure
        run: |
          python "$CIPY" msvc-run --job "$GITHUB_JOB" --path-prepend 'C:\Program Files\LLVM\bin' --path-drop Strawberry -- \
            python "$CIPY" configure --name winnative --job "$GITHUB_JOB" --logs "$LOGS" --builddir build -- \
            --preset windows-clangcl-static -S . -B build -DBUILD_TESTS=ON -DWITH_MODELNET=ON -DENABLE_WALLET=ON -DWITH_ZMQ=ON \
            -DVCPKG_MANIFEST_NO_DEFAULT_FEATURES=ON '-DVCPKG_MANIFEST_FEATURES=wallet;tests;zeromq' \
            -DVCPKG_INSTALLED_DIR=D:/w/vi -DVCPKG_INSTALL_OPTIONS=--x-buildtrees-root=D:/w/vbt \
            -DOPENSSL_ROOT_DIR=D:/w/ossl -DOPENSSL_USE_STATIC_LIBS=ON -DOPENSSL_MSVC_STATIC_RT=ON \
            -DOPENSSL_INCLUDE_DIR=D:/w/ossl/include -DOPENSSL_CRYPTO_LIBRARY=D:/w/ossl/lib/libcrypto.lib \
            -DOPENSSL_SSL_LIBRARY=D:/w/ossl/lib/libssl.lib "-DCMAKE_C_COMPILER_LAUNCHER=$CCACHE_EXE" \
            "-DCMAKE_CXX_COMPILER_LAUNCHER=$CCACHE_EXE" -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Check cache reuse on one generated clang-cl object
        timeout-minutes: 15
        run: |
          set -o pipefail
          target=src/modelnet/CMakeFiles/bitcoin_modelnet.dir/realm_channel.cpp.obj
          "$CCACHE_EXE" --zero-stats
          CCACHE_LOGFILE="$LOGS/cache-object-first.log" python "$CIPY" msvc-run --job "$GITHUB_JOB" --path-prepend 'C:\Program Files\LLVM\bin' --path-drop Strawberry -- ninja -C build -v "$target" > "$LOGS/cache-object-first-build.log" 2>&1
          python -c 'from pathlib import Path; import sys; Path(sys.argv[1]).unlink()' "build/$target"
          CCACHE_LOGFILE="$LOGS/cache-object-second.log" python "$CIPY" msvc-run --job "$GITHUB_JOB" --path-prepend 'C:\Program Files\LLVM\bin' --path-drop Strawberry -- ninja -C build -v "$target" > "$LOGS/cache-object-second-build.log" 2>&1
          "$CCACHE_EXE" --show-stats --verbose | tee "$LOGS/cache-object-stats.txt"
          if grep -Eq 'Result: (direct_cache_hit|preprocessed_cache_hit)' "$LOGS/cache-object-second.log"; then
            echo "Observed a cache hit for the second realm_channel compile." | tee "$LOGS/cache-object-verdict.txt"
          else
            echo "No cache hit observed. Continuing the bounded default build." | tee "$LOGS/cache-object-verdict.txt"
          fi
      - name: Build the default targets on one integrated tree
        timeout-minutes: 300
        run: |
          python "$CIPY" msvc-run --job "$GITHUB_JOB" --path-prepend 'C:\Program Files\LLVM\bin' --path-drop Strawberry -- \
            python "$CIPY" build --name all --logs "$LOGS" --builddir build -- -k 0 -j"$(nproc)"
      - name: Smoke each successfully built target
        if: ${{ !cancelled() && steps.configure.outcome == 'success' }}
        run: |
          python contrib/ci-fork/c-port-native-target-smoke.py --bin build/bin --logs "$LOGS"
      - name: Save ccache
        if: ${{ !cancelled() && steps.configure.outcome == 'success' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: D:\w\ccache
          key: ccache-winnative-${{ github.run_id }}-${{ github.run_attempt }}-test
      - name: Upload logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: logs-win-native-default-targets
          path: ${{ runner.temp }}/logs
          retention-days: 7
          overwrite: true
          if-no-files-found: ignore
