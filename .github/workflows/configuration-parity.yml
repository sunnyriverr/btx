name: CLI configuration parity observation
on:
  push:
    branches: [codex/ci-p2mr-external-parent]
permissions:
  contents: read
jobs:
  qualify:
    if: github.repository == 'sunnyriverr/btx'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: contrib/devtools/configuration-parity
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: btxchain/btx
          ref: 666673a3153225ba264c7870e0e82e354df86765
          path: p2mr-parent-product
          persist-credentials: false
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: p2mr-parent-native
          key: btx-p2mr-external-parent-v1-666673a3-ubuntu24-gcc13-O1-walletON-modelnetON-ssl359
          fail-on-cache-miss: true
      - name: Verify retained binaries and observe real configuration state
        run: python3 contrib/devtools/configuration-parity/run.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: configuration-parity-records
          path: rpc-help-live-results/
          if-no-files-found: error
          retention-days: 7
