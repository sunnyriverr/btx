{
  "name": "Session 2 cloud configuration diagnostic qualification",
  "on": {
    "push": {
      "branches": [
        "codex/ci-modelnet-saved-cloud-config-diagnostic-fix"
      ]
    }
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "concurrency": {
    "group": "session2-saved-cloud-config-diagnostic-fix",
    "cancel-in-progress": false
  },
  "jobs": {
    "qualify": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 50,
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Verify preparation offline",
          "run": "python3 -B -c \"import ast, pathlib; [ast.parse(p.read_text(), filename=str(p)) for p in pathlib.Path('proposal').glob('*.py')]\""
        },
        {
          "name": "Verify #861 checkpoint and retained release baseline",
          "timeout-minutes": 8,
          "run": "python3 -B proposal/stage.py && python3 -B proposal/current_binary.py",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          }
        },
        {
          "name": "Verify both before/after pairs and #861 responsiveness",
          "timeout-minutes": 38,
          "run": "docker run --cpus=2 --memory=7g --name s2-saved-cloud-config-fix-r2 --init -v \"$GITHUB_WORKSPACE:$GITHUB_WORKSPACE\" -w \"$GITHUB_WORKSPACE\" -e GITHUB_WORKSPACE ubuntu@sha256:076e7bf82319619f28dd0aa9c02ab34b055ad37100395b4f49a2ffba04fb5e11 bash -c \"bash proposal/setup.sh && python3 -B proposal/qualify.py\""
        },
        {
          "name": "Remove only owned test container",
          "if": "always()",
          "run": "docker rm -f s2-saved-cloud-config-fix-r2 >/dev/null 2>&1; test -z \"$(docker ps -aq --filter name=^/s2-saved-cloud-config-fix-r2$)\""
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "if": "always()",
          "with": {
            "name": "saved-cloud-config-fix-records",
            "path": "records/",
            "retention-days": 14,
            "if-no-files-found": "error"
          }
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "if": "always()",
          "with": {
            "name": "saved-cloud-config-fix-binaries",
            "path": "retained-binaries/",
            "retention-days": 14,
            "if-no-files-found": "warn"
          }
        }
      ]
    }
  }
}
