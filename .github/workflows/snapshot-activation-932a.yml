name: Published CPU snapshot load and restart
on:
  push:
    branches: [codex/ci-snapshot-activation-932a]
permissions:
  contents: read
jobs:
  qualify:
    if: github.repository == 'sunnyriverr/btx'
    runs-on: ubuntu-24.04
    timeout-minutes: 125
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: timeout --kill-after=60s 122m bash run.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: snapshot-activation-receipt
          path: records/
          retention-days: 14
