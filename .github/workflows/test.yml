name: Mac ARM shielded fixture functional tests
on:
  push:
    branches: [codex/ci-mac-arm-7d65025b-shielded-fixture-tests]
permissions:
  contents: read
  actions: read
jobs:
  tests:
    if: github.repository == 'sunnyriverr/btx'
    runs-on: macos-15
    timeout-minutes: 32
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_UPGRADE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: btxchain/btx
          ref: 7d65025bb3bff27e4f6c2fdc95f33e4b859a2df5
          path: product
          persist-credentials: false
      - name: Verify retained binaries and run only the three cases
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash run.sh
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: mac-arm-shielded-three-case-results
          path: records/
          if-no-files-found: error
          retention-days: 14
