name: Linux qualification of the two PR 921 recovery cases
on:
  push:
    branches: [codex/ci-linux-921-recovery-tests]
permissions:
  contents: read
  actions: read
jobs:
  qualify:
    if: github.repository == 'sunnyriverr/btx'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: sunnyriverr/btx
          ref: ac98e1471165af28ca10bbdf16e7dfcb3da8b752
          path: product
          fetch-depth: 2
          persist-credentials: false
      - name: Verify retained binary bytes
        timeout-minutes: 6
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p receipt
          python3 -B stage.py
      - name: Verify loader and run the two maintained cases
        timeout-minutes: 11
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpython3.12t64 libzmq5 libevent-core-2.1-7t64 libevent-extra-2.1-7t64 libevent-pthreads-2.1-7t64 python3-cryptography
          for name in btxd btx-cli; do
            ldd "runtime/bin/$name" | tee "receipt/$name.ldd"
            if grep -q 'not found' "receipt/$name.ldd"; then exit 1; fi
            timeout 15 "runtime/bin/$name" --version > "receipt/$name-version.txt"
          done
          /usr/bin/python3 -B run_cases.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: linux-921-recovery-results
          path: receipt/
          if-no-files-found: error
          retention-days: 14
