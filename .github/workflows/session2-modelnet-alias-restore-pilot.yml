{
  "name": "Session 2 ModelNet alias restore pilot",
  "on": {
    "push": {
      "branches": [
        "codex/ci-modelnet-alias-restore-pilot"
      ]
    }
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "concurrency": {
    "group": "session2-modelnet-alias-restore-pilot",
    "cancel-in-progress": false
  },
  "jobs": {
    "qualify": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 35,
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 2
          }
        },
        {
          "name": "Check pinned source parent",
          "run": "test \"$(git rev-parse HEAD^)\" = c97c9a8d00ea37359b8691fd25c783725c1f4021"
        },
        {
          "name": "Verify and restore retained checkpoint on Linux",
          "timeout-minutes": 8,
          "run": "python3 -B proposal/stage.py",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          }
        },
        {
          "name": "Synchronize and verify exact c97c9a8d source",
          "timeout-minutes": 3,
          "run": "python3 -B proposal/sync-source.py"
        },
        {
          "name": "Verify and install complete signed Ubuntu prerequisites",
          "timeout-minutes": 13,
          "run": "docker run -d --cpus=2 --memory=7g --name s2-alias-restore-pilot --init -v \"$GITHUB_WORKSPACE:$GITHUB_WORKSPACE\" -w \"$GITHUB_WORKSPACE\" -e GITHUB_WORKSPACE -v /etc/ssl/certs/ca-certificates.crt:/ubuntu-host-ca.pem:ro ubuntu@sha256:076e7bf82319619f28dd0aa9c02ab34b055ad37100395b4f49a2ffba04fb5e11 sleep infinity\ndocker exec s2-alias-restore-pilot bash proposal/ubuntu-prerequisites.sh"
        },
        {
          "name": "Configure and inspect btx-modeld dry run only",
          "timeout-minutes": 9,
          "run": "docker exec s2-alias-restore-pilot bash -c \"bash proposal/setup.sh && bash proposal/configure-dry-run.sh\""
        },
        {
          "name": "Remove only owned test container",
          "if": "always()",
          "run": "docker rm -f s2-alias-restore-pilot >/dev/null 2>&1; test -z \"$(docker ps -aq --filter name=^/s2-alias-restore-pilot$)\""
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "if": "always()",
          "with": {
            "name": "modelnet-alias-restore-pilot-records",
            "path": "records/",
            "retention-days": 14,
            "if-no-files-found": "error"
          }
        }
      ]
    }
  }
}
