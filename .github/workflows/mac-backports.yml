name: Mac backports focused continuation
on:
  push:
    branches: [codex/ci-mac-backports-697-700]
permissions:
  contents: read
  actions: read
concurrency:
  group: mac-backports-697-700
  cancel-in-progress: false
jobs:
  native:
    if: github.repository == 'sunnyriverr/btx'
    runs-on: macos-15
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_UPGRADE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /contrib/devtools/mac-backports/
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: btxchain/btx
          ref: a5d1637facc925ff176507fae87fc2042940829d
          path: product
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 14136280100
          run-id: 43647289770
          github-token: ${{ github.token }}
          path: producer-restore
          merge-multiple: true
      - name: Finish focused699 and unrun valid-serving control
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 contrib/devtools/mac-backports/resume.py
      - name: Preserve resumable build and exact evidence
        if: always()
        timeout-minutes: 8
        run: python3 contrib/devtools/mac-backports/preserve.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: mac-backports-records
          path: records
          retention-days: 14
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: mac-backports-checkpoint
          path: retained
          retention-days: 14
          compression-level: 0
