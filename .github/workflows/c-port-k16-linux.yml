# Fork CI for btxchain/btx release-0.34.16, on a fork's branch ci-0.34.16 (and ci-0.34.16/<topic>).
#
# A fork-side gate for the release line. Not proposed upstream: upstream runs no GitHub-hosted CI
# by policy (.github/workflows/README.md), so a fork run is the evidence a pull request carries.
# The branch is release-0.34.16 plus one commit: this file, btx-0.34.16-coverage.yml and the helpers
# in contrib/ci-fork/. A topic branch ci-0.34.16/<topic> is that branch plus a PR's commits.
#
# Jobs
# - tools: selftests and shellcheck of contrib/ci-fork; hands btx_ci.py to every other job.
# - lint: each check of the repo's lint runner (test/lint/test_runner) and each test/lint/lint-*.py on
#   its own, yamllint on .github, and a scan of the lines the branch adds for keys and tokens.
# - clang-tidy-diff: src/.clang-tidy with the bitcoin-tidy plugin (LLVM 19) on the C++ lines the branch
#   changes against release-0.34.16; warnings are errors there.
# - cppcheck: cppcheck 2.13 on every product translation unit; red when an (id, file) count grows past
#   contrib/ci-fork/cppcheck-baseline.tsv, which only shrinks.
# - linux-build (all targets; the ctest entries outside test_btx; every test_btx suite registered in
#   ctest) -> linux-unit (6 shards) and linux-functional (4 shards); linux-userns (swarm suites with real
#   user namespaces). Shards are balanced by measured seconds (contrib/ci-fork/*-seconds.tsv); 900 s per
#   unit suite, and a suite that times out is rerun alone at the same 900 s. The 191
#   matmul_v4_rc_stage3_* suites stay out of the hosted Linux shards (macos-stage3-sample measures 20).
# - mingw-cross, mingw-tests, windows-smoke, windows-tests: the MinGW lane (cross build, native run).
# - win-native-*: the clang-cl lane (windows-clangcl-static preset); win-native-cl: a cl.exe census that
#   never gates; win-atlas: the Atlas desktop app. These lanes have not run yet: measurement first.
# - macos-build -> macos-tests-build -> macos-unit (3 shards), macos-swarm, macos-stage3-sample.
# - The MinGW, native Windows and macOS jobs are measurement lanes (continue-on-error) until each has been
#   green once; the gate is lint, clang-tidy-diff, cppcheck, the linux-* jobs, release-gate and summary.
# - release-gate: the release tooling's own tests (test/util/*release*_test.py).
# - summary: one known-failing verdict over every Linux result, and the next known-failing list.
#
# Rules
# - No secrets: the job token is read-only (permissions: contents: read); push and manual runs only,
#   no pull_request trigger.
# - Runs only outside btxchain/* and only on ci-0.34.16 and ci-0.34.16/* (guard on the tools job).
# - Third-party code: only actions/* pinned to full commit SHAs; the OpenSSL, Boost, ccache and
#   shellcheck downloads checked against fixed sha256 values; vcpkg at a pinned commit; the Python lint
#   tools at pinned versions; Ubuntu packages; crates checked against gui/atlas/Cargo.lock (--locked).
# - A test failure is red only when it is not in contrib/ci-fork/known-failing.txt
#   (kind | name | class | first failing line | seen on). The list only shrinks; the summary job writes
#   the next one. No timeout is raised and no test is skipped to make a job green.
# - Every result is an annotation titled RESULT, readable without a token via
#   GET /repos/{owner}/{repo}/check-runs/{id}/annotations.

name: C-PORT K16 native Linux

on:
  workflow_dispatch:
  push:
    branches: ['ci-0.34.16/c-port-k16-linux']

concurrency:
  group: btx-0.34.16-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  RELEASE_BRANCH: "release-0.34.16"
  UPSTREAM_URL: "https://github.com/btxchain/btx.git"
  OSSL_VER: "3.5.4"
  OSSL_SHA256: "967311f84955316969bdb1d8d4b983718ef42338639c621ec4c34fddef355e99"
  BOOST_PIN_VER: "1.81.0"
  BOOST_PIN_SHA256: "205666dea9f6a7cfed87c7a6dfbeb52a2c1b9de55712c9c1a87735d7181452b6"
  # ccache 4.14.2 (18 Oct 2026); sha256 = the GitHub release asset digest of ccache-4.14.2-windows-x86_64.zip.
  CCACHE_WIN_VER: "4.14.2"
  CCACHE_WIN_SHA256: "6993ce645e53192cec592ee23186200b574ac4c59097ecde8d9cfd681b47ae84"
  # The vcpkg commit of the native Windows runs reported on #356 (3 Nov 2026); vcpkg.json's builtin-baseline
  # (c82f7466, 2024.09.30) still decides the port versions.
  VCPKG_COMMIT: "afa249f12f52ed8a3b919f195495ba8b330288d1"
  WIN_NATIVE_TARGETS: "btxd btx-cli btx-tx btx-util btx-modeld"
  # The pin of ci/lint/04_install.sh; sha256 of shellcheck-v0.8.0.linux.x86_64.tar.xz, checked 12 Nov 2026.
  SHELLCHECK_VER: "v0.8.0"
  SHELLCHECK_SHA256: "ab6ee1b178f014d1b86d1e24da20d1139656c8b0ed34d2867fbb834dad02bf0a"
  TIDY_LLVM_V: "19"
  UNIT_EXCLUDE: "^matmul_v4_rc_stage3_"
  KNOWN: "contrib/ci-fork/known-failing.txt"
  CCACHE_MAXSIZE: "2500M"
  CCACHE_COMPRESS: "true"
  CCACHE_NOHASHDIR: "true"
  CCACHE_COMPILERCHECK: "content"
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_NO_ANALYTICS: "1"
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
  PYTHONUNBUFFERED: "1"
  LINUX_TEST_TARGETS: "test_btx btxd btx-cli btx-modeld"
  CORE_SUITES: "util_tests,crypto_tests,hash_tests,key_tests,base58_tests,bech32_tests,uint256_tests,arith_uint256_tests,serialize_tests,streams_tests,script_tests,transaction_tests,sighash_tests,coins_tests,mempool_tests,validation_tests,blockchain_tests,net_tests,addrman_tests,getarg_tests,fs_tests,sock_tests,pq_crypto_tests,wallet_tests,lightwatch_tests,lab_lifecycle_tests,nif_sandbox_tests,guard_permit_tests,native_discovery_tests,cap02_tests,hire01_tests,acc07_tests,fixture_cleanup_tests"
  GUARD_SUITES: "guard_permit_tests,native_discovery_tests,cap02_tests,hire01_tests,acc07_tests"

jobs:
  tools:
    name: tools
    # Every other job needs this one, so this guard keeps the whole workflow off upstream and off every
    # branch except ci-0.34.16 and ci-0.34.16/* (push or manual run).
    if: ${{ github.repository_owner != 'btxchain' && (github.ref_name == 'ci-0.34.16' || startsWith(github.ref_name, 'ci-0.34.16/')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Check the CI helpers (selftests, shellcheck) and hand btx_ci.py on
        run: |
          command -v shellcheck >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q shellcheck; }
          python3 -m py_compile contrib/ci-fork/*.py
          python3 contrib/ci-fork/btx_ci.py selftest --job tools
          python3 contrib/ci-fork/coverage_check.py --selftest
          shellcheck contrib/ci-fork/*.sh
          mkdir -p ci-tools
          cp contrib/ci-fork/btx_ci.py ci-tools/btx_ci.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ci-tools
          path: ci-tools/btx_ci.py
          retention-days: 7
          overwrite: true

  linux-build:
    name: linux-build
    needs: tools
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Start
        run: |
          {
            echo "JOB_T0=$(date +%s)"
            echo "LOGS=$RUNNER_TEMP/logs"
            echo "CIPY=$RUNNER_TEMP/ci-tools/btx_ci.py"
            echo "CCACHE_DIR=$HOME/.ccache-btx"
            echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/logs"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ci-tools
          path: ${{ runner.temp }}/ci-tools
      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends build-essential cmake ninja-build pkgconf python3 python3-zmq ccache \
            libevent-dev libboost-dev libsqlite3-dev libzmq3-dev
      - name: Restore OpenSSL
        id: ossl-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/ossl35
          key: openssl-${{ env.OSSL_VER }}-ubuntu24-x64-v2
      - name: Build static OpenSSL
        id: ossl-build
        if: steps.ossl-cache.outputs.cache-hit != 'true'
        run: |
          cd "$RUNNER_TEMP"
          u="https://github.com/openssl/openssl/releases/download/openssl-$OSSL_VER/openssl-$OSSL_VER.tar.gz"
          curl -fsSL --retry 3 -o ossl.tar.gz "$u"
          curl -fsSL --retry 3 -o ossl.tar.gz.sha256 "$u.sha256"
          got=$(sha256sum ossl.tar.gz | cut -d' ' -f1)
          want=$(awk '{print $1}' ossl.tar.gz.sha256)
          if [ "$got" != "$OSSL_SHA256" ] || [ "$got" != "$want" ]; then
            python3 "$CIPY" ann error "job=$GITHUB_JOB step=openssl sha256-mismatch got=$got"
            exit 1
          fi
          tar xzf ossl.tar.gz
          cd "openssl-$OSSL_VER"
          ./Configure --prefix="$HOME/ossl35" --libdir=lib no-shared no-tests no-docs -fPIC > "$LOGS/ossl-configure.log" 2>&1
          make -j"$(nproc)" > "$LOGS/ossl-make.log" 2>&1
          make install_sw install_ssldirs > "$LOGS/ossl-install.log" 2>&1
          "$HOME/ossl35/bin/openssl" list -signature-algorithms | grep -qi 'ml-dsa-44'
          python3 "$CIPY" ann notice "job=$GITHUB_JOB step=openssl built=$OSSL_VER sha256=pinned-match ml-dsa-44=listed"
      - name: Save OpenSSL
        if: steps.ossl-build.outcome == 'success'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/ossl35
          key: openssl-${{ env.OSSL_VER }}-ubuntu24-x64-v2
      - name: Restore ccache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.ccache-btx
          key: ccache-linux-r3416-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-linux-r3416-${{ github.run_id }}-
            ccache-linux-r3416-
      - name: Configure (Modelnet ON, tests ON)
        id: configure
        run: |
          python3 "$CIPY" configure --name linux --job "$GITHUB_JOB" --logs "$LOGS" --builddir build -- \
            -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DWITH_MODELNET=ON -DBUILD_TESTS=ON -DBUILD_GUI=OFF \
            -DBUILD_BENCH=OFF -DWITH_ZMQ=ON -DWITH_CCACHE=ON -DOPENSSL_ROOT_DIR="$HOME/ossl35" -DOPENSSL_USE_STATIC_LIBS=ON \
            -DBTX_ENABLE_CUDA_EXPERIMENTAL=OFF
          grep -E '^OPENSSL_(SSL|CRYPTO)_LIBRARY' build/CMakeCache.txt
      - name: Build the linked lifecycle test and its executables
        timeout-minutes: 320
        run: python3 "$CIPY" build --name all --logs "$LOGS" --builddir build -- -k 0 -j"$(nproc)" test_btx btxd btx-cli btx-modeld
      - name: Build summary
        id: bsum
        if: ${{ !cancelled() && steps.configure.outcome == 'success' }}
        run: |
          python3 "$CIPY" build-summary --name all --job "$GITHUB_JOB" --logs "$LOGS" \
            --exe btxd=build/bin/btxd btx_cli=build/bin/btx-cli test_btx=build/bin/test_btx
      - name: Save ccache
        if: ${{ !cancelled() && steps.configure.outcome == 'success' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.ccache-btx
          key: ccache-linux-r3416-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Maintained shutdown and process controls
        timeout-minutes: 12
        run: |
          set -o pipefail
          sha256sum build/bin/test_btx build/bin/btxd build/bin/btx-modeld | tee "$LOGS/k16-sha256.txt"
          for case in external_helper_shutdown_cancels_inflight_health_read owned_helper_shutdown_refuses_a_different_socket_peer start_spawned_helper_does_not_inherit_descriptors; do
            build/bin/test_btx --run_test="modelnet_hosting_tests/$case" --log_level=test_suite 2>&1 | tee "$LOGS/$case.log"
          done
          for test in feature_modelnet_helper_after_kill feature_modelnet_helper_long_calls; do
            python3 "test/functional/$test.py" --configfile=build/test/config.ini --timeout-factor=1 \
              --tmpdir="$RUNNER_TEMP/$test" 2>&1 | tee "$LOGS/$test.log"
          done
      - name: Verify the maintained ownership test rejects the old behavior
        timeout-minutes: 20
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          path = Path("src/modelnet/helper.cpp")
          source = path.read_text()
          old = """    if ((expected_peer_pid > 0 && !UnixConnectedPeerMatchesPid(fd, expected_peer_pid, err)) ||
                  (check_peer && !UnixConnectedPeerIsSelf(fd, err))) {"""
          assert source.count(old) == 1
          path.write_text(source.replace(old, "    if (check_peer && !UnixConnectedPeerIsSelf(fd, err)) {"))
          PYCODE
          cmake --build build --parallel "$(nproc)" --target test_btx > "$LOGS/k16-control-build.log" 2>&1
          sha256sum build/bin/test_btx > "$LOGS/k16-control-sha256.txt"
          rc=0
          build/bin/test_btx --run_test=modelnet_hosting_tests/owned_helper_shutdown_refuses_a_different_socket_peer \
            --log_level=test_suite > "$LOGS/k16-control.log" 2>&1 || rc=$?
          test "$rc" -eq 201
          grep -F 'check !received_stop has failed' "$LOGS/k16-control.log"
          grep -F '1 failure is detected' "$LOGS/k16-control.log"
          git restore -- src/modelnet/helper.cpp
      - name: Upload logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: logs-linux-k16
          path: ${{ runner.temp }}/logs
          retention-days: 7
          overwrite: true
          if-no-files-found: ignore
