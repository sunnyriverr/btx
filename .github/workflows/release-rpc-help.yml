name: Qualify Linux package ownership and guard resolution
on:
  push:
    branches: [codex/ci-packaging-resolution]
permissions:
  contents: read
  actions: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          repository: btxchain/btx
          ref: ff5f3f04ea11f044594987fc6be043ff68b136ad
          path: baseline
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: linux-gui-candidate
          path: candidate-input
          run-id: 42456654351
          github-token: ${{ github.token }}
      - name: Native loader and existing desktop runtime prerequisites
        timeout-minutes: 6
        run: |
          sudo apt-get -o Acquire::Retries=1 update
          sudo apt-get install -y --no-install-recommends build-essential patchelf binutils libwebkit2gtk-4.1-0 libgtk-3-0t64 libayatana-appindicator3-1 libopengl0 libxkbcommon-x11-0 libevent-dev libsqlite3-0 libzmq5 libgomp1
          dpkg-query -W > native-installed-packages.log
      - name: Before after ownership and immutable archive gate; no GUI
        timeout-minutes: 15
        run: python3 contrib/devtools/packaging-resolution/run.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: packaging-resolution-records
          path: |
            packaging-resolution-results
            native-installed-packages.log
          retention-days: 14
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: packaging-resolution-candidates
          path: packaging-resolution-output
          compression-level: 0
          retention-days: 14
