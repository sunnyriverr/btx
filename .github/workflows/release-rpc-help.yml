name: Mac release toolchain admission
on:
  push:
    branches: [codex/ci-mac-toolchain-readiness]
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /contrib/devtools/mac-toolchain-admission/
      - name: Inspect existing tools and compile tiny Metal input
        run: python3 contrib/devtools/mac-toolchain-admission/probe.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: mac-toolchain-records
          path: mac-toolchain-records
          retention-days: 14
