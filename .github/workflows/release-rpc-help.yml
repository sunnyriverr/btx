name: Baseline GUI compilation and ABI inspection
on:
  push:
    branches: [codex/ci-gui-baseline-compile]
permissions:
  contents: read
jobs:
  compile:
    strategy:
      fail-fast: false
      matrix:
        component: [qt, atlas]
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          repository: btxchain/btx
          ref: ff5f3f04ea11f044594987fc6be043ff68b136ad
          path: product
      - name: Standard baseline prerequisites
        timeout-minutes: 8
        run: |
          sudo apt-get -o Acquire::Retries=1 update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config python3 perl libboost-dev libevent-dev libsqlite3-dev libzmq3-dev libqrencode-dev qt6-base-dev qt6-base-dev-tools qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev librsvg2-bin libxdo-dev patchelf
      - name: Bounded component compilation and ABI
        timeout-minutes: 40
        run: python3 contrib/devtools/gui-compile/${{ matrix.component }}.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: gui-compile-${{ matrix.component }}-records
          path: gui-compile-results
          retention-days: 14
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: success()
        with:
          name: gui-component-${{ matrix.component }}
          path: gui-component-output
          retention-days: 14
