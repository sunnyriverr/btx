name: Qualify combined Mac package and lifecycle
on:
  push:
    branches: [codex/ci-mac-package-acceptance]
permissions:
  contents: read
  actions: read
jobs:
  restore:
    runs-on: macos-15
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /contrib/devtools/mac-resume/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 13640905970
          run-id: 42538530491
          github-token: ${{ github.token }}
          path: combined-input
          merge-multiple: true
      - name: Observe stable Qt main window in retained archive
        timeout-minutes: 15
        run: python3 contrib/devtools/mac-resume/run.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: mac-qt-window-records
          path: |
            mac-config-records
            package-records
          retention-days: 14
