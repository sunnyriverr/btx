name: Qualify combined Mac package and lifecycle
on:
  push:
    branches: [codex/ci-mac-package-acceptance]
permissions:
  contents: read
  actions: read
jobs:
  restore:
    runs-on: macos-15
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /contrib/devtools/mac-resume/
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: btxchain/btx
          ref: 36ab43008cac48aa5c8410e4b70d90a249196a33
          path: product
          persist-credentials: false
      - name: Recreate exact admitted prerequisites and configuration without BTX compilation
        timeout-minutes: 30
        run: python3 contrib/devtools/mac-resume/configure.py
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 13640905970
          run-id: 42538530491
          github-token: ${{ github.token }}
          path: combined-input
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 13639762129
          run-id: 42536199088
          github-token: ${{ github.token }}
          path: without-guard-input
          merge-multiple: true
      - name: Verify physical-path guard lifecycle and capture app windows
        timeout-minutes: 15
        run: python3 contrib/devtools/mac-resume/run.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: mac-physical-lifecycle-records
          path: |
            mac-config-records
            package-records
          retention-days: 14
