name: Mac checkpoint and remaining build admission
on:
  push:
    branches: [codex/ci-mac-retention-admission]
permissions:
  contents: read
jobs:
  produce:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /contrib/devtools/mac-admission/
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: btxchain/btx
          ref: ff5f3f04ea11f044594987fc6be043ff68b136ad
          path: product
          persist-credentials: false
      - name: Admit exact toolchains and expanded build graph
        timeout-minutes: 45
        run: python3 contrib/devtools/mac-admission/configure.py
      - name: Build tiny fixtures, checkpoint, then inject a later failure
        id: inject
        continue-on-error: true
        timeout-minutes: 3
        run: python3 contrib/devtools/mac-admission/retention.py produce
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: mac-admission-payload
          path: retention-payload
          retention-days: 14
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: mac-admission-records
          path: |
            mac-config-records
            retention-records
          retention-days: 14
      - name: Require deliberate failure only after successful gates
        if: always()
        env:
          INJECT_OUTCOME: ${{ steps.inject.outcome }}
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          assert os.environ['INJECT_OUTCOME']=='failure'
          assert json.loads(Path('mac-config-records/result.json').read_text())['complete']
          assert json.loads(Path('retention-records/fixture-result.json').read_text())['injected_later_failure']
          PY
  restore:
    needs: produce
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /contrib/devtools/mac-admission/
      - name: Install identical pinned fixture toolchain
        timeout-minutes: 10
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy --component rustfmt --target aarch64-apple-darwin
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mac-admission-payload
          path: retention-payload
      - name: Restore into identical paths and verify actual incremental behavior
        timeout-minutes: 5
        run: python3 contrib/devtools/mac-admission/retention.py restore
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: mac-admission-restore-records
          path: retention-records
          retention-days: 14
