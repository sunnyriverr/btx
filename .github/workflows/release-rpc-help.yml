name: Qt checkpoint link trace
on:
  push:
    branches: [codex/ci-gui-link-trace]
permissions:
  contents: read
jobs:
  configure:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          repository: btxchain/btx
          ref: ff5f3f04ea11f044594987fc6be043ff68b136ad
          path: product
      - name: Standard baseline prerequisites
        timeout-minutes: 8
        run: |
          sudo apt-get -o Acquire::Retries=1 update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config python3 perl libboost-dev libevent-dev libsqlite3-dev libzmq3-dev libqrencode-dev qt6-base-dev qt6-base-dev-tools qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev librsvg2-bin libxdo-dev patchelf
      - name: Private OpenSSL prerequisite and Qt configure only
        timeout-minutes: 22
        run: python3 contrib/devtools/gui-baseline-pilot/run.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: gui-baseline-pilot-records
          path: gui-pilot-results
          retention-days: 14
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: configured-checkpoint
          path: configured-checkpoint
          compression-level: 0
          retention-days: 14
  verify:
    needs: configure
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: configured-checkpoint
          path: saved-checkpoint
      - run: python3 contrib/devtools/gui-baseline-pilot/verify.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: configured-checkpoint-verification
          path: checkpoint-verification.json
          retention-days: 14
