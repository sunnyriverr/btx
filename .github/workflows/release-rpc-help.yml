name: Qt checkpoint link trace
on:
  push:
    branches: [codex/ci-gui-link-trace]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: configured-checkpoint
          path: saved-checkpoint
          run-id: 42451578357
          github-token: ${{ github.token }}
      - run: python3 contrib/devtools/gui-baseline-pilot/verify.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: configured-checkpoint-verification
          path: checkpoint-verification.json
