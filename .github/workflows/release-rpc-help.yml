name: Current Linux desktop candidate acceptance
on:
  push:
    branches: [codex/ci-linux-desktop-acceptance]
permissions:
  contents: read
  actions: read
jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Assembly prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends patchelf libopengl0 libxkbcommon-x11-0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: linux-qt-incremental-binary
          run-id: 42708038748
          github-token: ${{ github.token }}
          path: retained-qt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gui-component-atlas
          run-id: 42443474044
          github-token: ${{ github.token }}
          path: retained-atlas
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: packaging-resolution-candidates
          run-id: 42460862377
          github-token: ${{ github.token }}
          path: retained-runtime
      - name: Assemble candidate and admit archive
        timeout-minutes: 12
        run: python3 contrib/devtools/linux-desktop-acceptance/assemble.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: linux-current-desktop-assembly
          path: candidate-results
          retention-days: 14
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: linux-current-desktop-candidate
          path: candidate-output
          retention-days: 14
  observe:
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: linux-current-desktop-candidate
          path: candidate-input
      - name: Install documented GUI and node runtime prerequisites
        timeout-minutes: 5
        run: |
          sudo apt-get -o Acquire::Retries=1 update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-0 libgtk-3-0t64 libevent-dev libsqlite3-0 libzmq5 libgomp1 libopengl0 libxkbcommon-x11-0 libayatana-appindicator3-1 xdg-desktop-portal xdg-desktop-portal-gtk zenity xvfb xauth dbus-x11 openbox scrot wmctrl xdotool python3-pyatspi at-spi2-core
      - name: Observe actual candidate window and disposable local connection
        timeout-minutes: 6
        env:
          BTX_RUN_ATLAS_WINDOW: explicit-native-authorisation
        run: |
          export XDG_CURRENT_DESKTOP=Openbox XDG_SESSION_TYPE=x11
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/atlas-desktop-runtime"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/atlas-desktop-config"
          mkdir -p "$XDG_RUNTIME_DIR" "$XDG_CONFIG_HOME/xdg-desktop-portal"
          chmod 700 "$XDG_RUNTIME_DIR"
          printf '[preferred]\ndefault=gtk\n' > "$XDG_CONFIG_HOME/xdg-desktop-portal/portals.conf"
          timeout --signal=TERM --kill-after=10s 300s dbus-run-session -- xvfb-run -a -s '-screen 0 1440x1000x24 -nolisten tcp' sh -ec 'dbus-update-activation-environment DISPLAY XAUTHORITY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE XDG_RUNTIME_DIR XDG_CONFIG_HOME; timeout 20s gdbus call --session --dest org.freedesktop.portal.Desktop --object-path /org/freedesktop/portal/desktop --method org.freedesktop.DBus.Properties.Get org.freedesktop.portal.FileChooser version > "$GITHUB_WORKSPACE/portal-preflight.log"; openbox > /tmp/atlas-openbox.log 2>&1 & exec /usr/bin/python3 contrib/devtools/linux-desktop-acceptance/run.py'
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: linux-current-desktop-window
          path: |
            atlas-window-results
            portal-preflight.log
          retention-days: 14
  lifecycle:
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: btxchain/btx
          ref: dac9aee53520bd49ed320ec7a49b9072fc7d88d9
          path: product
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: linux-current-desktop-candidate
          path: candidate-input
      - name: Start and restart node-owned services
        timeout-minutes: 6
        run: python3 contrib/devtools/linux-desktop-acceptance/lifecycle.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: linux-current-desktop-lifecycle
          path: lifecycle-records
          retention-days: 14
