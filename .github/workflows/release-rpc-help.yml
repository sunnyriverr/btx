name: Build pinned Mac Atlas shipping executable
on:
  push:
    branches: [codex/ci-mac-atlas-build]
permissions:
  contents: read
  actions: read
jobs:
  restore:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /contrib/devtools/mac-resume/
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: btxchain/btx
          ref: 36ab43008cac48aa5c8410e4b70d90a249196a33
          path: product
          persist-credentials: false
      - name: Recreate exact admitted prerequisites and configuration without BTX compilation
        timeout-minutes: 35
        run: python3 contrib/devtools/mac-resume/configure.py
      - name: Bounded serial compile with retained baseline and final checkpoint
        timeout-minutes: 32
        run: python3 contrib/devtools/mac-resume/chunk.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: mac-atlas-records
          path: |
            restore-records
            mac-config-records
            chunk-records
          retention-days: 14
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: mac-atlas-binaries
          path: chunk-binaries
          retention-days: 14
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: mac-atlas-checkpoint
          path: chunk-checkpoint
          retention-days: 14
