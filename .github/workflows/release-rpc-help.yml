name: Compile bounded Mac incremental release chunk
on:
  push:
    branches: [codex/ci-mac-compile-next]
permissions:
  contents: read
  actions: read
jobs:
  restore:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /contrib/devtools/mac-resume/
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: btxchain/btx
          ref: 36ab43008cac48aa5c8410e4b70d90a249196a33
          path: product
          persist-credentials: false
      - name: Recreate exact admitted prerequisites and configuration without BTX compilation
        timeout-minutes: 30
        run: python3 contrib/devtools/mac-resume/configure.py
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        timeout-minutes: 5
        with:
          artifact-ids: 13636115219
          run-id: 42524397683
          github-token: ${{ github.token }}
          path: restore-payload
          merge-multiple: true
      - name: Verify actual saved files and inspect remaining Ninja work without compiling
        timeout-minutes: 10
        run: python3 contrib/devtools/mac-resume/resume.py
      - name: Bounded serial compile with retained baseline and final checkpoint
        timeout-minutes: 35
        run: python3 contrib/devtools/mac-resume/chunk.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: mac-compile-next-records
          path: |
            restore-records
            mac-config-records
            chunk-records
          retention-days: 14
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: mac-compile-next-binaries
          path: chunk-binaries
          retention-days: 14
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: mac-compile-next-checkpoint
          path: chunk-checkpoint
          retention-days: 14
