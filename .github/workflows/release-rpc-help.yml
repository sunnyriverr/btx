name: GUI retention failure controls
on:
  push:
    branches: [codex/ci-gui-retention-pilot]
permissions:
  contents: read
jobs:
  produce:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        case: [success, step_failed, checkpoint_rejected]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Tiny compile and intentional failure control
        run: python3 contrib/devtools/gui-retention/produce.py ${{ matrix.case }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: binary-${{ matrix.case }}
          path: binary-output
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: checkpoint-${{ matrix.case }}
          path: checkpoint-output
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: logs-${{ matrix.case }}
          path: retention-logs
  verify:
    needs: produce
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: artifacts
      - run: python3 contrib/devtools/gui-retention/verify.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: retention-verification
          path: verification.json
