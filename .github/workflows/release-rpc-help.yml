name: Bounded encrypted backup recovery probe
on:
  push:
    branches: [codex/ci-wallet-backup-recovery]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: btxchain/btx
          ref: dac9aee53520bd49ed320ec7a49b9072fc7d88d9
          path: product
          persist-credentials: false
      - name: Runtime prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libevent-dev libsqlite3-0 libzmq5 libgomp1
      - name: Exact package and bounded wallet probe
        timeout-minutes: 15
        env:
          BTX_RUN_BACKUP_PROBE: explicit-native-authorisation
        run: python3 contrib/devtools/wallet-backup-probe/run.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: wallet-backup-recovery-records
          path: wallet-backup-probe-results
          retention-days: 14
