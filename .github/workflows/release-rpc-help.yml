name: Verify retained compiled Qt checkpoint
on:
  push:
    branches: [codex/ci-gui-qt-gated]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gui-compile-qt-records
          path: saved-records
          run-id: 42452742962
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gui-component-qt
          path: saved-binary
          run-id: 42452742962
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: qt-build-checkpoint
          path: saved-checkpoint
          run-id: 42452742962
          github-token: ${{ github.token }}
      - name: Verify actual retained binary and compiled tree
        env:
          EXPECTED_FIXTURE: 9f7125b7ae310c1c83a424deb319b911d85b7809
        run: python3 contrib/devtools/gui-retention/verify.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: qt-retention-verification
          path: retention-verification.json
          retention-days: 14
