name: Assemble and observe separate Linux GUI candidate
on:
  push:
    branches: [codex/ci-gui-candidate]
permissions:
  contents: read
  actions: read
jobs:
  assemble:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: linux-gui-candidate
          path: prior-candidate
          run-id: 42456436636
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: linux-gui-candidate-records
          path: prior-records
          run-id: 42456436636
          github-token: ${{ github.token }}
      - name: Correct archive ownership and empty directories; retain strict gate result
        timeout-minutes: 6
        run: python3 contrib/devtools/gui-candidate/repair.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: linux-gui-candidate-records
          path: |
            candidate-results
          retention-days: 14
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: linux-gui-candidate
          path: candidate-output
          compression-level: 0
          retention-days: 14
  observe:
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: linux-gui-candidate
          path: candidate-input
      - name: Install documented GUI and node runtime prerequisites
        timeout-minutes: 5
        run: |
          sudo apt-get -o Acquire::Retries=1 update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-0 libgtk-3-0t64 libevent-dev libsqlite3-0 libzmq5 libgomp1 xvfb xauth dbus-x11 openbox scrot wmctrl xdotool python3-pyatspi at-spi2-core
      - name: Observe actual candidate window and disposable local connection
        timeout-minutes: 6
        env:
          BTX_RUN_ATLAS_WINDOW: explicit-native-authorisation
        run: |
          timeout --signal=TERM --kill-after=10s 300s dbus-run-session -- xvfb-run -a -s '-screen 0 1440x1000x24 -nolisten tcp' sh -c 'openbox > /tmp/atlas-openbox.log 2>&1 & exec /usr/bin/python3 contrib/devtools/gui-candidate/run.py'
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: linux-gui-candidate-window
          path: atlas-window-results
          retention-days: 14
