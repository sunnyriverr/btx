name: PR503 bounded model helper build
on:
  push:
    branches: [codex/ci-model-import-recovery]
permissions:
  contents: read
  actions: read
jobs:
  recovery:
    runs-on: ubuntu-22.04
    timeout-minutes: 42
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: repch1c/btx
          ref: 08fd0a6245598e8f9fedc6dac97629310335dd2d
          fetch-depth: 2
          path: accepted-source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Retained build profile prerequisites
        timeout-minutes: 8
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list
          sudo apt-get -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::Retries=1 update
          sudo apt-get -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::Retries=1 install -y --no-install-recommends build-essential cmake ninja-build pkg-config python3 perl libboost-dev libevent-dev libsqlite3-dev libzmq3-dev libqrencode-dev qt6-base-dev qt6-base-dev-tools qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev librsvg2-bin libxdo-dev patchelf
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 13714209829
          run-id: 42708038748
          github-token: ${{ github.token }}
          merge-multiple: true
          path: saved-checkpoint
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 13750111820
          merge-multiple: true
          run-id: 42787985840
          github-token: ${{ github.token }}
          path: stock-input
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 13750246662
          merge-multiple: true
          run-id: 42787985840
          github-token: ${{ github.token }}
          path: stock-build-input
      - name: Verify immutable stock and build exact candidate within admitted graph
        timeout-minutes: 29
        run: python3 -u build_helper.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: model-import-build-records
          path: build-records
          retention-days: 14
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: model-import-helper-binaries
          path: helper-binaries
          retention-days: 14
      - name: Observe healthy import and failed-save retry/restart
        timeout-minutes: 6
        run: |
          python3 - <<'PYRUN'
          import json, subprocess, sys
          from pathlib import Path
          result = json.loads(Path('build-records/build-result.json').read_text())
          assert result['passed'] and result['candidate_commit'] == '08fd0a6245598e8f9fedc6dac97629310335dd2d'
          subprocess.run([sys.executable, 'native_fixture.py', '--binary', 'helper-binaries/candidate',
                          '--expected-sha256', result['binaries']['candidate'], '--output', 'native-records'],
                         check=True, timeout=300)
          PYRUN
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: model-import-native-records
          path: native-records
          retention-days: 14
