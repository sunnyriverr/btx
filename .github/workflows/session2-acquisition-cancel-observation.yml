{
  "name": "Session2 acquisition cancellation observation",
  "on": {
    "push": {
      "branches": [
        "codex/ci-acquisition-cancel-observation"
      ]
    }
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "concurrency": {
    "group": "session2-acquisition-cancel-observation",
    "cancel-in-progress": false
  },
  "jobs": {
    "observe": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 30,
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Validate driver offline before staging",
          "run": "python3 -B -m unittest discover -s proposal -p test_offline.py -v"
        },
        {
          "name": "Verify retained helper and source; no rebuild",
          "timeout-minutes": 10,
          "run": "python3 -B proposal/stage.py && python3 -B proposal/current_binary.py",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          }
        },
        {
          "name": "Observe canonical local document copy and cancellation; no build",
          "timeout-minutes": 15,
          "run": "docker run --name s2-acq-cancel --init -v \"$GITHUB_WORKSPACE:$GITHUB_WORKSPACE\" -w \"$GITHUB_WORKSPACE\" -e GITHUB_WORKSPACE ubuntu@sha256:076e7bf82319619f28dd0aa9c02ab34b055ad37100395b4f49a2ffba04fb5e11 bash proposal/runtime.sh"
        },
        {
          "name": "Stop only owned test container",
          "if": "always()",
          "run": "docker rm -f s2-acq-cancel >/dev/null 2>&1; test -z \"$(docker ps -aq --filter name=^/s2-acq-cancel$)\""
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "if": "always()",
          "with": {
            "name": "acquisition-cancel-records",
            "path": "records/",
            "retention-days": 14,
            "if-no-files-found": "error"
          }
        }
      ]
    }
  }
}
