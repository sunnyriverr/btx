name: Cloud missing-piece repair build and recovery
on:
  push:
    branches: [codex/ci-cloud-repair-build]
permissions:
  contents: read
  actions: read
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: sunnyriverr/btx
          ref: 8033fe4e20c887287b2e4c11db12ef3b10bf52a5
          path: accepted-source
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 13714209829
          run-id: 42708038748
          github-token: ${{ github.token }}
          path: saved-checkpoint
          merge-multiple: true
      - name: Restore, configure and inspect helper-only plan
        timeout-minutes: 60
        run: |
          image=ubuntu@sha256:076e7bf82319619f28dd0aa9c02ab34b055ad37100395b4f49a2ffba04fb5e11
          docker pull "$image"
          set -o pipefail
          docker run --rm --init --platform linux/amd64 -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" -e GITHUB_WORKSPACE "$image" bash -e -c 'bash setup.sh && bash compile.sh' 2>&1 | tee preparation.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cloud-repair-candidate
          path: candidate/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: btxchain/btx
          ref: 8d6d8b1aabf371b12f2b1f5797b950fed7962d4e
          path: runtime-source
          persist-credentials: false
      - name: Native real-MinIO recovery, same retained node
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv product build-source
          mv runtime-source product
          bash runtime.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cloud-repair-records
          path: |
            records/
            pilot-records/
            preparation.log
          retention-days: 14
          if-no-files-found: warn
