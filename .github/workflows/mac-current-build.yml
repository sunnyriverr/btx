name: Bounded Mac release compile
on:
  push:
    branches: [codex/ci-mac-current-build]
permissions:
  contents: read
  actions: read
jobs:
  restore:
    runs-on: macos-15
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: btxchain/btx
          ref: c6f9678dd225572528d06c456c16eb4c78bc637c
          path: product
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 13860762133
          run-id: 43025342024
          github-token: ${{ github.token }}
          path: cmake-payload
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 13637244857
          run-id: 42530911365
          github-token: ${{ github.token }}
          path: cargo-payload
          merge-multiple: true
      - name: Verify pinned runner tools and configure current source
        timeout-minutes: 30
        run: python3 contrib/devtools/mac-current-resume/configure.py
      - name: Restore both checkpoints and inspect current dry plan
        timeout-minutes: 15
        run: python3 contrib/devtools/mac-current-resume/pilot.py
      - name: Compile CMake shipping targets with one worker
        timeout-minutes: 35
        run: python3 contrib/devtools/mac-current-resume/cmake_chunk.py
      - name: Compile Atlas with the locked toolchain and one worker
        timeout-minutes: 40
        run: python3 contrib/devtools/mac-current-resume/cargo_chunk.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: mac-current-build-records
          path: |
            pilot-records
            mac-config-records
            cmake-chunk-records
            cargo-chunk-records
          retention-days: 14
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: mac-current-build-outputs
          path: |
            cmake-chunk-binaries
            cargo-chunk-binaries
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: mac-current-build-checkpoints
          path: |
            cmake-chunk-checkpoint
            cargo-chunk-checkpoint
          if-no-files-found: ignore
          retention-days: 14
