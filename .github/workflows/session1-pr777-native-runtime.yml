name: Session1 PR777 native BTX ETH verification
on:
  push:
    branches: [codex/ci-pr777-native-runtime]
permissions:
  contents: read
  actions: read
concurrency:
  group: session1-pr777-native-runtime
  cancel-in-progress: false
jobs:
  native:
    if: github.repository == 'sunnyriverr/btx'
    runs-on: macos-26
    timeout-minutes: 35
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: contrib/devtools/session1-pr777-runtime
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: btxchain/btx
          ref: cd3078e76398b20b7f500acd1348a5b5455f3d5e
          path: product
          persist-credentials: false
      - name: Select matched embedded Python
        id: python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          architecture: arm64
          check-latest: false
      - name: Verify retained build and run bounded native settlement and refund
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ github.token }}
          BTX_BUILD_PYTHON: ${{ steps.python.outputs.python-path }}
        run: python3 contrib/devtools/session1-pr777-runtime/run.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: pr777-native-btx-eth-records
          path: records
          retention-days: 14
