name: SwapNet wallet build and regtest startup
on:
  push:
    branches: [codex/ci-swapnet-wallet-build]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: btxchain/btx
          ref: 88aeaac965f6ad0031aa6d8a062bfae23a45c4e0
          path: product
          persist-credentials: false
      - name: Build and stage wallet binaries
        timeout-minutes: 48
        run: bash build.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: swapnet-wallet-binaries
          path: payload/
          retention-days: 30
          if-no-files-found: error
      - name: Start retained executables on isolated regtest
        timeout-minutes: 4
        run: bash smoke.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: swapnet-wallet-build-records
          path: records/
          retention-days: 10
          if-no-files-found: error
