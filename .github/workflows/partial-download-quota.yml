name: Partial model download quota observation
on:
  push:
    branches: [codex/ci-partial-download-quota]
permissions:
  contents: read
  actions: read
jobs:
  observe:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify result handling offline
        run: python3 -B test_results.py
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 13750111820
          run-id: 42787985840
          github-token: ${{ github.token }}
          merge-multiple: true
          path: saved-helpers
      - name: Verify binary and native dependencies
        run: |
          echo '0412b4d3d09ecd40e954f031ba4d2487e089a078084669af9ec598b041ba1a6c  saved-helpers/base' | sha256sum -c -
          chmod +x saved-helpers/base
          mkdir -p native-records
          ldd saved-helpers/base > native-records/ldd.log
          if grep -q 'not found' native-records/ldd.log; then exit 1; fi
          df -h > native-records/disk.log
      - name: Observe fresh fit, interrupted restart and quota refusal
        timeout-minutes: 7
        run: python3 -u native_fixture.py --binary saved-helpers/base --output native-records
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: partial-download-quota-records
          path: native-records
          retention-days: 14
