name: Native Modelnet direct-header prerequisite
on:
  push:
    branches: [codex/ci-native-modelnet-unistd]
permissions:
  contents: read
jobs:
  native:
    if: github.repository == 'sunnyriverr/btx'
    runs-on: windows-2025
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Compare exact source and native-only adapter
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "BTX_VS=%%i"
          if not defined BTX_VS exit /b 2
          call "%BTX_VS%\Common7\Tools\VsDevCmd.bat" -no_logo -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b %errorlevel%
          set "PATH=C:\Program Files\LLVM\bin;%PATH%"
          set "CL="
          set "_CL_="
          python contrib/devtools/native-modelnet-unistd/runner.py
          exit /b %errorlevel%
      - name: Preserve exact scoped records
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: native-modelnet-unistd-evidence
          path: ${{ runner.temp }}/native-modelnet-unistd/evidence/
          retention-days: 7
