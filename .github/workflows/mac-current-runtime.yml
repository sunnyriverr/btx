name: Qualify combined Mac package and lifecycle
on:
  push:
    branches: [codex/ci-mac-current-runtime]
permissions:
  contents: read
  actions: read
jobs:
  restore:
    runs-on: macos-15
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /contrib/devtools/mac-current-runtime/
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: btxchain/btx
          ref: c6f9678dd225572528d06c456c16eb4c78bc637c
          path: product
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 13887802085
          run-id: 43085244850
          github-token: ${{ github.token }}
          path: combined-input
          merge-multiple: true
      - name: Observe Qt and Atlas launch and run packaged lifecycle
        timeout-minutes: 15
        run: python3 contrib/devtools/mac-current-runtime/run.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: mac-current-runtime-records
          path: |
            mac-config-records
            package-records
          retention-days: 14
