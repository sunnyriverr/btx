{
  "name": "Linux f9ba1128 bounded daemon and CLI build",
  "on": {
    "push": {
      "branches": [
        "codex/ci-linux-f9ba1128-eth-build"
      ]
    }
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "concurrency": {
    "group": "linux-f9ba1128-eth-build",
    "cancel-in-progress": false
  },
  "jobs": {
    "qualify": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 55,
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 1
          }
        },
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "repository": "btxchain/btx",
            "ref": "f9ba112822c0089ae2fc3bb5f71e1a28c7cf0302",
            "path": "current-reference",
            "persist-credentials": false,
            "fetch-depth": 1
          }
        },
        {
          "name": "Verify and restore retained checkpoint on Linux",
          "timeout-minutes": 12,
          "run": "python3 -B proposal/stage.py",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          }
        },
        {
          "name": "Verify stock f9ba1128 source and preserve unchanged timestamps",
          "timeout-minutes": 3,
          "run": "python3 -B proposal/sync-source.py"
        },
        {
          "name": "Verify and install complete signed Ubuntu prerequisites",
          "timeout-minutes": 13,
          "run": "docker run -d --cpus=2 --memory=7g --name eth-f9ba1128-build --init -v \"$GITHUB_WORKSPACE:$GITHUB_WORKSPACE\" -w \"$GITHUB_WORKSPACE\" -e GITHUB_WORKSPACE -v /etc/ssl/certs/ca-certificates.crt:/ubuntu-host-ca.pem:ro ubuntu@sha256:076e7bf82319619f28dd0aa9c02ab34b055ad37100395b4f49a2ffba04fb5e11 sleep infinity\ndocker exec eth-f9ba1128-build bash proposal/ubuntu-prerequisites.sh"
        },
        {
          "name": "Configure and inspect btxd and btx-cli dry run only",
          "timeout-minutes": 9,
          "run": "docker exec eth-f9ba1128-build bash -c \"bash proposal/setup.sh && bash proposal/configure-dry-run.sh\""
        },
        {
          "name": "Match exact 17 actions and build only btxd and btx-cli",
          "timeout-minutes": 14,
          "run": "docker exec eth-f9ba1128-build bash proposal/build-and-record.sh"
        },
        {
          "name": "Preserve the completed or partial checkpoint",
          "if": "always() && hashFiles('records/build-started.txt') != ''",
          "timeout-minutes": 12,
          "run": "docker exec eth-f9ba1128-build /opt/hostedtoolcache/Python/3.12.16/x64/bin/python3 -B proposal/preserve.py"
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "if": "always() && hashFiles('retained-eth-build/manifest.json') != '' && hashFiles('records/checkpoint-created.json') != ''",
          "with": {
            "name": "linux-f9ba1128-eth-build-checkpoint",
            "path": "retained-eth-build/",
            "compression-level": 0,
            "retention-days": 14,
            "if-no-files-found": "error"
          }
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "if": "always()",
          "with": {
            "name": "linux-f9ba1128-eth-build-records",
            "path": "records/",
            "retention-days": 14,
            "if-no-files-found": "error"
          }
        },
        {
          "name": "Remove only owned test container",
          "if": "always()",
          "run": "docker rm -f eth-f9ba1128-build >/dev/null 2>&1; test -z \"$(docker ps -aq --filter name=^/eth-f9ba1128-build$)\""
        }
      ],
      "if": "github.repository == 'sunnyriverr/btx'"
    }
  }
}
