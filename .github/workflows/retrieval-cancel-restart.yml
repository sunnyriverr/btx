{
  "name": "Session2 isolated retrieval cancellation comparison",
  "on": {
    "push": {
      "branches": [
        "codex/ci-retrieval-cancel-restart"
      ]
    }
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "concurrency": {
    "group": "session2-retrieval-cancel-restart",
    "cancel-in-progress": false
  },
  "jobs": {
    "observe": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 25,
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Verify retained helper and source; no rebuild",
          "timeout-minutes": 8,
          "run": "python3 -B proposal/stage.py",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          }
        },
        {
          "name": "Bounded normal-helper saved cancellation comparison",
          "timeout-minutes": 22,
          "run": "docker run --name s2-retrieval-control --init -v \"$GITHUB_WORKSPACE:$GITHUB_WORKSPACE\" -w \"$GITHUB_WORKSPACE\" -e GITHUB_WORKSPACE ubuntu@sha256:076e7bf82319619f28dd0aa9c02ab34b055ad37100395b4f49a2ffba04fb5e11 bash proposal/runtime.sh"
        },
        {
          "name": "Stop only owned test container",
          "if": "always()",
          "run": "docker rm -f s2-retrieval-control >/dev/null 2>&1 || true"
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "if": "always()",
          "with": {
            "name": "retrieval-cancel-isolated-records",
            "path": "records/",
            "retention-days": 14,
            "if-no-files-found": "error"
          }
        }
      ]
    }
  }
}
