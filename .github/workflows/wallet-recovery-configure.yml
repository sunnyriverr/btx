name: Wallet recovery configure and dry run only
on:
  push:
    branches: [codex/ci-wallet-recovery-configure]
permissions:
  contents: read
jobs:
  configure:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: btxchain/btx
          ref: 61f13b8870ed98c7b10db2e32c04fb647023f4ef
          path: source
          submodules: recursive
          persist-credentials: false
      - name: Install configure prerequisites only
        timeout-minutes: 6
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config libboost-dev libevent-dev libsqlite3-dev libssl-dev
      - name: Configure and inspect pending commands without building
        timeout-minutes: 11
        run: python3 wallet-configure-plan.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: session3-wallet-configure-records
          path: records/
          retention-days: 7
