name: Wallet recovery normal-suite qualification
on:
  push:
    branches: [codex/ci-wallet-recovery-configure]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: btxchain/btx
          ref: 1e2f8b5f12295002334d3390c12cac0bb4ae2aff
          path: reference-source
          persist-credentials: false
      - name: Provision the previously qualified environment
        timeout-minutes: 6
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build binutils libboost-dev libevent-dev libsqlite3-dev libssl-dev
      - name: Verify and restore bytes; inspect ELF without executing BTX
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 wallet-retention-verify.py
      - name: Integrate fixture through normal configure, without compilation
        timeout-minutes: 7
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 wallet-suite-prepare.py
      - name: Bounded normal-runner qualification and historical control
        timeout-minutes: 62
        run: python3 wallet-suite-run.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: session3-wallet-current-suite-records
          path: records/
          retention-days: 7
