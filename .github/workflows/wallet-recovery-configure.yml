name: Wallet checkpoint restore and static dependency verification
on:
  push:
    branches: [codex/ci-wallet-recovery-configure]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: btxchain/btx
          ref: 61f13b8870ed98c7b10db2e32c04fb647023f4ef
          path: reference-source
          persist-credentials: false
      - name: Provision the previously qualified environment
        timeout-minutes: 6
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake ninja-build binutils libboost-dev libevent-dev libsqlite3-dev libssl-dev
      - name: Verify and restore bytes; inspect ELF without executing BTX
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 wallet-retention-verify.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: session3-wallet-retention-verification
          path: records/
          retention-days: 7
