name: Wallet current incremental build from verified checkpoint
on:
  push:
    branches: [codex/ci-wallet-recovery-configure]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: btxchain/btx
          ref: 61f13b8870ed98c7b10db2e32c04fb647023f4ef
          path: reference-source
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: btxchain/btx
          ref: 1e2f8b5f12295002334d3390c12cac0bb4ae2aff
          path: current-source
          persist-credentials: false
      - name: Provision the previously qualified environment
        timeout-minutes: 6
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build binutils libboost-dev libevent-dev libsqlite3-dev libssl-dev
      - name: Verify and restore bytes; inspect ELF without executing BTX
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 wallet-retention-verify.py
      - name: Preserve unchanged objects and overlay current source
        timeout-minutes: 5
        run: python3 wallet-current-overlay.py
      - name: Bounded incremental build and retention
        timeout-minutes: 42
        run: python3 wallet-current-build.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: session3-wallet-current-build-records
          path: records/
          retention-days: 7
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: session3-wallet-current-checkpoint
          path: retained/
          retention-days: 7
          compression-level: 0
