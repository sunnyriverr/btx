{
  "name": "Wallet export and import fixture qualification",
  "on": {
    "push": {
      "branches": [
        "codex/ci-wallet-bundle-fixture-qualification"
      ]
    }
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "jobs": {
    "linux": {
      "if": "github.repository == 'sunnyriverr/btx'",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 35,
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Restore pinned Linux binaries",
          "run": "python3 -B proposal/linux-restore.py",
          "timeout-minutes": 10,
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          }
        },
        {
          "name": "Set up the matching Ubuntu 22.04 runtime",
          "timeout-minutes": 16,
          "run": "docker run -d --cpus=2 --memory=7g --name wallet-bundle-fixture-linux --init -v \"$GITHUB_WORKSPACE:$GITHUB_WORKSPACE\" -w \"$GITHUB_WORKSPACE\" -e GITHUB_WORKSPACE -v /etc/ssl/certs/ca-certificates.crt:/ubuntu-host-ca.pem:ro ubuntu@sha256:076e7bf82319619f28dd0aa9c02ab34b055ad37100395b4f49a2ffba04fb5e11 sleep infinity\ndocker exec wallet-bundle-fixture-linux bash -c \"bash proposal/ubuntu-prerequisites.sh && bash proposal/setup.sh\""
        },
        {
          "name": "Run just the amended wallet case",
          "timeout-minutes": 13,
          "run": "docker exec wallet-bundle-fixture-linux /opt/hostedtoolcache/Python/3.12.16/x64/bin/python3 -B proposal/focused.py linux"
        },
        {
          "name": "Clean up the owned test container",
          "if": "always()",
          "run": "docker rm -f wallet-bundle-fixture-linux >/dev/null 2>&1 || true\ntest -z \"$(docker ps -aq --filter name=^/wallet-bundle-fixture-linux$)\""
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "if": "always()",
          "with": {
            "name": "wallet-bundle-fixture-linux",
            "path": "records/",
            "retention-days": 14,
            "if-no-files-found": "warn"
          }
        }
      ]
    },
    "mac": {
      "if": "github.repository == 'sunnyriverr/btx'",
      "runs-on": "macos-15",
      "timeout-minutes": 34,
      "env": {
        "DEVELOPER_DIR": "/Applications/Xcode_16.4.app/Contents/Developer",
        "HOMEBREW_NO_AUTO_UPDATE": "1",
        "HOMEBREW_NO_INSTALL_UPGRADE": "1",
        "HOMEBREW_NO_INSTALL_CLEANUP": "1"
      },
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "repository": "btxchain/btx",
            "ref": "2c4da891f0089ebc0fb082e65d03a4efda4488a3",
            "path": "product",
            "persist-credentials": false,
            "fetch-depth": 1
          }
        },
        {
          "name": "Restore and verify the saved Mac ARM binaries",
          "timeout-minutes": 18,
          "run": "python3 -B proposal/mac-restore.py",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          }
        },
        {
          "name": "Run just the amended wallet case",
          "timeout-minutes": 13,
          "run": "test-env/bin/python -B proposal/focused.py mac"
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "if": "always()",
          "with": {
            "name": "wallet-bundle-fixture-mac",
            "path": "records/",
            "retention-days": 14,
            "if-no-files-found": "warn"
          }
        }
      ]
    }
  }
}
