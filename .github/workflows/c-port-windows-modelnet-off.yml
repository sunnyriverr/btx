name: C-PORT Windows ModelNet-off probe
on:
  push:
    branches: [codex/ci-cport-windows-modelnet-off]
permissions:
  contents: read
jobs:
  control:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Compare path conversion settings
        shell: bash
        run: |
          mkdir -p evidence
          command -v c++ | tee evidence/compiler.txt
          c++ --version >> evidence/compiler.txt
          script=contrib/modelnet/check-with-modelnet-off.sh
          rc=0
          MSYS_NO_PATHCONV=1 bash "$script" > evidence/disabled.log 2>&1 || rc=$?
          echo "$rc" > evidence/disabled.rc
          (
            unset MSYS_NO_PATHCONV
            rc=0
            bash "$script" > evidence/default.log 2>&1 || rc=$?
            echo "$rc" > evidence/default.rc
          )
          cat evidence/disabled.log evidence/default.log
          test "$(cat evidence/disabled.rc)" = 1
          grep -E '/tmp/.*probe.cpp.*No such file' evidence/disabled.log
          test "$(cat evidence/default.rc)" = 0
          grep -F '11 checks passed' evidence/default.log
          grep -F 'ok 7 - disabled_stub.h #errors when ENABLE_MODELNET is set' evidence/default.log
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: ${{ !cancelled() }}
        with:
          name: windows-modelnet-off-control
          path: evidence/
          if-no-files-found: error
