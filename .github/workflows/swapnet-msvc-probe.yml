name: SwapNet MSVC 19.44 matched embedding acceptance
on:
  push:
    branches: [codex/ci-swapnet-msvc-bootstrap]
permissions:
  contents: read
jobs:
  embedding:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            contrib/swapnet
            contrib/devtools/swapnet-msvc-probe
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Matched native Microsoft compiler and exact payload check
        run: python contrib/devtools/swapnet-msvc-probe/probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swapnet-msvc1944-embedding-results
          path: probe-results
          retention-days: 14
          if-no-files-found: error
