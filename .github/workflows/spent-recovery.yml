name: Spent Bitcoin backup recovery
on:
  push:
    branches: [codex/ci-spent-bitcoin-recovery]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: bash ci/spent-recovery/run.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: spent-bitcoin-recovery
          path: records/
          retention-days: 30
