name: Deposit recovery contract qualification
on:
  push:
    branches: [codex/ci-deposit-recovery-contract]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: btxchain/btx
          ref: 1e2f8b5f12295002334d3390c12cac0bb4ae2aff
          path: reference-source
          persist-credentials: false
      - name: Provision the previously qualified runtime dependencies
        timeout-minutes: 6
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake ninja-build binutils libboost-dev libevent-dev libsqlite3-dev libssl-dev
      - name: Restore and verify the retained current binaries without compilation
        timeout-minutes: 8
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 verify.py
      - name: One bounded registered deposit recovery test
        timeout-minutes: 12
        run: python3 run.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: session3-deposit-recovery-records
          path: records/
          retention-days: 7
