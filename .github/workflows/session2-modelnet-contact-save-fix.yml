{
  "name": "Session 2 ModelNet contact save qualification",
  "on": {
    "push": {
      "branches": [
        "codex/ci-modelnet-contact-save-fix"
      ]
    }
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "concurrency": {
    "group": "session2-modelnet-contact-save-fix",
    "cancel-in-progress": false
  },
  "jobs": {
    "qualify": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 65,
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Verify preparation offline",
          "run": "python3 -B -c \"import ast, pathlib; [ast.parse(p.read_text(), filename=str(p)) for p in pathlib.Path('proposal').glob('*.py')]\""
        },
        {
          "name": "Verify #861 checkpoint and retained release baseline",
          "timeout-minutes": 8,
          "run": "python3 -B proposal/stage.py && python3 -B proposal/current_binary.py",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          }
        },
        {
          "name": "Verify and install complete signed Ubuntu prerequisites",
          "timeout-minutes": 13,
          "run": "docker run -d --cpus=2 --memory=7g --name s2-contact-save-fix --init -v \"$GITHUB_WORKSPACE:$GITHUB_WORKSPACE\" -w \"$GITHUB_WORKSPACE\" -e GITHUB_WORKSPACE -v /etc/ssl/certs/ca-certificates.crt:/ubuntu-host-ca.pem:ro ubuntu@sha256:076e7bf82319619f28dd0aa9c02ab34b055ad37100395b4f49a2ffba04fb5e11 sleep infinity\ndocker exec s2-contact-save-fix bash proposal/ubuntu-prerequisites.sh"
        },
        {
          "name": "Build only the helper and compare the identical contact test",
          "timeout-minutes": 42,
          "run": "docker exec s2-contact-save-fix bash -c \"bash proposal/setup.sh && python3 -B proposal/qualify.py\""
        },
        {
          "name": "Remove only owned test container",
          "if": "always()",
          "run": "docker rm -f s2-contact-save-fix >/dev/null 2>&1; test -z \"$(docker ps -aq --filter name=^/s2-contact-save-fix$)\""
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "if": "always()",
          "with": {
            "name": "modelnet-contact-save-fix-records",
            "path": "records/",
            "retention-days": 14,
            "if-no-files-found": "error"
          }
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "if": "always()",
          "with": {
            "name": "modelnet-contact-save-fix-binaries",
            "path": "retained-binaries/",
            "retention-days": 14,
            "if-no-files-found": "warn"
          }
        }
      ]
    }
  }
}
