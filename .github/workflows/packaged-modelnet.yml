name: Packaged ModelNet active download restart
on:
  push:
    branches: [codex/ci-packaged-modelnet-active-restart]
permissions:
  contents: read
concurrency:
  group: session2-packaged-modelnet-active-restart
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify archive, install privately, and observe the bounded restart
        run: bash run.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: packaged-modelnet-active-restart-records
          path: records/
          retention-days: 14
          if-no-files-found: error
