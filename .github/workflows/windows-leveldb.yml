name: Windows LevelDB same-database recovery
on:
  push:
    branches: [codex/ci-windows-leveldb-recovery]
permissions:
  contents: read
  actions: read
concurrency:
  group: windows-leveldb-recovery
  cancel-in-progress: false
jobs:
  recovery:
    if: github.repository == 'sunnyriverr/btx'
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
      - name: Download and verify retained Windows archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: python check.py fetch
      - name: Exercise native LevelDB refusal and same-database reopen
        run: python check.py recover
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-leveldb-recovery-evidence
          path: records/
          if-no-files-found: error
          retention-days: 14
