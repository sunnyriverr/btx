name: SwapNet Windows Unicode datadir component check
on:
  push:
    branches: [codex/ci-swapnet-windows-unicode-path]
permissions:
  contents: read
concurrency:
  group: swapnet-windows-unicode-path
  cancel-in-progress: false
jobs:
  component:
    if: github.repository == 'sunnyriverr/btx'
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: btxchain/btx
          ref: c2e71aafc48a41593277e335c8bc370e45599f01
          path: source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
      - name: Run stock and candidate filesystem controls
        run: python control/check.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: swapnet-unicode-path-component-receipt
          path: records/
          if-no-files-found: error
          retention-days: 14
