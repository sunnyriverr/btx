name: Windows wallet export storage fixture pilot
on:
  push:
    branches: [codex/ci-pr467-windows-write-pilot]
permissions:
  contents: read
jobs:
  pilot:
    runs-on: windows-2025
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Compile the small native CRT probe
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "BTX_VS=%%i"
          if not defined BTX_VS exit /b 2
          call "%BTX_VS%\Common7\Tools\VsDevCmd.bat" -no_logo -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b %errorlevel%
          "C:\Program Files\LLVM\bin\clang-cl.exe" /std:c++20 /O2 /MT /EHsc /Fe:probe.exe probe.cpp
      - name: Verify full-volume and healthy controls
        timeout-minutes: 5
        shell: pwsh
        run: ./pilot.ps1
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: pr467-write-pilot
          path: pr467-records
          retention-days: 7
