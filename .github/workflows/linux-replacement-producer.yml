name: Session 3 bounded Linux desktop packaging only
on:
  workflow_dispatch:
    inputs:
      authorize_package_only:
        description: Restore compiled desktop targets and package with version/Python probes; no rebuild
        type: boolean
        required: true
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: session3-linux-desktop-package-074
  cancel-in-progress: false
jobs:
  producer:
    if: github.repository == 'sunnyriverr/btx' && github.ref == 'refs/heads/codex/ci-session3-linux-desktop-package-074' && inputs.authorize_package_only
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      EXPECTED_WORKSPACE: /home/runner/work/btx/btx
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        timeout-minutes: 2
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        timeout-minutes: 2
        with:
          repository: btxchain/btx
          ref: 074dac167c26c1e091198f691ed5727817dba88a
          path: accepted-source
          persist-credentials: false
      - name: Verify checkpoint and source-equivalent Atlas inputs
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_WORKSPACE" = "$EXPECTED_WORKSPACE"
          mkdir -p build-records
          python3 control/fetch-inputs.py
      - name: Packaging only, current gates and checkpoint retention
        id: producer
        timeout-minutes: 43
        run: |
          set -euo pipefail
          image=ubuntu@sha256:076e7bf82319619f28dd0aa9c02ab34b055ad37100395b4f49a2ffba04fb5e11
          timeout --signal=TERM --kill-after=15s 90s docker pull "$image"
          name="btx-s3-desktop-package-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          set -o pipefail
          timeout --signal=TERM --kill-after=15s 2400s docker run --name "$name" --init --platform linux/amd64 \
            --memory=7g --cpus=2 --pids-limit=1024 \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" \
            -e GITHUB_WORKSPACE -e EXPECTED_WORKSPACE "$image" \
            bash -euo pipefail -c '
              timeout --signal=TERM --kill-after=10s 480s bash control/dependencies/setup.sh "$GITHUB_WORKSPACE/build-records" "$GITHUB_WORKSPACE/control/dependencies"
              /opt/hostedtoolcache/Python/3.12.16/x64/bin/python3 control/controller/package_only.py
            ' 2>&1 | tee build-records/container.log
      - name: Retain checkpoint and exact producer records
        if: always()
        id: records
        timeout-minutes: 5
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: session3-linux-desktop-package-records-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build-records/
            control/dependencies/receipt.json
            historical/dependencies-receipt.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Retain admitted candidate only
        if: steps.producer.outcome == 'success'
        id: candidate
        timeout-minutes: 3
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: session3-linux-desktop-package-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: desktop-candidate/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Verify uploaded artifact identities
        if: always() && steps.records.outcome == 'success'
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
          RECORDS_ID: ${{ steps.records.outputs.artifact-id }}
          RECORDS_DIGEST: ${{ steps.records.outputs.artifact-digest }}
          CANDIDATE_ID: ${{ steps.candidate.outputs.artifact-id }}
          CANDIDATE_DIGEST: ${{ steps.candidate.outputs.artifact-digest }}
        run: python3 control/verify-retention.py
