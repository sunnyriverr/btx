name: Linux release replacement producer
on:
  push:
    branches: [codex/ci-linux-replacement-producer]
permissions:
  contents: read
  actions: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 145
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: btxchain/btx
          ref: 88c9b49cb16360fc8fbf3f84003b8b54c29e6db5
          path: accepted-source
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 13714209829
          run-id: 42708038748
          github-token: ${{ github.token }}
          path: saved-checkpoint
          merge-multiple: true
      - name: Configure, verify plan, build and admit archive
        id: package
        timeout-minutes: 134
        run: |
          set -o pipefail
          image=ubuntu@sha256:076e7bf82319619f28dd0aa9c02ab34b055ad37100395b4f49a2ffba04fb5e11
          docker pull "$image"
          docker run --rm --init --platform linux/amd64 \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" \
            -e GITHUB_WORKSPACE "$image" bash -e -c 'bash setup.sh && bash build.sh' 2>&1 | tee producer-build.log
          python3 verify-retained.py candidate-input
      - name: Retain admitted archive and provenance
        id: retain
        if: steps.package.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-x86_64-release-candidate
          path: |
            candidate-input/btx-linux-gui-candidate.tar.gz
            candidate-input/provenance.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Retain separate producer logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-release-producer-records
          path: |
            pilot-records/
            producer-build.log
          if-no-files-found: warn
          retention-days: 7
      - name: Record archive artifact identity
        if: steps.retain.outcome == 'success'
        env:
          ARTIFACT_ID: ${{ steps.retain.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.retain.outputs.artifact-digest }}
        run: |
          test -n "$ARTIFACT_ID" && test -n "$ARTIFACT_DIGEST"
          printf 'Archive artifact ID: %s\nOuter artifact digest: %s\n' "$ARTIFACT_ID" "$ARTIFACT_DIGEST"
