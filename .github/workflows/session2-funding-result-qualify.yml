{
  "name": "Session2 model funding result qualification",
  "on": {
    "push": {
      "branches": [
        "codex/ci-model-funding-result-qualify"
      ]
    }
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "concurrency": {
    "group": "session2-funding-result-qualify",
    "cancel-in-progress": false
  },
  "jobs": {
    "qualify": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 40,
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Offline negative result controls and narrow typed diff",
          "run": "python3 -B -m unittest discover -s proposal -p test_offline.py -v"
        },
        {
          "name": "Verify and restore isolated coherent retained cache",
          "run": "python3 -B proposal/stage.py",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          }
        },
        {
          "name": "Same maintained baseline and candidate test with bounded node rebuild",
          "timeout-minutes": 32,
          "run": "docker run --name s2-funding-qualify --init -v \"$GITHUB_WORKSPACE:$GITHUB_WORKSPACE\" -w \"$GITHUB_WORKSPACE\" -e GITHUB_WORKSPACE ubuntu@sha256:076e7bf82319619f28dd0aa9c02ab34b055ad37100395b4f49a2ffba04fb5e11 bash -e -c 'timeout --kill-after=15s 600s bash proposal/setup.sh; export PATH=/opt/hostedtoolcache/Python/3.12.16/x64/bin:$PATH; export BTX_OPENSSL=\"$GITHUB_WORKSPACE/gui-pilot-runtime/openssl/bin/openssl\"; /opt/hostedtoolcache/Python/3.12.16/x64/bin/python3 -B proposal/qualify.py' "
        },
        {
          "name": "Stop only owned container",
          "if": "always()",
          "run": "docker rm -f s2-funding-qualify >/dev/null 2>&1; test -z \"$(docker ps -aq --filter name=^/s2-funding-qualify$)\""
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "if": "always()",
          "with": {
            "name": "funding-result-qualification",
            "path": "records/",
            "if-no-files-found": "error",
            "retention-days": 14
          }
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "if": "always()",
          "with": {
            "name": "funding-result-binary",
            "path": "binaries/",
            "if-no-files-found": "ignore",
            "retention-days": 14
          }
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "if": "always()",
          "with": {
            "name": "funding-result-checkpoint",
            "path": "checkpoint-new/",
            "if-no-files-found": "ignore",
            "retention-days": 14
          }
        }
      ]
    }
  }
}
