name: C-PORT fresh Qt deployment
on:
  push:
    branches: [codex/ci-c-port-qt-fresh]
permissions:
  contents: read
  actions: read
jobs:
  restore:
    if: github.repository == 'sunnyriverr/btx'
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /contrib/devtools/c-port-qt-fresh/
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: btxchain/btx
          ref: c6f9678dd225572528d06c456c16eb4c78bc637c
          path: product
          persist-credentials: false
      - name: Recreate exact admitted prerequisites and configuration without BTX compilation
        timeout-minutes: 30
        run: python3 contrib/devtools/c-port-qt-fresh/configure.py
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        timeout-minutes: 8
        with:
          artifact-ids: 13867962531
          run-id: 43046975785
          github-token: ${{ github.token }}
          path: producer-binaries
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        timeout-minutes: 8
        with:
          artifact-ids: 13868692030
          run-id: 43046975785
          github-token: ${{ github.token }}
          path: producer-checkpoints
          merge-multiple: true
      - name: Verify producer bytes and assemble admitted packages
        timeout-minutes: 25
        run: python3 contrib/devtools/c-port-qt-fresh/run.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: c-port-qt-fresh-records
          path: |
            mac-config-records
            package-records
          retention-days: 14
