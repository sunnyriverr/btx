{
  "name": "Windows main bounded build and archive",
  "on": {
    "push": {
      "branches": [
        "codex/ci-windows-root-configure"
      ]
    }
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "concurrency": {
    "group": "windows-main-configure-preflight",
    "cancel-in-progress": false
  },
  "jobs": {
    "plan": {
      "runs-on": "windows-2025",
      "timeout-minutes": 55,
      "steps": [
        {
          "name": "Exact source bytes",
          "shell": "pwsh",
          "run": "git config --global core.autocrlf false\ngit config --global core.longpaths true"
        },
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "path": "controls",
            "persist-credentials": false,
            "sparse-checkout": "contrib/devtools/windows-main-preflight"
          }
        },
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "repository": "btxchain/btx",
            "ref": "dac9aee53520bd49ed320ec7a49b9072fc7d88d9",
            "path": "btx",
            "persist-credentials": false
          }
        },
        {
          "name": "Hosted disk admission",
          "shell": "pwsh",
          "run": "if ((Get-PSDrive D).Free -lt 12GB) { throw \"Need12GiB before restore\" }"
        },
        {
          "uses": "actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1",
          "with": {
            "python-version": "3.12.10"
          }
        },
        {
          "name": "Install binary-only configure dependencies",
          "run": "python -m pip install --only-binary=:all: cryptography==46.0.4 cffi==2.0.0 pycparser==2.23"
        },
        {
          "name": "Restore project",
          "id": "project",
          "uses": "actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830",
          "with": {
            "path": "D:\\btx-native-035\\project-build\nD:\\btx-native-035\\vcpkg-installed",
            "key": "btx356-dac9-build-v1-42584109380",
            "fail-on-cache-miss": true
          }
        },
        {
          "name": "Restore dependencies",
          "id": "dependencies",
          "uses": "actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830",
          "with": {
            "path": "D:\\btx-native-035\\openssl-3.5.4-static\nD:\\btx-native-035\\binary-cache",
            "key": "btx356-root-v1-windows-14.51.36231-690b2e59699b64766618b28290f0ed35c71e4d28e5d4b61ae407e5724af9d9d7-ossl354-afa249f1",
            "fail-on-cache-miss": true
          }
        },
        {
          "name": "Restore ports",
          "id": "ports",
          "uses": "actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830",
          "with": {
            "path": "D:\\btx-native-035\\binary-cache",
            "key": "btx356-ports-v1-windows-14.51.36231-690b2e59699b64766618b28290f0ed35c71e4d28e5d4b61ae407e5724af9d9d7-afa249f1-41955207582",
            "fail-on-cache-miss": true
          }
        },
        {
          "name": "Verify profile, configure and confirm254step plan",
          "shell": "cmd",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "for /f \"usebackq tokens=*\" %%i in (`\"C:\\Program Files (x86)\\Microsoft Visual Studio\\Installer\\vswhere.exe\" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set \"BTX_VS=%%i\"\nif not defined BTX_VS exit /b 2\ncall \"%BTX_VS%\\Common7\\Tools\\VsDevCmd.bat\" -no_logo -arch=x64 -host_arch=x64\nif errorlevel 1 exit /b %errorlevel%\nset \"PATH=C:\\Program Files\\LLVM\\bin;%PATH%\"\nset \"CL=\"\nset \"_CL_=\"\npython controls/contrib/devtools/windows-main-preflight/native_plan.py\nexit /b %errorlevel%\n"
        },
        {
          "name": "Bounded eight-target build, two jobs",
          "shell": "cmd",
          "run": "for /f \"usebackq tokens=*\" %%i in (`\"C:\\Program Files (x86)\\Microsoft Visual Studio\\Installer\\vswhere.exe\" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set \"BTX_VS=%%i\"\nif not defined BTX_VS exit /b 2\ncall \"%BTX_VS%\\Common7\\Tools\\VsDevCmd.bat\" -no_logo -arch=x64 -host_arch=x64\nif errorlevel 1 exit /b %errorlevel%\nset \"PATH=C:\\Program Files\\LLVM\\bin;%PATH%\"\nset \"CL=\"\nset \"_CL_=\"\npython controls/contrib/devtools/windows-main-preflight/native_build.py\nexit /b %errorlevel%\n"
        },
        {
          "name": "Record successor file hashes and source",
          "shell": "cmd",
          "run": "for /f \"usebackq tokens=*\" %%i in (`\"C:\\Program Files (x86)\\Microsoft Visual Studio\\Installer\\vswhere.exe\" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set \"BTX_VS=%%i\"\nif not defined BTX_VS exit /b 2\ncall \"%BTX_VS%\\Common7\\Tools\\VsDevCmd.bat\" -no_logo -arch=x64 -host_arch=x64\nif errorlevel 1 exit /b %errorlevel%\nset \"PATH=C:\\Program Files\\LLVM\\bin;%PATH%\"\nset \"CL=\"\nset \"_CL_=\"\npython controls/contrib/devtools/windows-main-preflight/retain.py\nexit /b %errorlevel%\n",
          "if": "always()"
        },
        {
          "name": "Preserve successor compiled objects",
          "if": "always()",
          "uses": "actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830",
          "with": {
            "path": "D:\\btx-native-035\\project-build\nD:\\btx-native-035\\vcpkg-installed",
            "key": "btx-main074-successor-${{ github.run_id }}"
          }
        },
        {
          "name": "Actual current archive and bounded lifecycle",
          "shell": "cmd",
          "run": "for /f \"usebackq tokens=*\" %%i in (`\"C:\\Program Files (x86)\\Microsoft Visual Studio\\Installer\\vswhere.exe\" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set \"BTX_VS=%%i\"\nif not defined BTX_VS exit /b 2\ncall \"%BTX_VS%\\Common7\\Tools\\VsDevCmd.bat\" -no_logo -arch=x64 -host_arch=x64\nif errorlevel 1 exit /b %errorlevel%\nset \"PATH=C:\\Program Files\\LLVM\\bin;%PATH%\"\nset \"CL=\"\nset \"_CL_=\"\npython controls/contrib/devtools/windows-main-preflight/native_archive.py\nexit /b %errorlevel%\n"
        },
        {
          "name": "Retain results and exact archive",
          "if": "always()",
          "uses": "actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f",
          "with": {
            "name": "windows-main-build-archive",
            "path": "D:\\btx-native-035\\preflight-evidence\nrecords",
            "retention-days": 14
          }
        }
      ]
    }
  }
}