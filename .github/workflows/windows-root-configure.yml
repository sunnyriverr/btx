name: Native Windows current-source prerequisite diagnosis
permissions:
  contents: read
jobs:
  configure:
    if: github.repository == 'sunnyriverr/btx'
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      BTX_NATIVE_ROOT: D:\btx-native-035
    steps:
    - name: Preserve source checkout bytes
      shell: pwsh
      run: 'git config --global core.autocrlf false

        git config --global core.longpaths true

        '
    - name: Checkout diagnostic controls
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: controls
        persist-credentials: false
    - name: Checkout exact accepted BTX source
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: btxchain/btx
        ref: 666673a3153225ba264c7870e0e82e354df86765
        path: btx
        persist-credentials: false
    - name: Identify native compiler cache profile
      id: environment
      shell: pwsh
      run: '$vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64
        -property installationPath

        if (-not $vs) { throw "Native Visual Studio tools missing" }

        $toolset = (Get-Content "$vs\VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt").Trim()

        "toolset=$toolset" >> $env:GITHUB_OUTPUT

        '
    - name: Reuse exact-profile dependency binaries
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: 'D:\btx-native-035\openssl-3.5.4-static

          D:\btx-native-035\binary-cache

          '
        key: btx356-root-v1-windows-${{ steps.environment.outputs.toolset }}-${{ hashFiles('btx/vcpkg.json')
          }}-ossl354-afa249f1
      id: dependency_restore
    - name: Require retained native dependency payload before any setup compilation
      shell: pwsh
      env:
        MATCHED_DEPENDENCIES: ${{ steps.dependency_restore.outputs.cache-matched-key
          }}
      run: if (-not $env:MATCHED_DEPENDENCIES) { throw "Existing dependency cache
        required; refusing cold setup build" }
    - name: Reuse completed vcpkg port binaries
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: D:\btx-native-035\binary-cache
        key: btx356-ports-v1-windows-${{ steps.environment.outputs.toolset }}-${{
          hashFiles('btx/vcpkg.json') }}-afa249f1-${{ github.run_id }}
        restore-keys: 'btx356-ports-v1-windows-${{ steps.environment.outputs.toolset
          }}-${{ hashFiles(''btx/vcpkg.json'') }}-afa249f1-

          '
    - name: Provision verified native static OpenSSL
      shell: cmd
      run: 'for /f "usebackq tokens=*" %%i in (`"C:\Program Files (x86)\Microsoft
        Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64
        -property installationPath`) do set "BTX_VS=%%i"

        if not defined BTX_VS exit /b 2

        call "%BTX_VS%\Common7\Tools\VsDevCmd.bat" -no_logo -arch=x64 -host_arch=x64

        if errorlevel 1 exit /b %errorlevel%

        set "PATH=C:\Program Files\LLVM\bin;C:\Strawberry\perl\bin;C:\Program Files\NASM;%PATH%"

        set "CL="

        set "_CL_="

        python controls/contrib/devtools/windows-root-configure/runner.py openssl

        exit /b %errorlevel%

        '
    - name: Bootstrap pinned vcpkg tool
      shell: cmd
      run: 'for /f "usebackq tokens=*" %%i in (`"C:\Program Files (x86)\Microsoft
        Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64
        -property installationPath`) do set "BTX_VS=%%i"

        if not defined BTX_VS exit /b 2

        call "%BTX_VS%\Common7\Tools\VsDevCmd.bat" -no_logo -arch=x64 -host_arch=x64

        if errorlevel 1 exit /b %errorlevel%

        set "PATH=C:\Program Files\LLVM\bin;C:\Strawberry\perl\bin;C:\Program Files\NASM;%PATH%"

        set "CL="

        set "_CL_="

        python controls/contrib/devtools/windows-root-configure/runner.py vcpkg

        exit /b %errorlevel%

        '
    - name: Fingerprint source and native build profile
      id: project_profile
      shell: cmd
      run: 'for /f "usebackq tokens=*" %%i in (`"C:\Program Files (x86)\Microsoft
        Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64
        -property installationPath`) do set "BTX_VS=%%i"

        if not defined BTX_VS exit /b 2

        call "%BTX_VS%\Common7\Tools\VsDevCmd.bat" -no_logo -arch=x64 -host_arch=x64

        if errorlevel 1 exit /b %errorlevel%

        set "PATH=C:\Program Files\LLVM\bin;C:\Strawberry\perl\bin;C:\Program Files\NASM;%PATH%"

        set "CL="

        set "_CL_="

        python controls/contrib/devtools/windows-root-configure/runner.py profile

        exit /b %errorlevel%

        '
    - name: Restore exact source and profile project objects
      id: project_restore
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: 'D:\btx-native-035\project-build

          D:\btx-native-035\vcpkg-installed

          '
        key: btx356-s3cleanup-v1-8ac8ea813b9630b168003f71dcbc3449f81828ffe7a9ce1035cb99706fc8b08b-42348955391
    - name: Require existing exact-profile checkpoint for restore proof
      shell: pwsh
      env:
        MATCHED_CACHE: ${{ steps.project_restore.outputs.cache-matched-key }}
      run: 'if (-not $env:MATCHED_CACHE) { throw "Restore proof requires an existing
        cache; refusing fresh rebuild" }

        '
    - name: Verify and restore exactc660 source profile and5885cachedobjects
      id: prepare
      shell: cmd
      run: 'for /f "usebackq tokens=*" %%i in (`"C:\Program Files (x86)\Microsoft
        Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64
        -property installationPath`) do set "BTX_VS=%%i"

        if not defined BTX_VS exit /b 2

        call "%BTX_VS%\Common7\Tools\VsDevCmd.bat" -no_logo -arch=x64 -host_arch=x64

        if errorlevel 1 exit /b %errorlevel%

        set "PATH=C:\Program Files\LLVM\bin;C:\Strawberry\perl\bin;C:\Program Files\NASM;%PATH%"

        set "CL="

        set "_CL_="

        python controls/contrib/devtools/windows-root-configure/full.py prepare

        exit /b %errorlevel%

        '
    - name: Configure exact current d522 source with the retained dependencies
      id: cases
      shell: cmd
      run: 'for /f "usebackq tokens=*" %%i in (`"C:\Program Files (x86)\Microsoft
        Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64
        -property installationPath`) do set "BTX_VS=%%i"

        if not defined BTX_VS exit /b 2

        call "%BTX_VS%\Common7\Tools\VsDevCmd.bat" -no_logo -arch=x64 -host_arch=x64

        if errorlevel 1 exit /b %errorlevel%

        set "PATH=C:\Program Files\LLVM\bin;C:\Strawberry\perl\bin;C:\Program Files\NASM;%PATH%"

        set "CL="

        set "_CL_="

        python controls/contrib/devtools/windows-root-configure/current_prerequisites.py
        configure

        exit /b %errorlevel%

        '
    - name: Inspect normal node full-unit and three-object plans
      id: fixture_build
      shell: cmd
      run: 'for /f "usebackq tokens=*" %%i in (`"C:\Program Files (x86)\Microsoft
        Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64
        -property installationPath`) do set "BTX_VS=%%i"

        if not defined BTX_VS exit /b 2

        call "%BTX_VS%\Common7\Tools\VsDevCmd.bat" -no_logo -arch=x64 -host_arch=x64

        if errorlevel 1 exit /b %errorlevel%

        set "PATH=C:\Program Files\LLVM\bin;C:\Strawberry\perl\bin;C:\Program Files\NASM;%PATH%"

        set "CL="

        set "_CL_="

        python controls/contrib/devtools/windows-root-configure/current_prerequisites.py
        plans

        exit /b %errorlevel%

        '
    - name: Compile only two suspect fixtures and one positive control
      id: fixture_run
      shell: cmd
      run: 'for /f "usebackq tokens=*" %%i in (`"C:\Program Files (x86)\Microsoft
        Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64
        -property installationPath`) do set "BTX_VS=%%i"

        if not defined BTX_VS exit /b 2

        call "%BTX_VS%\Common7\Tools\VsDevCmd.bat" -no_logo -arch=x64 -host_arch=x64

        if errorlevel 1 exit /b %errorlevel%

        set "PATH=C:\Program Files\LLVM\bin;C:\Strawberry\perl\bin;C:\Program Files\NASM;%PATH%"

        set "CL="

        set "_CL_="

        python controls/contrib/devtools/windows-root-configure/current_prerequisites.py
        compile

        exit /b %errorlevel%

        '
    - name: Verify current-source identity cleanup and untouched remote cache
      id: verification
      if: always() && steps.prepare.outcome == 'success'
      shell: cmd
      run: 'for /f "usebackq tokens=*" %%i in (`"C:\Program Files (x86)\Microsoft
        Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64
        -property installationPath`) do set "BTX_VS=%%i"

        if not defined BTX_VS exit /b 2

        call "%BTX_VS%\Common7\Tools\VsDevCmd.bat" -no_logo -arch=x64 -host_arch=x64

        if errorlevel 1 exit /b %errorlevel%

        set "PATH=C:\Program Files\LLVM\bin;C:\Strawberry\perl\bin;C:\Program Files\NASM;%PATH%"

        set "CL="

        set "_CL_="

        python controls/contrib/devtools/windows-root-configure/current_prerequisites.py
        finish

        exit /b %errorlevel%

        '
    - name: Preserve native maintained target records
      if: always()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: native-windows-current-prerequisites
        path: D:\btx-native-035\evidence\
        retention-days: 14
'on':
  push:
    branches:
    - codex/ci-windows-root-configure
