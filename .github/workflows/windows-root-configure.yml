name: C-PORT Windows profile attribute diagnostic
on:
  push:
    branches: [codex/ci-windows-root-configure]
permissions:
  contents: read
jobs:
  profile-attributes:
    if: github.repository == 'sunnyriverr/btx'
    runs-on: windows-2025
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Measure native profile path attributes
        run: python contrib/devtools/windows-root-configure/profile-attributes.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: c-port-windows-profile-attributes
          path: ${{ runner.temp }}/profile-attributes.json
          retention-days: 7
