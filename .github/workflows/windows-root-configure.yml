{
  "name": "Windows five-case networking acceptance, retained binary",
  "on": {
    "push": {
      "branches": [
        "codex/ci-windows-root-configure"
      ]
    }
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "concurrency": {
    "group": "windows-main-configure-preflight",
    "cancel-in-progress": false
  },
  "jobs": {
    "plan": {
      "runs-on": "windows-2025",
      "timeout-minutes": 20,
      "steps": [
        {
          "name": "Exact source bytes",
          "shell": "pwsh",
          "run": "git config --global core.autocrlf false\ngit config --global core.longpaths true"
        },
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "path": "controls",
            "persist-credentials": false,
            "sparse-checkout": "contrib/devtools/windows-main-preflight"
          }
        },
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "repository": "btxchain/btx",
            "ref": "1e2f8b5f12295002334d3390c12cac0bb4ae2aff",
            "path": "btx",
            "persist-credentials": false
          }
        },
        {
          "name": "Hosted disk admission",
          "shell": "pwsh",
          "run": "if ((Get-PSDrive D).Free -lt 12GB) { throw \"Need12GiB before restore\" }"
        },
        {
          "uses": "actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1",
          "with": {
            "python-version": "3.12.10"
          }
        },
        {
          "name": "Restore project",
          "id": "project",
          "uses": "actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830",
          "with": {
            "path": "D:\\btx-native-035\\project-build\nD:\\btx-native-035\\vcpkg-installed",
            "key": "btx-release17-unit-43770878562",
            "fail-on-cache-miss": true
          }
        },
        {
          "name": "Verify immutable checkpoint and binary, no build",
          "shell": "cmd",
          "run": "for /f \"usebackq tokens=*\" %%i in (`\"C:\\Program Files (x86)\\Microsoft Visual Studio\\Installer\\vswhere.exe\" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set \"BTX_VS=%%i\"\nif not defined BTX_VS exit /b 2\ncall \"%BTX_VS%\\Common7\\Tools\\VsDevCmd.bat\" -no_logo -arch=x64 -host_arch=x64\nif errorlevel 1 exit /b %errorlevel%\nset \"PATH=C:\\Program Files\\LLVM\\bin;%PATH%\"\nset \"CL=\"\nset \"_CL_=\"\npython controls/contrib/devtools/windows-main-preflight/runtime5/native.py prepare\nexit /b %errorlevel%\n",
          "timeout-minutes": 10
        },
        {
          "name": "Exactly five networking cases, five-minute runtime cap",
          "shell": "cmd",
          "run": "for /f \"usebackq tokens=*\" %%i in (`\"C:\\Program Files (x86)\\Microsoft Visual Studio\\Installer\\vswhere.exe\" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set \"BTX_VS=%%i\"\nif not defined BTX_VS exit /b 2\ncall \"%BTX_VS%\\Common7\\Tools\\VsDevCmd.bat\" -no_logo -arch=x64 -host_arch=x64\nif errorlevel 1 exit /b %errorlevel%\nset \"PATH=C:\\Program Files\\LLVM\\bin;%PATH%\"\nset \"CL=\"\nset \"_CL_=\"\npython controls/contrib/devtools/windows-main-preflight/runtime5/native.py run\nexit /b %errorlevel%\n",
          "timeout-minutes": 6
        },
        {
          "name": "Clean only owned runtime and verify immutable cache",
          "if": "always()",
          "shell": "cmd",
          "run": "python controls/contrib/devtools/windows-main-preflight/runtime5/native.py cleanup",
          "timeout-minutes": 5
        },
        {
          "name": "Retain exact runtime results",
          "if": "always()",
          "uses": "actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f",
          "with": {
            "name": "windows-unit-network-five-evidence",
            "path": "D:\\btx-native-035\\unit-runtime4-evidence",
            "retention-days": 14
          }
        }
      ]
    }
  }
}
