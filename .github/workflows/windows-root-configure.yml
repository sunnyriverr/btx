name: Export verified Windows checkpoint for wallet test
on:
  push:
    branches: [codex/ci-windows-root-configure]
permissions:
  contents: read
jobs:
  export:
    if: github.repository == 'sunnyriverr/btx'
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: checkpoint
        with:
          path: |
            D:\btx-native-035\project-build
            D:\btx-native-035\vcpkg-installed
          key: btx356-dac9-build-v1-42584109380
          fail-on-cache-miss: true
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: openssl
        with:
          path: |
            D:\btx-native-035\openssl-3.5.4-static
            D:\btx-native-035\binary-cache
          key: btx356-root-v1-windows-14.51.36231-690b2e59699b64766618b28290f0ed35c71e4d28e5d4b61ae407e5724af9d9d7-ossl354-afa249f1
          fail-on-cache-miss: true
      - name: Validate checkpoint and preserve file timestamps
        shell: pwsh
        timeout-minutes: 6
        run: |
          $root = 'D:\btx-native-035'
          $marker = Join-Path $root 'project-build/btx-checkpoint.json'
          $expected = '2482100da1abb82abda529df0223f815ee8f498fd8cfb470f0803f865db4bdec'
          if ((Get-FileHash $marker -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Wrong checkpoint' }
          $record = Get-Content -Raw $marker | ConvertFrom-Json -AsHashtable
          if ($record.profile.source -ne 'dac9aee53520bd49ed320ec7a49b9072fc7d88d9' -or $record.files.Count -ne 12858) { throw 'Wrong checkpoint source or file count' }
          $out = Join-Path $env:GITHUB_WORKSPACE 'portable-output'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $payload = Join-Path $out 'checkpoint.tar'
          tar.exe --format=pax -cf $payload -C $root project-build vcpkg-installed openssl-3.5.4-static
          if ($LASTEXITCODE -ne 0) { throw 'Archive creation failed' }
          $digest = (Get-FileHash $payload -Algorithm SHA256).Hash.ToLowerInvariant()
          @{ payload = 'checkpoint.tar'; sha256 = $digest; bytes = (Get-Item $payload).Length; marker = $expected; run = $env:GITHUB_RUN_ID } | ConvertTo-Json | Set-Content (Join-Path $out 'receipt.json')
          Get-Content (Join-Path $out 'receipt.json')
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: pr467-portable-dac9
          path: portable-output
          compression-level: 1
          retention-days: 2
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: pr467-portable-dac9-receipt
          path: portable-output/receipt.json
          retention-days: 7
