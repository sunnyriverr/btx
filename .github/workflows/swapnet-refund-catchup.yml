name: SwapNet refund chain catch-up
on:
  push:
    branches: [codex/ci-swapnet-refund-catchup]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        case: [missed, control]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 14080763187
          run-id: 43514242465
          github-token: ${{ github.token }}
          path: payload
          merge-multiple: true
      - run: bash settle.sh ${{ matrix.case }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: swapnet-recovery-${{ matrix.case }}-records
          path: records/
          retention-days: 10
          if-no-files-found: error
