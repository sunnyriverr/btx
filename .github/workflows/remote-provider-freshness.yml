name: Remote observation freshness characterization
on:
  push:
    branches: [codex/ci-remote-provider-freshness]
permissions:
  contents: read
jobs:
  observe:
    if: github.repository == 'sunnyriverr/btx'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Compile unchanged health projection component
        run: |
          mkdir records
          g++ --version > records/compiler.txt
          g++ -std=c++20 -O0 -ffunction-sections -fdata-sections -Isrc -Isrc/univalue/include contrib/devtools/remote-provider-freshness/probe.cpp src/modelnet/search.cpp src/modelnet/piece_ranges.cpp src/univalue/lib/univalue.cpp src/univalue/lib/univalue_get.cpp src/univalue/lib/univalue_read.cpp src/univalue/lib/univalue_write.cpp -Wl,--gc-sections -o /tmp/provider-observation-probe > records/build.log 2>&1
          sha256sum src/modelnet/search.cpp src/modelnet/search.h src/modelnet/piece_ranges.cpp /tmp/provider-observation-probe > records/identities.txt
      - name: Characterize projection with controls
        run: /tmp/provider-observation-probe > records/observations.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: remote-provider-freshness-records
          path: records
          retention-days: 7
