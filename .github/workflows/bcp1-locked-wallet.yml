name: Native locked and watch-only BCP1 wallet observations
on:
  push:
    branches: [codex/ci-locked-wallet-bcp1]
permissions:
  contents: read
  actions: read
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 13719758757
          run-id: 42720680125
          github-token: ${{ github.token }}
          merge-multiple: true
          path: candidate-input
      - name: Runtime dependencies
        timeout-minutes: 4
        run: |
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 install -y --no-install-recommends libevent-dev libsqlite3-0 libzmq5 libgomp1
      - name: Run unchanged packaged node and disposable wallet matrix
        timeout-minutes: 6
        run: /usr/bin/python3 contrib/devtools/bcp1-locked-wallet/run_bcp1.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: bcp1-locked-wallet-records
          path: bcp1-records
          retention-days: 14
