name: SOURCE_FILES native two cases
on:
  push:
    branches: [codex/ci-sourcefiles-native]
permissions:
  contents: read
  actions: read
jobs:
  staging:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: btxchain/btx
          ref: 8d6d8b1aabf371b12f2b1f5797b950fed7962d4e
          path: product
          persist-credentials: false
      - name: Restore the known runtime prerequisites
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libevent-dev libzmq3-dev
      - name: Restore, hash and import only
        run: python3 stage.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Run only B1 and B2
        run: bash native.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sourcefiles-native-records
          path: records/
          retention-days: 14
          if-no-files-found: error
