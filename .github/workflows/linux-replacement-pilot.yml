name: Session 3 Atlas905 restore and preflight only
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: session3-atlas905-preflight-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preflight:
    if: github.repository == 'sunnyriverr/btx'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/linux-replacement-pilot.yml
            /contrib/devtools/session3-atlas905-preflight/
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: btxchain/btx
          ref: 7d65025bb3bff27e4f6c2fdc95f33e4b859a2df5
          path: product
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Prepare only the inspection toolchain and native dependencies
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          export RECORDS="$RUNNER_TEMP/session3-atlas905-records"
          mkdir "$RECORDS"
          printf 'RECORDS=%s\n' "$RECORDS" >> "$GITHUB_ENV"
          df -k "$RUNNER_TEMP" > "$RECORDS/disk-before.txt"
          cat /etc/os-release > "$RECORDS/os-release.txt"
          sudo timeout --kill-after=10s 120s apt-get -o Acquire::Retries=1 update > "$RECORDS/apt-update.log" 2>&1
          sudo timeout --kill-after=10s 180s apt-get install -y --no-install-recommends \
            build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev librsvg2-bin libxdo-dev patchelf > "$RECORDS/apt-install.log" 2>&1
          timeout --kill-after=10s 120s rustup toolchain install 1.95.0 --profile minimal > "$RECORDS/rustup.log" 2>&1
      - name: Verify and restore immutable Rust inputs without executing them
        timeout-minutes: 12
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          timeout --kill-after=15s 660s python -B contrib/devtools/session3-atlas905-preflight/restore.py
      - name: Check source, tools and offline dependency admission only
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          timeout --kill-after=10s 180s python -B contrib/devtools/session3-atlas905-preflight/preflight.py
      - name: Remove only this job's restored inputs
        if: always()
        shell: bash
        run: |
          timeout --kill-after=10s 90s python -B contrib/devtools/session3-atlas905-preflight/cleanup.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: session3-atlas905-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/session3-atlas905-records/*result.json
            ${{ runner.temp }}/session3-atlas905-records/*.txt
            ${{ runner.temp }}/session3-atlas905-records/*.log
          if-no-files-found: error
          retention-days: 14
