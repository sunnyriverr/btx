name: Session 3 Atlas905 no-rebuild dialog and Cancel
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: session3-atlas905-dialog-${{ github.ref }}
  cancel-in-progress: false
jobs:
  dialog:
    if: github.repository == 'sunnyriverr/btx'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/linux-replacement-pilot.yml
            /contrib/devtools/session3-atlas905-dialog/
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Admit only the existing binary's UI host
        timeout-minutes: 7
        shell: bash
        run: |
          set -euo pipefail
          export RECORDS="$RUNNER_TEMP/session3-atlas905-dialog-records"
          mkdir "$RECORDS"
          printf 'RECORDS=%s\nWORKER_PYTHON=%s\n' "$RECORDS" "$(command -v python)" >> "$GITHUB_ENV"
          sudo timeout --kill-after=10s 120s apt-get -o Acquire::Retries=1 update > "$RECORDS/apt-update.log" 2>&1
          sudo timeout --kill-after=10s 180s apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo3 \
            python3-pyatspi python3-gi at-spi2-core dbus-x11 xvfb xauth openbox scrot wmctrl xdotool \
            xdg-desktop-portal-gtk zenity libgl1-mesa-dri libgl1-mesa-glx > "$RECORDS/apt-install.log" 2>&1
          pkg-config --modversion gtk+-3.0 webkit2gtk-4.1 javascriptcoregtk-4.1 ayatana-appindicator3-0.1 > "$RECORDS/native-versions.txt"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('contrib/devtools/session3-atlas905-dialog/INPUTS.json')
          assert Path(os.environ['RECORDS'], 'native-versions.txt').read_text().splitlines() == json.loads(p.read_text())['native_versions']
          PY
      - name: Restore only the verified Atlas ELF
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: timeout --kill-after=10s 90s python -B contrib/devtools/session3-atlas905-dialog/restore_binary.py
      - name: Verify loader prerequisites without rebuilding
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          binary="$RUNNER_TEMP/session3-atlas905-dialog-binary/btx-atlas"
          timeout 15s ldd "$binary" > "$RECORDS/atlas-ldd.txt"
          if grep -q 'not found' "$RECORDS/atlas-ldd.txt"; then exit 1; fi
          timeout 15s readelf -h "$binary" > "$RECORDS/atlas-elf.txt"
      - name: Observe the long native review and Cancel
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export XDG_CURRENT_DESKTOP=Openbox XDG_SESSION_TYPE=x11
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/session3-atlas905-dialog-xdg"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/session3-atlas905-dialog-portal"
          mkdir -p "$XDG_RUNTIME_DIR" "$XDG_CONFIG_HOME/xdg-desktop-portal"
          chmod 700 "$XDG_RUNTIME_DIR"
          printf '[preferred]\ndefault=gtk\n' > "$XDG_CONFIG_HOME/xdg-desktop-portal/portals.conf"
          timeout --signal=TERM --kill-after=45s 390s dbus-run-session -- \
            xvfb-run -a -s '-screen 0 1440x1000x24 -nolisten tcp' bash -ec '
              dbus-update-activation-environment DISPLAY XAUTHORITY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE XDG_RUNTIME_DIR XDG_CONFIG_HOME
              timeout 20s gdbus call --session --dest org.freedesktop.portal.Desktop --object-path /org/freedesktop/portal/desktop --method org.freedesktop.DBus.Properties.Get org.freedesktop.portal.FileChooser version > "$RECORDS/portal.txt"
              openbox > "$RECORDS/openbox.log" 2>&1 & wm=$!
              export ATLAS905_WM_PID="$wm"
              trap '\''kill "$wm" 2>/dev/null || true; wait "$wm" 2>/dev/null || true'\'' EXIT
              /usr/bin/python3 -B contrib/devtools/session3-atlas905-dialog/dialog_check.py
            '
      - name: Final owned cleanup and explicit qualification
        if: always()
        run: timeout --kill-after=10s 60s python -B contrib/devtools/session3-atlas905-dialog/finalize.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: session3-atlas905-dialog-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/session3-atlas905-dialog-records
          if-no-files-found: error
          retention-days: 14
