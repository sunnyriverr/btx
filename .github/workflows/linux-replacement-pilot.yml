name: Linux release replacement configure pilot
on:
  push:
    branches: [codex/ci-linux-replacement-pilot]
permissions:
  contents: read
  actions: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: btxchain/btx
          ref: 88c9b49cb16360fc8fbf3f84003b8b54c29e6db5
          path: accepted-source
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 13714209829
          run-id: 42708038748
          github-token: ${{ github.token }}
          path: saved-checkpoint
          merge-multiple: true
      - name: Restore checkpoint and capture Ninja dry plan
        timeout-minutes: 18
        run: |
          image=ubuntu@sha256:076e7bf82319619f28dd0aa9c02ab34b055ad37100395b4f49a2ffba04fb5e11
          docker pull "$image"
          docker run --rm --init --platform linux/amd64 \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" \
            -e GITHUB_WORKSPACE "$image" bash setup.sh
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: linux-replacement-pilot-records
          path: pilot-records/
          retention-days: 7
