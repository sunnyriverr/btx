name: Cloud rejected checkpoint build and component controls
on:
  push:
    branches: [codex/ci-cloud-checkpoint-build]
permissions:
  contents: read
  actions: read
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: sunnyriverr/btx
          ref: 3a9effab0b623c1a6cc19257ecd0ddf936185a20
          path: accepted-source
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 14114517868
          run-id: 43595218373
          github-token: ${{ github.token }}
          path: saved-checkpoint
          merge-multiple: true
      - name: Restore, configure and inspect helper-only plan
        timeout-minutes: 60
        run: |
          image=ubuntu@sha256:076e7bf82319619f28dd0aa9c02ab34b055ad37100395b4f49a2ffba04fb5e11
          docker pull "$image"
          set -o pipefail
          docker run --rm --init --platform linux/amd64 -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" -e GITHUB_WORKSPACE "$image" bash -e -c 'bash setup.sh && bash compile.sh' 2>&1 | tee preparation.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cloud-checkpoint-candidate
          path: candidate/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cloud-checkpoint-cache
          path: resume-checkpoint/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cloud-checkpoint-records
          path: |
            records/
            pilot-records/
            preparation.log
          retention-days: 14
          if-no-files-found: warn
