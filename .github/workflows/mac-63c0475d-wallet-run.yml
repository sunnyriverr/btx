name: Mac ARM qualification of the adopted wallet export fix
on:
  push:
    branches: [codex/ci-mac-63c0475d-wallet-run]
permissions:
  contents: read
  actions: read
concurrency:
  group: mac-63c0475d-wallet-run
  cancel-in-progress: false
jobs:
  plan:
    if: github.repository == 'sunnyriverr/btx'
    runs-on: macos-15
    timeout-minutes: 42
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_UPGRADE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: proposal
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: btxchain/btx
          ref: 63c0475d4a8b11e80f727688c5c6d203a0ab938f
          path: product
          persist-credentials: false
          fetch-depth: 4
      - name: Verify checkpoint and dry-run the two wallet binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B proposal/plan.py
      - name: Build only btxd and btx-cli under the verified plan
        timeout-minutes: 13
        run: python3 -B proposal/build.py
      - name: Prepare the saved-profile wallet test runtime
        timeout-minutes: 5
        run: |
          framework_python="$(brew --prefix python@3.12)/bin/python3.12"
          "$framework_python" -m pip install --only-binary=:all: --break-system-packages cryptography==46.0.4
          "$framework_python" -I -c 'import cryptography, sqlite3; from cryptography.hazmat.primitives.ciphers.aead import AESGCM'
          test-env/bin/python -m pip install --only-binary=:all: cryptography==46.0.4 pyzmq==27.1.0
      - name: Run the original wallet case only
        timeout-minutes: 13
        run: test-env/bin/python -B proposal/focused.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: mac-63c0475d-wallet-run-records
          path: records
          if-no-files-found: error
          retention-days: 14
