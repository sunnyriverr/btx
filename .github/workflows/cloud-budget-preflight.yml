name: Cloud budget cache preflight
on:
  push:
    branches: [codex/ci-cloud-budget-preflight]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 13750286693
          run-id: 42787985840
          github-token: ${{ github.token }}
          merge-multiple: true
          path: saved-checkpoint
      - name: Verify cached cloud sources and unit target availability
        timeout-minutes: 3
        run: python3 contrib/devtools/cloud-budget-preflight/inspect_checkpoint.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: cloud-budget-preflight-records
          path: cloud-preflight-records
          retention-days: 14
