name: MinGW Lab persistence trace

on:
  workflow_dispatch:
  push:
    branches: ['ci-0.34.16/c-port-mingw-609']

concurrency:
  group: btx-0.34.16-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  RELEASE_BRANCH: "release-0.34.16"
  UPSTREAM_URL: "https://github.com/btxchain/btx.git"
  OSSL_VER: "3.5.4"
  OSSL_SHA256: "967311f84955316969bdb1d8d4b983718ef42338639c621ec4c34fddef355e99"
  BOOST_PIN_VER: "1.81.0"
  BOOST_PIN_SHA256: "205666dea9f6a7cfed87c7a6dfbeb52a2c1b9de55712c9c1a87735d7181452b6"
  # ccache 4.14.2 (18 Oct 2026); sha256 = the GitHub release asset digest of ccache-4.14.2-windows-x86_64.zip.
  CCACHE_WIN_VER: "4.14.2"
  CCACHE_WIN_SHA256: "6993ce645e53192cec592ee23186200b574ac4c59097ecde8d9cfd681b47ae84"
  # The vcpkg commit of the native Windows runs reported on #356 (3 Nov 2026); vcpkg.json's builtin-baseline
  # (c82f7466, 2024.09.30) still decides the port versions.
  VCPKG_COMMIT: "afa249f12f52ed8a3b919f195495ba8b330288d1"
  WIN_NATIVE_TARGETS: "btxd btx-cli btx-tx btx-util btx-modeld"
  # The pin of ci/lint/04_install.sh; sha256 of shellcheck-v0.8.0.linux.x86_64.tar.xz, checked 12 Nov 2026.
  SHELLCHECK_VER: "v0.8.0"
  SHELLCHECK_SHA256: "ab6ee1b178f014d1b86d1e24da20d1139656c8b0ed34d2867fbb834dad02bf0a"
  TIDY_LLVM_V: "19"
  UNIT_EXCLUDE: "^matmul_v4_rc_stage3_"
  KNOWN: "contrib/ci-fork/known-failing.txt"
  CCACHE_MAXSIZE: "2500M"
  CCACHE_COMPRESS: "true"
  CCACHE_NOHASHDIR: "true"
  CCACHE_COMPILERCHECK: "content"
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_NO_ANALYTICS: "1"
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
  PYTHONUNBUFFERED: "1"
  LINUX_TEST_TARGETS: "test_btx btxd btx-cli btx-open btx-modeld btx-wallet btx-util btx-hcpd btx-tx btx-hosted"
  CORE_SUITES: "util_tests,crypto_tests,hash_tests,key_tests,base58_tests,bech32_tests,uint256_tests,arith_uint256_tests,serialize_tests,streams_tests,script_tests,transaction_tests,sighash_tests,coins_tests,mempool_tests,validation_tests,blockchain_tests,net_tests,addrman_tests,getarg_tests,fs_tests,sock_tests,pq_crypto_tests,wallet_tests,lightwatch_tests,lab_lifecycle_tests,nif_sandbox_tests,guard_permit_tests,native_discovery_tests,cap02_tests,hire01_tests,acc07_tests,fixture_cleanup_tests"
  GUARD_SUITES: "guard_permit_tests,native_discovery_tests,cap02_tests,hire01_tests,acc07_tests"

jobs:
  tools:
    name: tools
    # Every other job needs this one, so this guard keeps the whole workflow off upstream and off every
    # branch except ci-0.34.16 and ci-0.34.16/* (push or manual run).
    if: ${{ github.repository_owner != 'btxchain' && (github.ref_name == 'ci-0.34.16' || startsWith(github.ref_name, 'ci-0.34.16/')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Check the CI helpers (selftests, shellcheck) and hand btx_ci.py on
        run: |
          command -v shellcheck >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q shellcheck; }
          python3 -m py_compile contrib/ci-fork/*.py
          python3 contrib/ci-fork/btx_ci.py selftest --job tools
          python3 contrib/ci-fork/coverage_check.py --selftest
          shellcheck contrib/ci-fork/*.sh
          mkdir -p ci-tools
          cp contrib/ci-fork/btx_ci.py ci-tools/btx_ci.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ci-tools
          path: ci-tools/btx_ci.py
          retention-days: 7
          overwrite: true

  # ------------------------------------------------------------------ static checks
  mingw-tests:
    name: mingw-tests
    needs: tools
    if: ${{ !cancelled() && needs.tools.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    outputs:
      test_btx: ${{ steps.bsum.outputs.test_btx }}
    env:
      HOSTW: x86_64-w64-mingw32
    steps:
      - name: Start
        run: |
          {
            echo "JOB_T0=$(date +%s)"
            echo "LOGS=$RUNNER_TEMP/logs"
            echo "CIPY=$RUNNER_TEMP/ci-tools/btx_ci.py"
            echo "CCACHE_DIR=$HOME/.ccache-btx"
            echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/logs"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ci-tools
          path: ${{ runner.temp }}/ci-tools
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          df -h / | tail -n 1
      - name: Install the mingw-w64 toolchain (posix threads)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends g++-mingw-w64-x86-64-posix gcc-mingw-w64-x86-64-posix \
            binutils-mingw-w64-x86-64 mingw-w64-x86-64-dev make cmake ninja-build curl patch pkgconf python3 ccache \
            xz-utils autoconf automake libtool
          for t in gcc g++; do
            if [ -e "/usr/bin/$HOSTW-$t-posix" ]; then
              sudo update-alternatives --set "$HOSTW-$t" "/usr/bin/$HOSTW-$t-posix" || true
            fi
          done
      - name: Restore depends prefix
        id: dep-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: depends/x86_64-w64-mingw32
          key: depends-mingw-v1-${{ hashFiles('depends/**') }}-ossl-${{ env.OSSL_VER }}
      - name: Restore completed MinGW unit compiler cache
        id: unit-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.ccache-btx
          key: ccache-mingw-43531300596-1-test
      - name: Require both saved caches
        env:
          DEPENDS_HIT: ${{ steps.dep-cache.outputs.cache-hit }}
          UNIT_HIT: ${{ steps.unit-cache.outputs.cache-hit }}
        run: |
          if [ "$DEPENDS_HIT" != true ] || [ "$UNIT_HIT" != true ]; then
            echo "Expected MinGW caches missing: depends=$DEPENDS_HIT unit=$UNIT_HIT"
            exit 1
          fi
      # Run 1's link failure was not caused by the prune: key_tests.cpp includes <secp256k1.h>, and
      # test_btx takes secp256k1's include directories but not its SECP256K1_STATIC definition, so on
      # Windows the calls become __imp_secp256k1_* imports that the static library does not provide.
      # CI-only edit, before configure, so pass 1 already compiles with it.
      - name: CI-only edit - give test_btx secp256k1's interface definitions (SECP256K1_STATIC)
        run: python3 "$CIPY" test-defs --src . --target test_btx --job "$GITHUB_JOB"
      - name: Configure (Modelnet ON)
        id: configure
        run: |
          PFX="$GITHUB_WORKSPACE/depends/$HOSTW"
          python3 "$CIPY" configure --name mingw --job "$GITHUB_JOB" --logs "$LOGS" --builddir build-win -- \
            -S . -B build-win -G Ninja --toolchain "$PFX/toolchain.cmake" -DCMAKE_BUILD_TYPE=Release \
            -DWITH_MODELNET=ON -DOPENSSL_ROOT_DIR="$PFX" -DOPENSSL_USE_STATIC_LIBS=ON -DBUILD_TESTS=ON -DBUILD_GUI=OFF \
            -DBUILD_BENCH=OFF -DWITH_ZMQ=ON -DWITH_CCACHE=ON -DREDUCE_EXPORTS=ON -DBUILD_GUI_TESTS=OFF \
            "-DCMAKE_CXX_FLAGS=-Wno-error=maybe-uninitialized -Wno-error=array-bounds"
      - name: Link test_btx and btx-open with all registered suites
        timeout-minutes: 40
        run: python3 "$CIPY" build --name focused --logs "$LOGS" --builddir build-win -- -k 0 -j"$(nproc)" test_btx btx-open
      - name: Build summary
        id: bsum
        if: ${{ !cancelled() && steps.configure.outcome == 'success' }}
        run: |
          python3 "$CIPY" build-summary --name focused --job "$GITHUB_JOB" --logs "$LOGS" \
            --exe test_btx=build-win/bin/test_btx.exe btx_open=build-win/bin/btx-open.exe
      - name: Package test_btx.exe and its DLLs
        if: ${{ !cancelled() && steps.bsum.outputs.test_btx == 'yes' && steps.bsum.outputs.btx_open == 'yes' }}
        run: |
          mkdir -p dist-tests
          cp build-win/bin/test_btx.exe build-win/bin/btx-open.exe src/test/data/modelnet_v11_vectors.json dist-tests/
          "$HOSTW-strip" dist-tests/test_btx.exe dist-tests/btx-open.exe
          python3 "$CIPY" dlls --job "$GITHUB_JOB" --objdump "$HOSTW-objdump" --dest dist-tests \
            --search "/usr/lib/gcc/$HOSTW/*-posix" "/usr/$HOSTW/lib" "/usr/$HOSTW/bin" --exe dist-tests/test_btx.exe dist-tests/btx-open.exe
          (cd dist-tests && sha256sum ./* > SHA256SUMS.txt)
      - name: Upload test_btx.exe
        if: ${{ !cancelled() && steps.bsum.outputs.test_btx == 'yes' && steps.bsum.outputs.btx_open == 'yes' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: win-tests
          path: dist-tests/
          retention-days: 7
          overwrite: true
      - name: Upload logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: logs-mingw-tests
          path: ${{ runner.temp }}/logs
          retention-days: 7
          overwrite: true
          if-no-files-found: ignore

  windows-tests:
    name: windows-tests
    needs: [tools, mingw-tests]
    if: ${{ needs.mingw-tests.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Start
        run: |
          {
            echo "JOB_T0=$(date +%s)"
            echo "LOGS=$RUNNER_TEMP/logs"
            echo "CIPY=$RUNNER_TEMP/ci-tools/btx_ci.py"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/logs"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ci-tools
          path: ${{ runner.temp }}/ci-tools
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: win-tests
          path: bin
      - name: Verify and run the single Lab lifecycle case
        timeout-minutes: 5
        run: |
          (cd bin && sha256sum -c SHA256SUMS.txt)
          bin/test_btx.exe --run_test=lab_lifecycle_tests/failed_write_is_rolled_back_and_does_not_block_later_writes \
            --log_level=test_suite --color_output=no > "$LOGS/lab-persistence-trace.log" 2>&1
      - name: Upload logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: logs-windows-tests
          path: ${{ runner.temp }}/logs
          retention-days: 7
          overwrite: true
          if-no-files-found: ignore
