name: Native Windows LAN400 component qualification
on:
  push:
    branches: [codex/ci-lan-native-windows]
permissions:
  contents: read
jobs:
  qualify:
    if: github.repository == 'sunnyriverr/btx'
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - name: Preserve checkout bytes
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - name: Checkout qualification recipe
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: controls
          persist-credentials: false
      - name: Checkout PR400 plus formatting correction
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: sunnyriverr/btx
          ref: d6be75960231f2c28e0ae355c75232f71bef40b7
          path: source
          persist-credentials: false
      - name: Build and execute real native component
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "BTX_LAN_VS=%%i"
          if not defined BTX_LAN_VS exit /b 2
          call "%BTX_LAN_VS%\Common7\Tools\VsDevCmd.bat" -no_logo -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b %errorlevel%
          set "PATH=C:\Program Files\LLVM\bin;%PATH%"
          set "CL="
          set "_CL_="
          set "LINK="
          python controls\contrib\devtools\lan-native-windows\runner.py
          exit /b %errorlevel%
      - name: Preserve qualification evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: lan400-native-windows
          path: ${{ runner.temp }}\lan400-native-evidence\
          retention-days: 14
