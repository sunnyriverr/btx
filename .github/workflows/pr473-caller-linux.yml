name: PR473 Linux helper error retry and restart
on:
  push:
    branches: [codex/ci-pr473-caller-linux]
permissions:
  contents: read
  actions: read
jobs:
  qualify:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: repch1c/btx
          ref: 07c588fe22545dff59a4744701ae9e01c7854cf9
          path: accepted-source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Pinned build and native prerequisites
        timeout-minutes: 8
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list
          sudo apt-get -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::Retries=1 update
          sudo apt-get -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::Retries=1 install -y --no-install-recommends build-essential cmake ninja-build pkg-config python3 perl libboost-dev libevent-dev libsqlite3-dev libzmq3-dev libqrencode-dev qt6-base-dev qt6-base-dev-tools qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev librsvg2-bin libxdo-dev patchelf strace
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 13750286693
          run-id: 42787985840
          github-token: ${{ github.token }}
          path: saved-checkpoint
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 13750246662
          run-id: 42787985840
          github-token: ${{ github.token }}
          path: prior-build
          merge-multiple: true
      - name: Offline result gates
        run: python3 qualification/verify_results.py
      - name: Verify restore and source and build only helper
        timeout-minutes: 23
        run: python3 qualification/build_updated.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: updated-build-records
          path: updated-build-records
          retention-days: 14
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: updated-build-state
          path: updated-build-state
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: updated-helper-binaries
          path: updated-helper-binaries
          retention-days: 14
      - name: Real helper save error retry and clean restart
        timeout-minutes: 6
        run: |
          cp -a updated-build-records build-input
          cp -a updated-helper-binaries helper-input
          timeout --signal=TERM --kill-after=10s 310s python3 qualification/run_updated.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: updated-native-records
          path: updated-native-records
          retention-days: 14
