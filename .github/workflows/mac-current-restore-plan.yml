name: Mac release checkpoint restore and Ninja plan
on:
  push:
    branches: [codex/ci-mac-current-restore-plan]
permissions:
  contents: read
  actions: read
jobs:
  restore:
    runs-on: macos-15
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: btxchain/btx
          ref: 36ab43008cac48aa5c8410e4b70d90a249196a33
          path: product
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 13635594086
          run-id: 42527268859
          github-token: ${{ github.token }}
          path: cmake-payload
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 13637244857
          run-id: 42530911365
          github-token: ${{ github.token }}
          path: cargo-payload
          merge-multiple: true
      - name: Verify pinned runner tools and configure baseline
        timeout-minutes: 30
        run: python3 contrib/devtools/mac-current-pilot/configure.py
      - name: Restore both checkpoints and inspect current dry plan
        timeout-minutes: 15
        run: python3 contrib/devtools/mac-current-pilot/pilot.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: mac-current-checkpoint-plan-records
          path: |
            pilot-records
            mac-config-records
          retention-days: 14
