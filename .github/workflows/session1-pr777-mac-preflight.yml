name: Session1 PR777 native Mac preflight
on:
  push:
    branches: [codex/ci-pr777-native-preflight]
permissions:
  contents: read
  actions: read
concurrency:
  group: session1-pr777-native-preflight
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'sunnyriverr/btx'
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_UPGRADE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: contrib/devtools/session1-pr777-native
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: btxchain/btx
          ref: cd3078e76398b20b7f500acd1348a5b5455f3d5e
          path: product
          persist-credentials: false
      - name: Select pinned isolated Python 3.12
        id: python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          architecture: arm64
          check-latest: false
      - name: Verify checkpoint, configure and expose true build plan
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_APPROVED: 'false'
          BTX_BUILD_PYTHON: ${{ steps.python.outputs.python-path }}
        run: python3 contrib/devtools/session1-pr777-native/preflight.py
      - name: Preserve source/build checkpoint without running BTX
        if: always()
        timeout-minutes: 5
        run: python3 contrib/devtools/session1-pr777-native/preserve.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: pr777-native-preflight-records
          path: records
          retention-days: 14
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: pr777-native-preflight-checkpoint
          path: retained
          compression-level: 0
          retention-days: 14
