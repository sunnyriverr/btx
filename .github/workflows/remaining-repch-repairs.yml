name: PR504, PR494 and PR502 recovery verification
on:
  push:
    branches: [codex/ci-repch-504-494-502]
permissions:
  contents: read
  actions: read
jobs:
  recovery:
    runs-on: ubuntu-22.04
    timeout-minutes: 42
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: repch1c/btx
          ref: b21ca36b961f52331b226f58a51aa45da99ecb67
          fetch-depth: 2
          path: author-504
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: repch1c/btx
          ref: 3ba462b19c2b2f5b33fb4ec8d5aa1e021da074b1
          fetch-depth: 2
          path: author-494
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: repch1c/btx
          ref: 5ef5032877ce3d4d72000f3640da48edce5dda35
          fetch-depth: 2
          path: author-502
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Retained build profile prerequisites
        timeout-minutes: 8
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list
          sudo apt-get -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::Retries=1 update
          sudo apt-get -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::Retries=1 install -y --no-install-recommends build-essential cmake ninja-build pkg-config python3 perl libboost-dev libevent-dev libsqlite3-dev libzmq3-dev libqrencode-dev qt6-base-dev qt6-base-dev-tools qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev librsvg2-bin libxdo-dev patchelf
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 13714209829
          run-id: 42708038748
          github-token: ${{ github.token }}
          merge-multiple: true
          path: saved-checkpoint
      - name: Build paired helpers and compile wallet targets
        timeout-minutes: 29
        run: python3 -u build.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: repch-repair-records
          path: repair-records
          retention-days: 14
