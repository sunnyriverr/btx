name: PR495 full catalog upgrade and restart
on:
  push:
    branches: [codex/ci-pr495-catalog-recovery]
permissions:
  contents: read
  actions: read
jobs:
  recovery:
    runs-on: ubuntu-22.04
    timeout-minutes: 42
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: btxchain/btx
          ref: dac9aee53520bd49ed320ec7a49b9072fc7d88d9
          path: accepted-source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Retained build profile prerequisites
        timeout-minutes: 8
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list
          sudo apt-get -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::Retries=1 update
          sudo apt-get -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::Retries=1 install -y --no-install-recommends build-essential cmake ninja-build pkg-config python3 perl libboost-dev libevent-dev libsqlite3-dev libzmq3-dev libqrencode-dev qt6-base-dev qt6-base-dev-tools qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev librsvg2-bin libxdo-dev patchelf
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 13714209829
          run-id: 42708038748
          github-token: ${{ github.token }}
          merge-multiple: true
          path: saved-checkpoint
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: campaign-helper-binaries
          run-id: 42787985840
          github-token: ${{ github.token }}
          path: stock-input
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: campaign-build-records
          run-id: 42787985840
          github-token: ${{ github.token }}
          path: stock-build-input
      - name: Verify immutable stock and build exact candidate within admitted graph
        timeout-minutes: 25
        run: python3 contrib/devtools/pr495-catalog-recovery/build_helper.py
      - name: Same full catalog before and after with clean restart controls
        timeout-minutes: 6
        run: timeout --signal=TERM --kill-after=40s 300s python3 contrib/devtools/pr495-catalog-recovery/run_recovery.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: pr495-records
          path: pr495-records
          retention-days: 14
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: pr495-binaries
          path: pr495-binaries
          retention-days: 14
