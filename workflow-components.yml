name: Windows capability runtime component controls
on:
  push:
    branches: [codex/ci-windows-root-configure]
permissions:
  contents: read
jobs:
  controls:
    if: github.repository == 'sunnyriverr/btx'
    runs-on: windows-2025
    timeout-minutes: 10
    env:
      BTX_NATIVE_ROOT: D:\btx-native-035
    steps:
      - name: Preserve source checkout bytes
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - name: Checkout controls
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: controls
          persist-credentials: false
      - name: Checkout exact accepted source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: btxchain/btx
          ref: 666673a3153225ba264c7870e0e82e354df86765
          path: btx
          persist-credentials: false
      - name: Run real-source CPU lifecycle and refusal controls
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "BTX_VS=%%i"
          if not defined BTX_VS exit /b 2
          call "%BTX_VS%\Common7\Tools\VsDevCmd.bat" -no_logo -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b %errorlevel%
          set "PATH=C:\Program Files\LLVM\bin;%PATH%"
          set "CL="
          set "_CL_="
          python controls/contrib/devtools/windows-root-configure/component-only.py
          exit /b %errorlevel%
      - name: Preserve component records
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: native-runtime-component-records
          path: D:\btx-native-035\evidence\
          retention-days: 14
