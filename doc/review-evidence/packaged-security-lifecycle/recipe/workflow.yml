name: Packaged security lifecycle
on:
  push:
    branches: [codex/ci-rpc-help-release-03416]
    paths:
      - .github/workflows/release-rpc-help.yml
      - contrib/devtools/packaged-security/**
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          repository: btxchain/btx
          ref: 2f3b574867c11ab79eba829123689b76e6137a38
          path: product
      - name: Install documented node runtime prerequisites
        run: |
          sudo apt-get -o Acquire::Retries=1 update
          sudo apt-get install -y --no-install-recommends libevent-dev libsqlite3-0 libzmq5 libgomp1
      - name: Qualify packaged embedded security lifecycle
        env:
          BTX_RUN_PACKAGED_SECURITY: explicit-native-authorisation
        run: python3 contrib/devtools/packaged-security/run.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: packaged-security-records
          path: packaged-security-results
          retention-days: 14
