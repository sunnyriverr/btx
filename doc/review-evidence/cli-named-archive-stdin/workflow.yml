name: Wallet archive CLI named stdin qualification
on:
  push:
    branches: [codex/ci-cli-named-archive-repair]
permissions:
  contents: read
  actions: read
jobs:
  observe:
    runs-on: ubuntu-22.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Retained daemon runtime libraries
        timeout-minutes: 7
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=12 update
          sudo apt-get -o Acquire::Retries=1 install -y --no-install-recommends libevent-core-2.1-7 libevent-extra-2.1-7 libevent-pthreads-2.1-7 libsqlite3-0 libzmq5 libevent-dev ninja-build libboost-dev libsqlite3-dev libzmq3-dev libqrencode-dev qt6-base-dev qt6-base-dev-tools qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev librsvg2-bin libxdo-dev patchelf
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 13810178420
          merge-multiple: true
          run-id: 42918244124
          github-token: ${{ github.token }}
          path: saved-bin
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 13750286693
          run-id: 42787985840
          github-token: ${{ github.token }}
          merge-multiple: true
          path: checkpoint-input
      - name: Relink CLI and run the matched native matrix
        timeout-minutes: 15
        run: |
          chmod +x saved-bin/btxd saved-bin/btx-cli
          python3 -u build.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: cli-named-archive-repair-records
          path: records
          retention-days: 14
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: cli-named-archive-repair-binaries
          path: |
            baseline-bin/btx-cli
            candidate-bin/btx-cli
          if-no-files-found: ignore
          retention-days: 14
