name: Cloud resume maintained and integrity qualification
on:
  push:
    branches: [codex/ci-cloud-resume-qualification]
permissions:
  contents: read
  actions: read
jobs:
  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: btxchain/btx
          ref: 8d6d8b1aabf371b12f2b1f5797b950fed7962d4e
          path: product
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 14112398679
          run-id: 43590785003
          github-token: ${{ github.token }}
          path: baseline
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 14115240828
          run-id: 43595218373
          github-token: ${{ github.token }}
          path: candidate
          merge-multiple: true
      - run: bash run.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cloud-resume-qualification
          path: records/
          retention-days: 14
          if-no-files-found: error
