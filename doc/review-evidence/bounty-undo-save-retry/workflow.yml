name: Bounty atomic undo save-retry qualification
on:
  push:
    branches: [codex/ci-bounty-save-retry-repair]
permissions:
  contents: read
  actions: read
concurrency:
  group: bounty-save-retry-repair
  cancel-in-progress: false
jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: btxchain/btx
          ref: bd847e2b986722c1723b4cd60988d4f4908452d4
          path: accepted-source
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: btxchain/btx
          ref: 895388354cd8b07a947ee245dc555eb02f0e96f6
          path: checkpoint-source
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 14294961995
          run-id: 44002524681
          github-token: ${{ github.token }}
          path: saved-checkpoint
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 14299733576
          run-id: 44018574680
          github-token: ${{ github.token }}
          path: binaries
          merge-multiple: true
      - name: Verify retained inputs and build/test normal helper
        run: |
          set -euo pipefail
          mkdir -p records
          image=ubuntu@sha256:076e7bf82319619f28dd0aa9c02ab34b055ad37100395b4f49a2ffba04fb5e11
          docker pull "$image"
          docker run --name bounty-repair-owned --init -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" -e GITHUB_WORKSPACE "$image" bash -e -c 'timeout --kill-after=20s 6m bash repairqual/setup.sh && /opt/hostedtoolcache/Python/3.12.16/x64/bin/python3 repairqual/build.py' 2>&1 | tee records/console.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bounty-save-retry-repair-records
          path: records/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bounty-save-retry-repair-binaries
          path: built/
          retention-days: 14
          if-no-files-found: warn
