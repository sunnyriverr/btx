# These environment variables are set by the build process and read by
# test/*/test_runner.py and test/util/rpcauth-test.py

[environment]
CLIENT_NAME=BTX
CLIENT_BUGREPORT=https://github.com/btxchain/btx/issues
SRCDIR=/home/runner/work/btx/btx/security-product
BUILDDIR=/home/runner/work/_temp/btx-security-integration-41998533532/build
EXEEXT=
RPCAUTH=/home/runner/work/btx/btx/security-product/share/rpcauth/rpcauth.py

[components]
# Which components are enabled. These are commented out by `configure` if they were disabled when running config.
#ENABLE_WALLET=true
USE_SQLITE=true
#USE_BDB=true
ENABLE_CLI=true
ENABLE_BITCOIN_UTIL=true
#ENABLE_WALLET_TOOL=true
ENABLE_UTIL_TX=true
ENABLE_UTIL_UTIL=true
ENABLE_BITCOIND=true
#ENABLE_FUZZ_BINARY=true
ENABLE_ZMQ=true
ENABLE_EXTERNAL_SIGNER=true
#ENABLE_USDT_TRACEPOINTS=true
