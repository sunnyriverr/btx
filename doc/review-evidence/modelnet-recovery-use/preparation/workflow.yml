name: ModelNet recovered model local use
on:
  push:
    branches: [codex/ci-modelnet-recovery-use]
permissions:
  contents: read
  actions: read
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: btxchain/btx
          ref: 1e2f8b5f12295002334d3390c12cac0bb4ae2aff
          path: product
          persist-credentials: false
      - name: Restore known runtime prerequisites
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libevent-dev libzmq3-dev python3-venv
      - name: Pinned local CPU runtime
        timeout-minutes: 10
        run: |
          python3 -m venv engine
          engine/bin/pip install --disable-pip-version-check --retries 1 --index-url https://download.pytorch.org/whl/cpu torch==2.7.1
          engine/bin/pip install --disable-pip-version-check --retries 1 transformers==4.53.3 safetensors==0.5.3
          mkdir -p records
          engine/bin/pip freeze > records/engine-versions.txt
          engine/bin/python -c "import torch,transformers; from transformers import GPT2LMHeadModel; assert not torch.cuda.is_available(); print(torch.__version__,transformers.__version__)"
          du -sb engine > records/engine-size.txt
      - name: Hash verification and import gate
        run: engine/bin/python stage.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Bounded recovered model use and restart
        run: bash native.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: modelnet-recovery-use-records
          path: records/
          retention-days: 14
          if-no-files-found: error
