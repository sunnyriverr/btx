{
  "name": "Session2 cancellation save qualification",
  "on": {
    "push": {
      "branches": [
        "codex/ci-retrieval-cancel-save"
      ]
    }
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "concurrency": {
    "group": "session2-retrieval-cancel-save",
    "cancel-in-progress": false
  },
  "jobs": {
    "qualify": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 70,
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "repository": "btxchain/btx",
            "ref": "cd3078e76398b20b7f500acd1348a5b5455f3d5e",
            "path": "current-reference",
            "fetch-depth": 0,
            "persist-credentials": false
          }
        },
        {
          "name": "Verify exact retained checkpoint",
          "timeout-minutes": 8,
          "run": "python3 -B proposal/stage.py",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          }
        },
        {
          "name": "Bounded same-test baseline and candidate qualification",
          "timeout-minutes": 57,
          "run": "docker run --name s2-cancel-save --init -v \"$GITHUB_WORKSPACE:$GITHUB_WORKSPACE\" -w \"$GITHUB_WORKSPACE\" -e GITHUB_WORKSPACE ubuntu@sha256:076e7bf82319619f28dd0aa9c02ab34b055ad37100395b4f49a2ffba04fb5e11 bash -c \"bash proposal/setup.sh && python3 -B proposal/qualify.py\""
        },
        {
          "name": "Remove only owned test container",
          "if": "always()",
          "run": "docker rm -f s2-cancel-save >/dev/null 2>&1 || true"
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "if": "always()",
          "with": {
            "name": "cancel-save-qualification-records",
            "path": "records/",
            "retention-days": 14,
            "if-no-files-found": "error"
          }
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "if": "always()",
          "with": {
            "name": "cancel-save-qualified-binaries",
            "path": "retained-binaries/",
            "retention-days": 14,
            "if-no-files-found": "warn"
          }
        }
      ]
    }
  }
}
