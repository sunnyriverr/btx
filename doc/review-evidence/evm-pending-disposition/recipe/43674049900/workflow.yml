name: Ethereum pending disposition qualification
on:
  push:
    branches: [codex/ci-evm-pending-disposition]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: btxchain/btx
          ref: f40eb37a6fb8b665340fe92a2f248ff3f23ec7f6
          sparse-checkout: contrib/swapnet
          path: product
          persist-credentials: false
      - name: Measure native pending recovery without product changes
        run: bash ci/evm-disposition/run.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: evm-pending-disposition
          path: records/
          retention-days: 30
